                    nextCards.push(updatedCard);
                    return nextCards;
                });
                setDraggedCardId(null);
            };

            // グループ内カードの並び替えソート（いいね順 / 班番号順 / 反転）
            const handleSortCategoryCards = (catId, sortType) => {
                setCards(prevCards => {
                    const targetCards = prevCards.filter(c => c.categoryId === catId);
                    if (targetCards.length <= 1) return prevCards;

                    let sorted = [...targetCards];
                    if (sortType === 'votes') {
                        sorted.sort((a, b) => (b.votes || 0) - (a.votes || 0));
                        showToast('👍 いいねが多い順に整列しました');
                    } else if (sortType === 'team') {
                        const getColorIndex = (c) => {
                            const idx = COLOR_PALETTE.findIndex(p => p.id === c.color);
                            return idx !== -1 ? idx : 999;
                        };
                        sorted.sort((a, b) => getColorIndex(a) - getColorIndex(b));
                        showToast('🔢 班番号順（①〜⑧）に整列しました');
                    } else if (sortType === 'reverse') {
                        sorted.reverse();
                        showToast('🔄 並び順を上下反転しました');
                    }

                    const result = [];
                    let sortedIdx = 0;
                    prevCards.forEach(c => {
                        if (c.categoryId === catId) {
                            result.push(sorted[sortedIdx++]);
                        } else {
                            result.push(c);
                        }
                    });
                    return result;
                });
            };

            const handleDragOver = (e) => e.preventDefault();

            const handleVote = (cardId) => {
                setCards(cards.map(c => c.id === cardId ? { ...c, votes: c.votes + 1 } : c));
            };

            // 🏷️ 付箋の階層（level: 0=親・大項目, 1=中項目, 2=小項目）を変更
            const handleChangeCardLevel = (cardId, delta) => {
                setCards(prevCards => {
                    const nextCards = prevCards.map(c => {
                        if (c.id === cardId) {
                            const currentLevel = c.level || 0;
                            const newLevel = Math.max(0, Math.min(2, currentLevel + delta));
                            return { ...c, level: newLevel };
                        }
                        return c;
                    });
                    broadcastToClients({ type: 'SYNC_CARDS', cards: nextCards, themeTitle: sessionThemeTitleRef.current });
                    return nextCards;
                });
            };

            // 🎨 付箋のカラーを変更（中項目・小項目の色分け対応）
            const handleChangeCardColor = (cardId, newColor) => {
                setCards(prevCards => {
                    const nextCards = prevCards.map(c => c.id === cardId ? { ...c, color: newColor } : c);
                    broadcastToClients({ type: 'SYNC_CARDS', cards: nextCards, themeTitle: sessionThemeTitleRef.current });
                    return nextCards;
                });
            };

            const handleDeleteCard = (cardId) => {
                setCards(cards.filter(c => c.id !== cardId));
            };

            const handleUpdateCardText = (cardId, newText) => {
                setCards(cards.map(c => c.id === cardId ? { ...c, text: newText } : c));
                showToast('付箋を更新しました');
            };

            const handleAddCategory = () => {
                if (!newCategoryTitle.trim()) return;
                const colors = ['bg-indigo-500', 'bg-teal-500', 'bg-orange-500', 'bg-purple-500', 'bg-cyan-500'];
                const randomColor = colors[categories.length % colors.length];
                const newCat = {
                    id: 'cat-' + Date.now(),
                    title: newCategoryTitle.trim(),
                    color: randomColor
                };
                setCategories([...categories, newCat]);
                setNewCategoryTitle('');
                setIsAddingCategory(false);
                showToast(`グループ「${newCat.title}」を作成しました`);
            };

            // グループの並び順を入れ替える（隣と交換 / 端まで移動）
            const handleMoveCategory = (catId, direction) => {
                setCategories(prev => {
                    const idx = prev.findIndex(c => c.id === catId);
                    if (idx < 0) return prev;
                    const next = [...prev];
                    const [moved] = next.splice(idx, 1);

                    let target;
                    if (direction === 'first') target = 0;
                    else if (direction === 'last') target = next.length;
                    else target = Math.max(0, Math.min(next.length, idx + (direction === 'left' ? -1 : 1)));

                    next.splice(target, 0, moved);
                    return next;
                });
            };

            const handleDeleteCategory = (catId) => {
                setCategories(categories.filter(c => c.id !== catId));
                setCards(cards.map(c => c.categoryId === catId ? { ...c, categoryId: null } : c));
                showToast('グループを削除しました');
            };

            const handleUpdateCategoryTitle = (catId, newTitle) => {
                setCategories(categories.map(c => c.id === catId ? { ...c, title: newTitle } : c));
                showToast('グループ名を変更しました');
            };

            // APIキー保存
            const handleSaveApiKey = () => {
                const key = configInputKey.trim();
                setGeminiApiKey(key);
                localStorage.setItem('bansho_gemini_api_key', key);
                setShowConfigModal(false);
                showToast(key ? 'Gemini APIキーを保存しました' : 'APIキーをクリアしました');
            };

            // APIキー削除
            const handleDeleteApiKey = () => {
                setGeminiApiKey('');
                setConfigInputKey('');
                localStorage.removeItem('bansho_gemini_api_key');
                showToast('APIキーを削除しました');
            };

            // Gemini API 呼び出しヘルパー（動的モデル検出 ＋ 優先候補フォールバック）
            const callGeminiApi = async (key, bodyPayload) => {
                let candidateModels = [
                    'gemini-3.6-flash-lite',
                    'gemini-3.6-flash',
                    'gemini-2.5-flash-lite',
                    'gemini-2.5-flash',
                    'gemini-2.0-flash',
                    'gemini-2.0-flash-lite',
                    'gemini-1.5-flash',
                    'gemini-1.5-flash-8b',
                    'gemini-1.5-pro'
                ];

                // 可能であればAPIキーに紐づく有効なモデル一覧をGoogleから直接取得して最優先化
                try {
                    const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                    if (listRes.ok) {
                        const listData = await listRes.json();
                        if (listData.models && Array.isArray(listData.models)) {
                            const availableModels = listData.models
                                .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
                                .map(m => m.name.replace('models/', ''));
                            
                            // flash系・lite系を優先してソート
                            const sorted = availableModels.sort((a, b) => {
                                const score = (name) => {
                                    if (name.includes('flash-lite')) return 10;
                                    if (name.includes('flash')) return 8;
                                    if (name.includes('gemini')) return 5;
                                    return 1;
                                };
                                return score(b) - score(a);
                            });

                            if (sorted.length > 0) {
                                candidateModels = [...new Set([...sorted, ...candidateModels])];
                            }
                        }
                    }
                } catch (e) {
                    console.log('Dynamic model list notice:', e);
                }

                let lastError = null;
                for (const model of candidateModels) {
                    try {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
                        const res = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(bodyPayload)
                        });
                        if (res.ok) {
                            const resData = await res.json();
                            return { resData, model };
                        }
                        const err = await res.json().catch(() => ({}));
                        lastError = new Error(err.error?.message || `HTTP ${res.status} (${model})`);
                    } catch (e) {
                        lastError = e;
                    }
                }
                throw lastError || new Error('利用可能なGeminiモデルが見つかりませんでした');
            };

            // APIキーテスト接続
            const handleTestApiKey = async () => {
                const key = configInputKey.trim() || geminiApiKey;
                if (!key) {
                    showToast('APIキーを入力してください');
                    return;
                }
                setIsTestingKey(true);
                try {
                    const { model } = await callGeminiApi(key, {
                        contents: [{ parts: [{ text: 'ping' }] }]
                    });
                    showToast(`✅ Gemini (${model}) への接続テストに成功しました！`);
                } catch (e) {
                    alert('接続エラー: ' + e.message);
                } finally {
                    setIsTestingKey(false);
                }
            };

            // ✨ Gemini 本格AIクラスタリング
            const handleAiCluster = async () => {
                if (cards.length === 0) {
                    showToast('分類対象の意見がありません！');
                    return;
                }

                if (!geminiApiKey) {
                    // APIキーがない場合は設定モーダルを開く
                    setConfigInputKey('');
                    setShowConfigModal(true);
                    showToast('⚙️ Gemini APIキーを設定すると、完全自動AI整理が有効になります');
                    return;
                }

                setIsAiProcessing(true);

                const palette = [
                    'bg-amber-500', 'bg-indigo-500', 'bg-rose-500', 
                    'bg-emerald-500', 'bg-sky-500', 'bg-purple-500', 'bg-teal-500'
                ];

                const prompt = `あなたは研修・ワークショップの板書・意見整理ファシリテーターAIです。
以下の受講者から出された意見（付箋カード）の一覧を分析し、意見の文脈・類似性に基づいて最適な3〜5個のグループ（カテゴリ）に分類してください。

【出力要件】
1. グループ名（title）は意見の内容に最も適した分かりやすい日本語とし、先頭に適切な絵文字を1つ付けてください（例: "💡 UI・操作性の改善要望", "⚠️ 承認フローの課題", "🚀 今後の活用アイデア"）。
2. 各グループごとに、そのグループの意見の共通点・重要ポイント・ネクストアクションを的確にまとめた2〜3行の要約文（summary）を作成してください。
3. 全てのカードを必ずいずれかのグループに割り当ててください。

【入力カード一覧】
${cards.map(c => `- ID: "${c.id}", 意見: "${c.text}", 投稿者: "${c.author || '匿名'}"`).join('\n')}

【出力JSONフォーマット】
{
  "categories": [
    {
      "id": "cat-1",
      "title": "💡 グループ名",
      "summary": "要約文"
    }
  ],
  "cardAssignments": [
    {
      "cardId": "c-xxx",
      "categoryId": "cat-1"
    }
  ]
}`;

                try {
                    const { resData, model } = await callGeminiApi(geminiApiKey, {
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            temperature: 0.2
                        }
                    });

                    const rawJson = resData.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!rawJson) throw new Error('AIからの応答が空でした');

                    const parsed = JSON.parse(rawJson);

                    // 新しいカテゴリ一覧の構築
                    const newCategories = (parsed.categories || []).map((cat, idx) => ({
                        id: cat.id || `cat-ai-${idx+1}`,
                        title: cat.title || `グループ ${idx+1}`,
                        color: palette[idx % palette.length]
                    }));

                    // AI要約マップ
                    const newSummaries = {};
                    (parsed.categories || []).forEach((cat, idx) => {
                        const cid = cat.id || `cat-ai-${idx+1}`;
                        if (cat.summary) newSummaries[cid] = cat.summary;
                    });

                    // 各カードのカテゴリ割り当て
                    const assignmentMap = {};
                    (parsed.cardAssignments || []).forEach(a => {
                        assignmentMap[a.cardId] = a.categoryId;
                    });

                    const updatedCards = cards.map(c => ({
                        ...c,
                        categoryId: assignmentMap[c.id] || (newCategories[0] ? newCategories[0].id : null)
                    }));

                    setCategories(newCategories.length > 0 ? newCategories : INITIAL_CATEGORIES);
                    setSummaries(newSummaries);
                    setCards(updatedCards);
                    showToast(`✨ Gemini (${model}) により ${newCategories.length} 個のグループに自動分類・要約しました！`);
                } catch (e) {
                    console.error('Gemini error:', e);
                    alert('AI整理中にエラーが発生しました:\n' + e.message);
                } finally {
                    setIsAiProcessing(false);
                }
            };

            const generateMarkdown = () => {
                let md = `# 📋 板書レポート: ${sessionThemeTitle}\n\n日時: ${new Date().toLocaleDateString('ja-JP')}\n\n`;
                categories.forEach(cat => {
                    const catCards = cards.filter(c => c.categoryId === cat.id);
                    md += `## ${cat.title}\n`;
                    if (summaries[cat.id]) {
                        md += `> 💡 **AI要約:** ${summaries[cat.id]}\n\n`;
                    }
                    if (catCards.length === 0) {
                        md += `*(意見なし)*\n\n`;
                    } else {
                        catCards.forEach(c => {
                            const level = c.level || 0;
                            const prefix = level === 2 ? '    - ↳↳ ' : (level === 1 ? '  - ↳ ' : '- ');
                            md += `${prefix}${c.text} (by ${c.author || '匿名'}, 👍 ${c.votes || 0})\n`;
                        });
                        md += `\n`;
                    }
                });
                return md;
            };

            // 参加者用URL生成
            const participantUrl = `${window.location.origin}${window.location.pathname}?role=participant&room=${activeRoomId}`;

            // ローカル環境（file:// や localhost）で開いているとQRの読み取りに成功しても
            // 受講者のスマホからはそのURLに到達できない。その場合は公開URLでQRを作る。
            const isLocalOrigin =
                window.location.protocol === 'file:' ||
                /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(window.location.hostname);

            const qrTargetUrl = (isLocalOrigin && publicBaseUrl.trim())
                ? `${publicBaseUrl.trim().replace(/\/*$/, '/')}?role=participant&room=${activeRoomId}`
                : participantUrl;

            // 高解像度で生成する。表示サイズ(256px)より十分大きい画像でないと
            // 高DPI/拡大表示のPCで補間ボケが起き、スマホのカメラが読み取れない。
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=50&data=${encodeURIComponent(qrTargetUrl)}`;
            const uncategorizedCards = cards.filter(c => c.categoryId === null);

            return (
                <div className="h-full flex flex-col relative">
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="absolute top-4 right-4 z-50 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl border border-slate-700 flex items-center gap-2">
                            <i className="fa-solid fa-circle-check text-emerald-400"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Header (整理された1段統合・中央特大テーマ & 役割別ボタングループ) */}
                    <header className={`bg-slate-950 text-white shadow-xl z-20 shrink-0 ${isParticipantOnly ? 'px-3.5 py-2' : 'px-5 py-2.5'} flex items-center justify-between border-b border-slate-800 gap-3`}>
                        
                        {/* ⬅ 左側：ロゴ & アプリ名（3段構え: 講師PC / 一般PC / スマホ） */}
                        <div className="flex items-center space-x-2.5 shrink-0">
                            <div className={`bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold shadow-inner ${isParticipantOnly && isMobile ? 'w-7 h-7 text-sm' : 'w-9 h-9 text-base sm:text-lg'}`}>
                                <i className={isParticipantOnly ? (isMobile ? "fa-solid fa-mobile-screen" : "fa-solid fa-laptop") : "fa-solid fa-chalkboard-user"}></i>
                            </div>
                            <div>
                                <h1 className={`${isParticipantOnly && isMobile ? 'text-xs' : 'text-sm'} font-bold tracking-wide flex items-center gap-1.5 leading-tight`}>
                                    {isParticipantOnly ? (isMobile ? "受講者ポータル" : "受講者ボード") : "講師進行ボード"}
                                    <span className="text-[9px] bg-indigo-600/90 text-white px-1.5 py-0.2 rounded font-mono font-bold">{APP_VERSION}</span>
                                </h1>
                                <p className="text-[10px] text-slate-400 hidden sm:block">
                                    {isParticipantOnly 
                                        ? (isMobile ? "手元のスマホで意見投稿・スライド確認" : "大画面でスライド閲覧＆リアルタイム意見投稿")
                                        : "リアルタイム意見収集 ➔ スライド投影 ➔ AI一元整理"}
                                </p>
                            </div>
                        </div>

                        {/* 🎯 中央：本日のテーマ（大画面の主役・中央特大フォント・インライン編集） */}
                        {appRole === 'board' && !isParticipantOnly ? (
                            <div className="flex-1 flex items-center justify-center max-w-2xl mx-2">
                                {isEditingThemeTitle ? (
                                    <div className="flex items-center gap-2 w-full">
                                        <input 
                                            type="text"
                                            value={tempThemeTitle}
                                            onChange={(e) => setTempThemeTitle(e.target.value)}
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter') handleSaveThemeTitle(tempThemeTitle);
                                                if (e.key === 'Escape') setIsEditingThemeTitle(false);
                                            }}
                                            autoFocus
                                            placeholder="例: 2026年度 新人研修 振り返りワーク"
                                            className="bg-slate-900 text-white text-sm sm:text-base lg:text-lg font-bold border-2 border-indigo-400 rounded-xl px-3 py-1 flex-1 focus:outline-none focus:ring-2 focus:ring-indigo-400 shadow-inner"
                                        />
                                        <button 
                                            onClick={() => handleSaveThemeTitle(tempThemeTitle)}
                                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1 shadow shrink-0">
                                            <i className="fa-solid fa-check"></i> 保存
                                        </button>
                                        <button 
                                            onClick={() => setIsEditingThemeTitle(false)}
                                            className="text-slate-400 hover:text-white px-2 py-1 text-xs transition shrink-0">
                                            取消
                                        </button>
                                    </div>
                                ) : (
                                    <div 
                                        onClick={() => {
                                            setTempThemeTitle(sessionThemeTitle);
                                            setIsEditingThemeTitle(true);
                                        }}
                                        title="クリックしてテーマタイトルを編集"
                                        className="group flex items-center gap-2 cursor-pointer bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 hover:border-indigo-500/50 px-3.5 py-1.5 rounded-2xl transition shadow-inner w-full">
                                        <span className="bg-amber-400 text-slate-950 font-black text-[10px] sm:text-xs px-2 py-0.5 rounded-md shrink-0 shadow-2xs">
                                            🎯 テーマ
                                        </span>
                                        <h2 className="text-xs sm:text-sm md:text-base font-black text-white group-hover:text-indigo-200 transition tracking-wide leading-snug break-words">
                                            {sessionThemeTitle}
                                        </h2>
                                        <i className="fa-solid fa-pen text-[10px] text-slate-500 opacity-0 group-hover:opacity-100 group-hover:text-indigo-300 transition shrink-0 ml-auto"></i>
                                    </div>
                                )}
                            </div>
                        ) : null}

                        {/* ➡ 右側：スリム化された操作ボタン群 */}
                        <div className="flex items-center space-x-2 shrink-0">
                            {/* 参加者専用URLアクセス時 */}
                            {isParticipantOnly ? (
                                <button 
                                    onClick={() => connectToHost()}
                                    title={peerConnected ? "講師ボードと接続中" : "タップして再接続を試行"}
                                    className={`flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-lg border transition font-medium cursor-pointer active:scale-95 ${peerConnected ? 'bg-emerald-950/80 text-emerald-300 border-emerald-700/60' : 'bg-amber-950/90 text-amber-300 border-amber-600/70 hover:bg-amber-900'}`}>
                                    <span className={`w-2 h-2 rounded-full ${peerConnected ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                                    <span>{peerConnected ? 'ボード接続中' : '待機中 (タップ再接続)'}</span>
                                </button>
                            ) : (
                                <>
                                    {/* 👥 講師用：受講者のリアルタイム接続状況（クリックでQRコード表示） */}
                                    <div 
                                        onClick={() => setShowQrModal(true)}
                                        title={`現在 ${connectedCount} 台の受講者と接続中（クリックで参加者QRコード表示）`}
                                        className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 px-2.5 py-1.5 rounded-xl border border-slate-800 text-xs font-bold text-slate-300 hover:text-white transition cursor-pointer shadow-sm">
                                        <span className={`w-2 h-2 rounded-full ${connectedCount > 0 ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'}`}></span>
                                        <span className="text-[11px]">{connectedCount > 0 ? `👥 受講者 ${connectedCount}台` : '👥 受講者 待機中'}</span>
                                    </div>

                                    {/* ⏱️ 研修進行グループ（タイマー & 投稿受付ロック） */}
                                    <div className="flex items-center gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800">
                                        {/* タイマー表示 & コントロール */}
                                        <div className="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800">
                                            {timerSeconds > 0 || isTimeUp ? (
                                                <div className="flex items-center gap-1.5">
                                                    <span className={`font-mono font-black text-xs sm:text-sm px-1.5 py-0.2 rounded flex items-center gap-1 ${isTimeUp ? 'bg-rose-600 text-white animate-bounce' : (timerSeconds <= 30 ? 'bg-amber-500 text-slate-950 animate-pulse' : 'bg-indigo-900/80 text-indigo-200')}`}>
                                                        <span>{isTimeUp ? '🔔 終了' : '⏱️'}</span>
                                                        <span>{formatTime(timerSeconds)}</span>
                                                    </span>
                                                    <button
                                                        onClick={handleToggleTimer}
                                                        title={isTimerRunning ? "一時停止" : "再開"}
                                                        className="text-slate-300 hover:text-white p-0.5 text-xs transition cursor-pointer">
                                                        <i className={`fa-solid ${isTimerRunning ? 'fa-pause' : 'fa-play'}`}></i>
                                                    </button>
                                                    <button
                                                        onClick={handleResetTimer}
                                                        title="タイマーをリセット"
                                                        className="text-slate-400 hover:text-rose-400 p-0.5 text-xs transition cursor-pointer">
                                                        <i className="fa-solid fa-xmark"></i>
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="flex items-center gap-0.5">
                                                    <span className="text-[10px] text-slate-400 font-bold mr-0.5">⏱️</span>
                                                    <button onClick={() => handleStartTimer(1)} className="px-1.5 py-0.5 hover:bg-slate-800 rounded text-[10px] font-bold text-slate-300 hover:text-white cursor-pointer">1分</button>
                                                    <button onClick={() => handleStartTimer(3)} className="px-1.5 py-0.5 hover:bg-slate-800 rounded text-[10px] font-bold text-indigo-300 hover:text-white bg-indigo-950/60 border border-indigo-800/40 cursor-pointer">3分</button>
                                                    <button onClick={() => handleStartTimer(5)} className="px-1.5 py-0.5 hover:bg-slate-800 rounded text-[10px] font-bold text-slate-300 hover:text-white cursor-pointer">5分</button>
                                                    <button onClick={() => handleStartTimer(10)} className="px-1.5 py-0.5 hover:bg-slate-800 rounded text-[10px] font-bold text-slate-300 hover:text-white cursor-pointer">10分</button>
                                                </div>
                                            )}
                                        </div>

                                        {/* 🔒 投稿受付ロック切り替えボタン */}
                                        <button
                                            onClick={handleToggleLock}
                                            title={isSubmissionsLocked ? "クリックして投稿受付を再開" : "クリックして受講者の投稿を一時停止（解説モード）"}
                                            className={`px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 active:scale-95 shadow-sm cursor-pointer ${isSubmissionsLocked ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-600/30 animate-pulse'}`}>
                                            <i className={`fa-solid ${isSubmissionsLocked ? 'fa-lock' : 'fa-lock-open'}`}></i>
                                            <span className="hidden sm:inline">{isSubmissionsLocked ? '受付停止中' : '受付中'}</span>
                                        </button>
                                    </div>

                                    {/* 📄 スライド資料設定ボタン */}
                                    <button 
                                        onClick={() => {
                                            setSlideInputUrl(slideUrl);
                                            setSlideInputPageStart(slidePageStart);
                                            setSlideInputPageEnd(slidePageEnd);
                                            setShowSlideModal(true);
                                        }}
                                        title="研修スライド（Googleスライド / PDF）のURL設定"
                                        className={`px-2.5 py-1.5 rounded-xl border text-xs transition flex items-center gap-1.5 font-bold shadow-sm ${slideUrl ? 'bg-indigo-950 text-indigo-300 border-indigo-500/60 hover:bg-indigo-900' : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border-slate-800'}`}>
                                        <i className="fa-solid fa-file-powerpoint text-indigo-400"></i>
                                        <span className="hidden lg:inline">スライド設定</span>
                                    </button>

                                    {/* 🖥️ 画面配信ボタン */}
                                    <button
                                        onClick={() => isScreenSharing ? stopScreenShare() : startScreenShare()}
                                        title={isScreenSharing ? "画面配信を終了する" : "講師PCの画面を受講者のスマホへ配信する"}
                                        className={`px-2.5 py-1.5 rounded-xl border text-xs transition flex items-center gap-1.5 font-bold shadow-sm ${isScreenSharing ? 'bg-rose-950 text-rose-300 border-rose-500/60 hover:bg-rose-900' : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border-slate-800'}`}>
                                        <i className={`fa-solid ${isScreenSharing ? 'fa-circle-stop' : 'fa-desktop'} ${isScreenSharing ? 'text-rose-400' : 'text-sky-400'}`}></i>
                                        <span className="hidden lg:inline">{isScreenSharing ? '配信停止' : '画面配信'}</span>
                                        {isScreenSharing && <span className="w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse"></span>}
                                    </button>

                                    {/* 🔗 リンク共有ボタン（埋め込めないサイトを受講者に開いてもらう） */}
                                    <button
                                        onClick={() => {
                                            setLinkInputUrl(sharedLink ? sharedLink.url : '');
                                            setLinkInputLabel(sharedLink ? (sharedLink.label || '') : '');
                                            setShowLinkModal(true);
                                        }}
                                        title="受講者にURLを配る（Gemini等、埋め込めないサイト向け）"
                                        className={`px-2.5 py-1.5 rounded-xl border text-xs transition flex items-center gap-1.5 font-bold shadow-sm ${sharedLink ? 'bg-emerald-950 text-emerald-300 border-emerald-500/60 hover:bg-emerald-900' : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border-slate-800'}`}>
                                        <i className="fa-solid fa-link text-emerald-400"></i>
                                        <span className="hidden lg:inline">リンク共有</span>
                                        {sharedLink && <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>}
                                    </button>

                                    {/* ⚙️ メニュー・設定統合ボタン（AI整理・保存・記録・新規・設定を一括集約） */}
                                    <button 
                                        onClick={() => setShowMenuModal(true)}
                                        title="メニュー・設定（AI整理 / 保存 / 過去の記録 / 新規板書 / API設定）"
                                        className="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-md flex items-center gap-1.5 transition active:scale-95 cursor-pointer">
                                        <i className="fa-solid fa-bars"></i>
                                        <span>メニュー</span>
                                        {archives.length > 0 && (
                                            <span className="bg-white/20 text-white text-[9px] px-1.5 py-0.2 rounded-full font-mono">
                                                {archives.length}
                                            </span>
                                        )}
                                    </button>
                                </>
                            )}
                        </div>
                    </header>

                    {/* 🖥️ 画面配信中インジケーター（講師のみ） */}
                    {appRole === 'board' && isScreenSharing && (
                        <div className="bg-rose-950/95 border-b border-rose-700/60 px-3 py-1.5 flex items-center justify-between gap-3 shrink-0 shadow-md flex-wrap">
                            <div className="flex items-center gap-2 text-[11px] font-bold text-rose-200 min-w-0">
                                <span className="w-2 h-2 rounded-full bg-rose-400 animate-pulse shrink-0"></span>
                                <span className="truncate">画面を配信中</span>
                                {screenStats && (
                                    <span className="text-[10px] text-rose-300/90 font-mono bg-rose-900/60 border border-rose-700/50 px-1.5 py-0.5 rounded shrink-0">
                                        {screenStats.w}px · {screenStats.fmt} {screenStats.kb}KB/枚 · 設定{screenIntervalMs / 1000}秒 →
                                        {' '}tick {screenStats.tickHz}/s · 送信 <b className="text-white">{screenStats.fps}fps</b> · {screenStats.kbps}KB/s
                                        {screenStats.noChange > 0 && (
                                            <span className="text-sky-300"> · 変化なし {screenStats.noChange}</span>
                                        )}
                                        {screenStats.dropped > 0 && (
                                            <span className="text-amber-300"> · 破棄 {screenStats.dropped}</span>
                                        )}
                                        {screenStats.queuedKB > 0 && (
                                            <span className="text-rose-300"> · 滞留 {screenStats.queuedKB}KB</span>
                                        )}
                                    </span>
                                )}
                            </div>

                            <div className="flex items-center gap-2 shrink-0">
                                {/* 画質 */}
                                <div className="flex items-center gap-0.5 bg-rose-900/50 border border-rose-700/50 rounded-lg px-1.5 py-0.5">
                                    <span className="text-[10px] text-rose-300/80 font-medium mr-0.5">画質</span>
                                    {Object.keys(SCREEN_QUALITY_PRESETS).map(key => (
                                        <button
                                            key={key}
                                            onClick={() => setScreenQuality(key)}
                                            title={`${SCREEN_QUALITY_PRESETS[key].width}px（1枚 ${SCREEN_QUALITY_PRESETS[key].note}）`}
                                            className={`px-1.5 py-0.5 rounded text-[10px] font-bold transition ${screenQuality === key ? 'bg-white text-rose-800' : 'text-rose-200 hover:bg-rose-800'}`}>
                                            {SCREEN_QUALITY_PRESETS[key].label}
                                        </button>
                                    ))}
                                </div>

                                {/* 更新間隔 */}
                                <div className="flex items-center gap-0.5 bg-rose-900/50 border border-rose-700/50 rounded-lg px-1.5 py-0.5">
                                    <span className="text-[10px] text-rose-300/80 font-medium mr-0.5">更新</span>
                                    {SCREEN_INTERVAL_OPTIONS.map(opt => (
                                        <button
                                            key={opt.ms}
                                            onClick={() => setScreenIntervalMs(opt.ms)}
                                            title={`${opt.label}ごとに更新`}
                                            className={`px-1.5 py-0.5 rounded text-[10px] font-bold transition ${screenIntervalMs === opt.ms ? 'bg-white text-rose-800' : 'text-rose-200 hover:bg-rose-800'}`}>
                                            {opt.label}
                                        </button>
                                    ))}
                                </div>

                                <button
                                    onClick={() => stopScreenShare()}
                                    className="bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-bold px-3 py-1 rounded-lg shadow transition active:scale-95">
                                    配信を停止
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 🔗 講師から配られたリンク（受講者は開くだけ、講師は解除できる） */}
                    {sharedLink && sharedLink.url && (
                        <div className="bg-emerald-950/95 border-b border-emerald-700/60 px-3 py-2 flex items-center justify-between gap-3 shrink-0 shadow-md">
                            <div className="flex items-center gap-2 min-w-0">
                                <i className="fa-solid fa-link text-emerald-400 text-xs shrink-0"></i>
                                <div className="min-w-0">
                                    <p className="text-[11px] font-bold text-emerald-200 truncate">
                                        {sharedLink.label || '講師からのリンク'}
                                    </p>
                                    <p className="text-[10px] text-emerald-500/80 font-mono truncate">{sharedLink.url}</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-1.5 shrink-0">
                                <a
                                    href={sharedLink.url}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg shadow transition active:scale-95 flex items-center gap-1.5">
                                    <i className="fa-solid fa-up-right-from-square text-[10px]"></i> 開く
                                </a>
                                {appRole === 'board' && (
                                    <button
                                        onClick={handleClearSharedLink}
                                        title="リンクの共有を解除"
                                        className="text-emerald-400/70 hover:text-rose-400 p-1.5 transition">
                                        <i className="fa-solid fa-xmark text-xs"></i>
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {appRole === 'participant' ? (
                        isMobile ? (
                            /* 📱 受講者スマホビュー（3タブ構成: スライド ➔ 投稿 ➔ 意見） */
                            <div className="flex-1 bg-slate-900 p-2 sm:p-4 overflow-x-hidden overflow-y-hidden flex flex-col items-center justify-start h-full min-h-0 w-full max-w-full">
                                <div className="max-w-md w-full max-w-full flex flex-col h-full min-h-0 gap-2 overflow-x-hidden">
                                    
                                    {/* ⏱️ リアルタイム同期タイマーバー */}
                                    {(timerSeconds > 0 || isTimeUp) && (
                                        <div className={`px-3 py-1.5 rounded-xl border flex items-center justify-between shadow-md shrink-0 transition-all ${isTimeUp ? 'bg-rose-900/90 border-rose-500 text-white animate-bounce' : (timerSeconds <= 30 ? 'bg-amber-900/90 border-amber-500 text-amber-200 animate-pulse' : 'bg-indigo-950/90 border-indigo-500/50 text-indigo-100')}`}>
                                            <div className="flex items-center gap-1.5 font-bold text-xs">
                                                <span className="text-sm">{isTimeUp ? '🔔' : '⏱️'}</span>
                                                <span>{isTimeUp ? '時間終了！' : (isTimerRunning ? '残りワーク時間' : 'タイマー一時停止中')}</span>
                                            </div>
                                            <span className="font-mono font-black text-sm tracking-wider bg-black/30 px-2 py-0.5 rounded-md">
                                                {formatTime(timerSeconds)}
                                            </span>
                                        </div>
                                    )}

                                    {/* 📌 現在のテーマタイトル表示バナー */}
                                    <div className="bg-gradient-to-r from-indigo-900/90 to-slate-800/90 px-3 py-1.5 rounded-xl border border-indigo-500/30 flex items-center justify-between gap-2 shadow-xs shrink-0">
                                        <div className="flex items-center gap-1.5 min-w-0">
                                            <span className="text-[10px] bg-amber-400 text-slate-900 font-bold px-1.5 py-0.2 rounded shrink-0">テーマ</span>
                                            <h2 className="text-xs font-bold text-white truncate">
                                                {sessionThemeTitle}
                                            </h2>
                                        </div>
                                        {isSubmissionsLocked && (
                                            <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded font-bold shrink-0 flex items-center gap-1">
                                                <i className="fa-solid fa-lock text-[9px]"></i> 受付停止中
                                            </span>
                                        )}
                                    </div>

                                    {/* タブ切り替えバー（配信中は先頭に「画面」タブが増える） */}
                                    <div className="bg-slate-800 p-1 rounded-xl border border-slate-700 flex items-center gap-1 shrink-0 shadow-md">
                                        {isScreenSharing && (
                                            <button
                                                onClick={() => setParticipantTab('screen')}
                                                className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1 ${participantTab === 'screen' ? 'bg-rose-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                                <i className="fa-solid fa-desktop text-rose-300"></i> 画面
                                                <span className="w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse"></span>
                                            </button>
                                        )}
                                        <button 
                                            onClick={() => setParticipantTab('slide')}
                                            className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1 ${participantTab === 'slide' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                            <i className="fa-solid fa-file-powerpoint text-indigo-300"></i> スライド
                                            {slideUrl && (
                                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                            )}
                                        </button>
                                        <button 
                                            onClick={() => setParticipantTab('post')}
                                            className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1 ${participantTab === 'post' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                            <i className="fa-solid fa-pen-to-square"></i> 投稿
                                        </button>
                                        <button 
                                            onClick={() => setParticipantTab('timeline')}
                                            className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1 ${participantTab === 'timeline' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                            <i className="fa-solid fa-comments"></i> 意見
                                            <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-mono font-bold ${participantTab === 'timeline' ? 'bg-white text-indigo-700' : 'bg-slate-700 text-slate-300'}`}>
                                                {cards.length}
                                            </span>
                                        </button>
                                    </div>

                                    {participantTab === 'screen' ? (
                                        /* 🖥️ 講師の画面配信 */
                                        <div className="bg-slate-800/95 rounded-2xl p-2.5 border border-slate-700 shadow-xl backdrop-blur-sm flex-1 flex flex-col min-h-0 overflow-hidden">
                                            <div className="flex items-center justify-between mb-1.5 pb-1 border-b border-slate-700/80 shrink-0">
                                                <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                                                    <i className="fa-solid fa-desktop text-rose-400"></i>
                                                    講師の画面
                                                    <span className="bg-rose-500/20 text-rose-300 border border-rose-500/40 text-[10px] px-1.5 py-0.2 rounded-full font-bold flex items-center gap-1">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse"></span> LIVE
                                                    </span>
                                                </h3>
                                                <span className="text-[10px] text-slate-500">操作の様子が数秒ごとに更新されます</span>
                                            </div>

                                            <div className="flex-1 min-h-0 flex items-center justify-center bg-slate-950 rounded-xl border border-slate-700 overflow-hidden select-none">
                                                {screenFrame ? (
                                                    <img
                                                        src={screenFrame}
                                                        alt="講師の画面"
                                                        draggable={false}
                                                        onContextMenu={(e) => e.preventDefault()}
                                                        className="max-w-full max-h-full object-contain pointer-events-none"
                                                    />
                                                ) : (
                                                    <div className="text-center text-slate-400 p-6">
                                                        <i className="fa-solid fa-spinner fa-spin text-2xl mb-2 text-rose-400"></i>
                                                        <p className="text-xs font-bold">画面の受信を待っています…</p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ) : participantTab === 'post' ? (
                                        /* 📝 投稿・履歴タブ */
                                        <div className="flex flex-col flex-1 min-h-0 gap-2">
                                            {/* 📜 あなたの投稿履歴 */}
                                            <div className="bg-slate-800/95 rounded-2xl p-2.5 border border-slate-700 shadow-xl backdrop-blur-sm flex-1 min-h-0 flex flex-col overflow-hidden">
                                                <div className="flex items-center justify-between mb-1.5 pb-1 border-b border-slate-700/80 shrink-0">
                                                    <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                                                        <i className="fa-solid fa-clock-rotate-left text-amber-400 text-[11px]"></i>
                                                        あなたの投稿履歴
                                                        <span className="bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 text-[10px] px-1.5 py-0.2 rounded-full font-mono">
                                                            {myHistory.length} 件
                                                        </span>
                                                    </h3>
                                                    {myHistory.length > 0 && (
                                                        <button 
                                                            onClick={handleClearHistory}
                                                            className="text-[10px] text-slate-400 hover:text-rose-400 transition flex items-center gap-1">
                                                            <i className="fa-solid fa-trash-can text-[9px]"></i> 履歴消去
                                                        </button>
                                                    )}
                                                </div>

                                                {myHistory.length === 0 ? (
                                                    <div className="text-center py-4 border border-dashed border-slate-700 rounded-xl my-auto">
                                                        <p className="text-[11px] text-slate-400 font-medium">まだ投稿した意見はありません</p>
                                                        <p className="text-[10px] text-slate-500 mt-0.5">下のフォームから意見を送信してみましょう！</p>
                                                    </div>
                                                ) : (
                                                    <div className="space-y-1.5 flex-1 overflow-y-auto pr-1">
                                                        {myHistory.map((item) => (
                                                            <div 
                                                                key={item.id} 
                                                                className={`${item.color} p-2 rounded-xl border shadow-xs flex flex-col justify-between transition hover:shadow-sm`}>
                                                                <div className="flex items-center justify-between gap-1.5 mb-1">
                                                                    <div className="flex items-center gap-1.5">
                                                                        <span className="text-[9px] font-bold bg-black/10 text-slate-800 px-1.5 py-0.2 rounded flex items-center gap-1">
                                                                            <span>{getAvatarByName(item.author)}</span>
                                                                            <span>{item.author || '受講者'}</span>
                                                                        </span>
                                                                        {item.createdAt && (
                                                                            <span className="text-[9px] text-black/60 font-mono">
                                                                                🕒 {item.createdAt}
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                    <div className="flex items-center gap-1">
                                                                        <button 
                                                                            onClick={() => handleReuseHistory(item)}
                                                                            title="この内容をもう一度入力欄にセット"
                                                                            className="text-slate-700 hover:text-slate-900 bg-white/70 hover:bg-white px-1.5 py-0.5 rounded text-[9px] font-bold transition flex items-center gap-1 shadow-2xs">
                                                                            <i className="fa-solid fa-arrow-rotate-left text-[8px]"></i> 再利用
                                                                        </button>
                                                                        <button 
                                                                            onClick={() => handleCancelSend(item)}
                                                                            title="この意見の送信を取り消す"
                                                                            className="text-rose-700 hover:text-white bg-rose-500/15 hover:bg-rose-600 px-1.5 py-0.5 rounded text-[9px] font-bold transition flex items-center gap-1 border border-rose-400/30">
                                                                            <i className="fa-solid fa-trash-can text-[8px]"></i> 取消
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                                <p className="text-xs font-medium leading-snug break-words text-slate-800">
                                                                    {item.text}
                                                                </p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            {/* 📝 意見投稿フォーム */}
                                            <div className="bg-slate-800/95 rounded-2xl p-2.5 border border-slate-700 shadow-xl backdrop-blur-sm shrink-0 flex flex-col gap-2">
                                                {/* 名前入力 & 班カラーパレット */}
                                                <div className="flex flex-col gap-1.5">
                                                    {/* 名前と色を横並びにし、行の高さを揃える */}
                                                    {(() => {
                                                        const sel = COLOR_PALETTE.find(c => c.id === selectedColor) || COLOR_PALETTE[0];
                                                        return (
                                                            <div className="flex items-stretch gap-1.5">
                                                                <div className="relative flex-1 min-w-0">
                                                                    <input
                                                                        type="text"
                                                                        value={participantName}
                                                                        onChange={(e) => handleParticipantNameChange(e.target.value)}
                                                                        placeholder="お名前"
                                                                        className="w-full h-11 bg-slate-900 border border-slate-600 rounded-lg pl-8 pr-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                                                    />
                                                                    <span className="absolute left-2 top-1/2 -translate-y-1/2 text-base pointer-events-none">
                                                                        {getAvatarByName(participantName)}
                                                                    </span>
                                                                </div>

                                                                <button
                                                                    type="button"
                                                                    onClick={() => setShowColorPicker(v => !v)}
                                                                    title={`付箋の色: ${sel.name}`}
                                                                    className="h-11 shrink-0 flex items-center gap-1.5 bg-slate-900 border border-slate-600 rounded-lg px-2 active:scale-[0.98] transition">
                                                                    <span className={`w-7 h-7 rounded-md flex items-center justify-center font-mono font-bold text-sm shrink-0 ${sel.bg} ${sel.text}`}>
                                                                        {sel.numLabel}
                                                                    </span>
                                                                    <span className="text-[10px] text-slate-200 font-bold truncate max-w-[64px] hidden min-[340px]:inline">
                                                                        {sel.name.replace(/\s*\(.*\)$/, '')}
                                                                    </span>
                                                                    <i className={`fa-solid ${showColorPicker ? 'fa-chevron-up' : 'fa-chevron-down'} text-slate-400 text-[10px] shrink-0`}></i>
                                                                </button>
                                                            </div>
                                                        );
                                                    })()}

                                                    {/* 🎨 色の一覧（上の色ボタンで開閉。選ぶと自動で閉じる） */}
                                                    {showColorPicker && (
                                                        <div className="grid grid-cols-5 gap-1.5 bg-slate-900 border border-slate-600 rounded-lg p-2">
                                                            {COLOR_PALETTE.map((c) => (
                                                                <button
                                                                    key={c.id}
                                                                    type="button"
                                                                    onClick={() => { setSelectedColor(c.id); setShowColorPicker(false); }}
                                                                    title={c.name}
                                                                    className={`h-12 rounded-lg flex items-center justify-center font-mono font-bold text-base transition ${c.bg} ${c.text} ${selectedColor === c.id ? 'ring-2 ring-indigo-400 scale-105 shadow' : 'opacity-80 active:opacity-100'}`}>
                                                                    {c.numLabel}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>

                                                <form onSubmit={handleSendParticipantCard} className="flex flex-col gap-1.5">
                                                    <div className="relative">
                                                        <textarea
                                                            value={inputText}
                                                            onChange={(e) => setInputText(e.target.value)}
                                                            disabled={isSubmissionsLocked}
