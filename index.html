                        <span className="text-[11px] font-bold text-slate-500 shrink-0">👤 名前:</span>
                        <input 
                            type="text"
                            value={facilitatorName}
                            onChange={(e) => setFacilitatorName(e.target.value)}
                            placeholder="講師"
                            className="w-16 bg-white border border-slate-300 rounded px-1.5 py-0.5 text-xs font-bold text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                        />
                    </div>

                    {/* 階層選択（大 / ↳中 / ↳↳小） */}
                    <div className="flex items-center space-x-0.5 bg-slate-100 p-0.5 rounded-lg border border-slate-200 shrink-0">
                        <button
                            type="button"
                            onClick={() => setInputLevel(0)}
                            title="大項目（第1階層・親）として追加"
                            className={`px-2 py-1 rounded text-[11px] font-bold transition ${inputLevel === 0 ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-800'}`}>
                            大
                        </button>
                        <button
                            type="button"
                            onClick={() => setInputLevel(1)}
                            title="中項目（第2階層・子）として追加"
                            className={`px-2 py-1 rounded text-[11px] font-bold transition flex items-center gap-0.5 ${inputLevel === 1 ? 'bg-amber-100 text-amber-900 shadow-xs font-black' : 'text-slate-500 hover:text-slate-800'}`}>
                            <span>↳</span> 中
                        </button>
                        <button
                            type="button"
                            onClick={() => setInputLevel(2)}
                            title="小項目（第3階層・具体）として追加"
                            className={`px-2 py-1 rounded text-[11px] font-bold transition flex items-center gap-0.5 ${inputLevel === 2 ? 'bg-indigo-100 text-indigo-900 shadow-xs font-black' : 'text-slate-500 hover:text-slate-800'}`}>
                            <span>↳↳</span> 小
                        </button>
                    </div>

                    {/* カラーパレット */}
                    <div className="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg border border-slate-200 shrink-0">
                        {COLOR_PALETTE.map(color => (
                            <button
                                key={color.id}
                                type="button"
                                onClick={() => setSelectedColor(color.id)}
                                title={`付箋カラー: ${color.numLabel} ${color.name}`}
                                className={`w-6 h-6 rounded-md ${color.bg} ${color.text} flex items-center justify-center font-bold font-mono text-[10px] transition ${selectedColor === color.id ? 'ring-2 ring-slate-800 scale-110 shadow-sm' : 'hover:scale-105 opacity-60 hover:opacity-100'}`}>
                                {color.numLabel}
                            </button>
                        ))}
                    </div>

                    <div className="relative flex-1 min-w-[200px]">
                        <input
                            type="text"
                            value={inputText}
                            onChange={(e) => setInputText(e.target.value)}
                            placeholder={inputLevel === 1 ? "↳ 中項目を入力してEnter..." : (inputLevel === 2 ? "↳↳ 小項目・具体意見を入力してEnter..." : "💡 意見・大項目を入力してEnter...")}
                            className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-1.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                        />
                        <span className="absolute right-3 top-2 text-[10px] text-slate-400 font-mono">Enter ↵</span>
                    </div>

                    <button
                        type="submit"
                        className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition flex items-center gap-1.5 shrink-0 shadow-sm active:scale-95">
                        <i className="fa-solid fa-plus"></i> 追加
                    </button>

                    <button
                        type="button"
                        onClick={() => setShowBulkModal(true)}
                        className="text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1 border border-slate-200 shrink-0">
                        <i className="fa-solid fa-list-check"></i> 一括入力
                    </button>
                </form>

                <div className="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg border border-slate-200 shrink-0 ml-4">
                    <button
                        onClick={() => setViewMode('kanban')}
                        className={`px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition ${viewMode === 'kanban' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>
                        <i className="fa-solid fa-columns"></i> グループ表示
                    </button>
                    <button
                        onClick={() => setViewMode('free')}
                        className={`px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition ${viewMode === 'free' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>
                        <i className="fa-solid fa-border-all"></i> 全アイテム一覧
                    </button>
                    <button
                        onClick={() => {
                            if (!slideUrl) {
                                setSlideInputUrl('');
                                setShowSlideModal(true);
                                showToast('💡 GoogleスライドまたはPDFのURLを設定してください');
                            } else {
                                setViewMode('slide');
                            }
                        }}
                        className={`px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition ${viewMode === 'slide' ? 'bg-indigo-600 text-white shadow-sm font-bold' : 'text-indigo-600 hover:bg-indigo-50'}`}>
                        <i className="fa-solid fa-file-powerpoint text-indigo-400"></i> 📄 スライド投影
                    </button>
                </div>
            </div>

            {viewMode === 'slide' ? (
                /* 📄 講師用全画面スライド投影ビュー */
                <div className="flex-1 flex flex-col bg-slate-950 relative overflow-hidden">
                    {/* 上部コントロールバー */}
                    <div className="bg-slate-900 px-4 py-2 border-b border-slate-800 flex items-center justify-between text-xs text-white shrink-0">
                        <div className="flex items-center gap-2">
                            <span className="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded font-bold flex items-center gap-1">
                                <i className="fa-solid fa-desktop"></i> 投影中
                            </span>
                            <span className="font-bold text-slate-300">研修スライド資料（Googleスライド / PDF）</span>
                            {isSubmissionsLocked && (
                                <span className="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded font-bold text-[10px] flex items-center gap-1">
                                    <i className="fa-solid fa-lock text-[9px]"></i> 投稿受付停止中（解説モード）
                                </span>
                            )}
                        </div>
                        <div className="flex items-center gap-2">
                            <button 
                                onClick={() => {
                                    setSlideInputUrl(slideUrl);
                                    setShowSlideModal(true);
                                }}
                                className="text-slate-400 hover:text-white px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 transition flex items-center gap-1 font-medium">
                                <i className="fa-solid fa-pen"></i> URL変更
                            </button>
                            <button 
                                onClick={() => setViewMode('kanban')}
                                className="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1 rounded-lg font-bold transition flex items-center gap-1.5 shadow active:scale-95">
                                <i className="fa-solid fa-chalkboard"></i> 板書ボードに戻る
                            </button>
                        </div>
                    </div>
                    <div className="flex-1 w-full h-full p-2 bg-slate-900 flex items-center justify-center">
                        {slideUrl ? (
                            <iframe
                                src={slideUrl}
                                className="w-full h-full rounded-xl border border-slate-800 shadow-2xl bg-white"
                                allowFullScreen={true}
                                frameBorder="0"
                            ></iframe>
                        ) : (
                            <div className="text-center text-slate-400">
                                <i className="fa-solid fa-file-powerpoint text-4xl mb-3 text-slate-600"></i>
                                <p className="font-bold text-sm">スライドURLが未設定です</p>
                                <button
                                    onClick={() => setShowSlideModal(true)}
                                    className="mt-3 bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-indigo-500 transition">
                                    GoogleスライドURLを設定する
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            ) : (
                <div className="flex-1 flex overflow-hidden">
                    {/* Left: Uncategorized Cards */}
                    <div 
                        onDragOver={handleDragOver}
                        onDrop={(e) => handleDrop(e, null)}
                        className="w-80 bg-slate-200/80 border-r border-slate-300 flex flex-col shrink-0">
                        
                        <div className="p-4 border-b border-slate-300 flex items-center justify-between bg-slate-200">
                            <div className="flex items-center gap-2">
                                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-ping"></span>
                                <h2 className="font-bold text-slate-700 text-sm">未分類の意見 (受講者)</h2>
                                <span className="bg-indigo-600 text-white text-xs px-2.5 py-0.5 rounded-full font-bold">
                                    {uncategorizedCards.length}
                                </span>
                            </div>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {uncategorizedCards.length === 0 ? (
                                <div className="h-48 border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center text-slate-400 p-4 text-center">
                                    <i className="fa-solid fa-inbox text-3xl mb-2 text-slate-300"></i>
                                    <p className="text-xs font-semibold">未分類の意見はありません</p>
                                    <p className="text-[10px] text-slate-400 mt-1">受講者がスマホから送信した意見がリアルタイムでここに届きます</p>
                                </div>
                            ) : (
                                uncategorizedCards.map(card => (
                                    <StickyCard 
                                        key={card.id} 
                                        card={card} 
                                        onDragStart={handleDragStart}
                                        onVote={handleVote}
                                        onDelete={handleDeleteCard}
                                        onUpdateText={handleUpdateCardText}
                                        onChangeLevel={handleChangeCardLevel}
                                        onChangeColor={handleChangeCardColor}
                                    />
                                ))
                            )}
                        </div>
                    </div>

                    {/* Right: Categorized Canvas */}
                    {viewMode === 'kanban' ? (
                        <div className="flex-1 flex overflow-x-auto p-6 space-x-6 bg-slate-100/60 items-start">
                            {categories.map(cat => {
                                const catCards = cards.filter(c => c.categoryId === cat.id);
                                const summary = summaries[cat.id];

                                return (
                                    <div 
                                        key={cat.id} 
                                        onDragOver={handleDragOver}
                                        onDrop={(e) => handleDrop(e, cat.id)}
                                        className="w-80 max-h-full flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200/80 shrink-0 overflow-hidden">
                                        
                                        {/* Category Header */}
                                        <CategoryHeader 
                                            cat={cat} 
                                            count={catCards.length}
                                            onUpdateTitle={handleUpdateCategoryTitle}
                                            onDelete={handleDeleteCategory}
                                            onSort={handleSortCategoryCards}
                                        />

                                        {/* AI Summary Box */}
                                        {summary && (
                                            <div className="m-3 p-3 bg-gradient-to-br from-indigo-50/80 to-purple-50/80 border border-indigo-100 rounded-xl text-xs text-indigo-950 flex flex-col gap-1.5 shadow-2xs">
                                                <div className="flex items-center gap-1.5 font-bold text-indigo-700 text-[11px]">
                                                    <i className="fa-solid fa-sparkles text-amber-500"></i>
                                                    AI 重要ポイント
                                                </div>
                                                <p className="leading-relaxed font-medium">
                                                    {summary}
                                                </p>
                                            </div>
                                        )}

                                        {/* Cards list inside category */}
                                        <div className="flex-1 overflow-y-auto p-3 space-y-3 min-h-[150px]">
                                            {catCards.length === 0 ? (
                                                <div className="h-28 border border-dashed border-slate-200 rounded-xl flex items-center justify-center text-slate-400 text-xs font-medium">
                                                    カードをここにドロップ
                                                </div>
                                            ) : (
                                                catCards.map(card => (
                                                    <StickyCard 
                                                        key={card.id} 
                                                        card={card} 
                                                        onDragStart={handleDragStart}
                                                        onCardDrop={handleCardDrop}
                                                        onVote={handleVote}
                                                        onDelete={handleDeleteCard}
                                                        onUpdateText={handleUpdateCardText}
                                                        onChangeLevel={handleChangeCardLevel}
                                                        onChangeColor={handleChangeCardColor}
                                                    />
                                                ))
                                            )}
                                        </div>
                                    </div>
                                );
                            })}

                            {/* Add Category Column */}
                            <div className="w-72 shrink-0">
                                {isAddingCategory ? (
                                    <div className="bg-white p-4 rounded-2xl border border-slate-300 shadow-sm space-y-3">
                                        <h3 className="font-bold text-xs text-slate-700">新しいグループを作成</h3>
                                        <input 
                                            type="text"
                                            value={newCategoryTitle}
                                            onChange={(e) => setNewCategoryTitle(e.target.value)}
                                            placeholder="グループ名 (例: 💡 UI改善)..."
                                            className="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                            autoFocus
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter') handleAddCategory();
                                                if (e.key === 'Escape') setIsAddingCategory(false);
                                            }}
                                        />
                                        <div className="flex justify-end space-x-2">
                                            <button 
                                                onClick={() => setIsAddingCategory(false)}
                                                className="px-3 py-1.5 text-xs text-slate-500 hover:bg-slate-100 rounded-lg">
                                                キャンセル
                                            </button>
                                            <button 
                                                onClick={handleAddCategory}
                                                className="px-3 py-1.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm">
                                                作成
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={() => setIsAddingCategory(true)}
                                        className="w-full py-4 border-2 border-dashed border-slate-300 hover:border-indigo-400 hover:bg-white/50 rounded-2xl text-slate-500 hover:text-indigo-600 text-xs font-bold transition flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-folder-plus"></i> グループを追加
                                    </button>
                                )}
                            </div>
                        </div>
                    ) : (
                        /* Free view - all cards in a grid */
                        <div className="flex-1 overflow-y-auto p-6 bg-slate-100/60 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 auto-rows-max">
                            {cards.map(card => {
                                const category = categories.find(c => c.id === card.categoryId);
                                return (
                                    <div key={card.id} className="flex flex-col">
                                        {category && (
                                            <span className="inline-block mb-1 text-[10px] font-bold px-2 py-0.5 rounded bg-slate-700 text-white">
                                                {category.title}
                                            </span>
                                        )}
                                        <StickyCard 
                                            card={card} 
                                            onDragStart={handleDragStart}
                                            onVote={handleVote}
                                            onDelete={handleDeleteCard}
                                            onUpdateText={handleUpdateCardText}
                                            onChangeLevel={handleChangeCardLevel}
                                            onChangeColor={handleChangeCardColor}
                                        />
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            )}
        </>
    )}

    {/* QR Modal */}
                    {showQrModal && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl text-center">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-qrcode text-emerald-600"></i>
                                        参加者用 意見投稿QRコード
                                    </h3>
                                    <button onClick={() => setShowQrModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <p className="text-xs text-slate-500 mb-4">
                                    受講者の皆様はスマートフォンのカメラで以下のQRコードを読み取ると、直接意見投稿フォームが開きます。
                                </p>
                                <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 inline-block mb-4">
                                    <img 
                                        src={qrImageUrl} 
                                        alt="QR Code" 
                                        className="w-48 h-48 mx-auto rounded-lg shadow-sm"
                                    />
                                </div>
                                <div className="text-[11px] text-slate-400 font-mono mb-4 break-all bg-slate-100 p-2 rounded-lg">
                                    {participantUrl}
                                </div>
                                <div className="space-y-2">
                                    <button 
                                        onClick={() => {
                                            navigator.clipboard.writeText(participantUrl);
                                            showToast('参加者用URLをコピーしました！');
                                        }}
                                        className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-copy"></i> 参加者URLをコピー
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bulk Input Modal */}
                    {showBulkModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
                                <h3 className="text-base font-bold text-slate-800 mb-2 flex items-center gap-2">
                                    <i className="fa-solid fa-list-check text-indigo-600"></i>
                                    テキスト一括入力（改行区切り）
                                </h3>
                                <p className="text-xs text-slate-500 mb-4">
                                    1行につき1つの意見カードとして自動登録されます。
                                </p>
                                <textarea
                                    value={bulkInputText}
                                    onChange={(e) => setBulkInputText(e.target.value)}
                                    rows="6"
                                    placeholder="グループワークの時間を増やしてほしい&#10;スライド資料を後で共有してほしい&#10;質疑応答の時間を確保したい"
                                    className="w-full border border-slate-300 rounded-xl p-3 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none mb-4 font-mono leading-relaxed"
                                ></textarea>
                                <div className="flex justify-end space-x-2">
                                    <button 
                                        onClick={() => setShowBulkModal(false)}
                                        className="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg">
                                        キャンセル
                                    </button>
                                    <button 
                                        onClick={handleBulkAdd}
                                        className="px-4 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm">
                                        一括生成する
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Export Modal */}
                    {showExportModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 flex flex-col max-h-[85vh]">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-file-lines text-indigo-600"></i>
                                        Markdownエクスポート
                                    </h3>
                                    <button onClick={() => setShowExportModal(false)} className="text-slate-400 hover:text-slate-600 text-sm">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <pre className="flex-1 bg-slate-900 text-slate-100 p-4 rounded-xl text-xs font-mono overflow-y-auto whitespace-pre-wrap leading-relaxed select-all">
                                    {generateMarkdown()}
                                </pre>
                                <div className="flex justify-end gap-2 mt-4">
                                    <button 
                                        onClick={() => {
                                            navigator.clipboard.writeText(generateMarkdown());
                                            showToast('Markdownをクリップボードにコピーしました！');
                                        }}
                                        className="px-4 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm flex items-center gap-1.5">
                                        <i className="fa-solid fa-copy"></i> クリップボードにコピー
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ✨ 新しい板書を開始モーダル */}
                    {showNewBoardModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-150">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-folder-plus text-amber-500"></i>
                                        新しい板書を始める
                                    </h3>
                                    <button onClick={() => setShowNewBoardModal(false)} className="text-slate-400 hover:text-slate-600 text-sm">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-4 text-xs">
                                    <p className="font-bold text-slate-700 mb-1">現在の板書ステータス:</p>
                                    <div className="flex items-center gap-4 text-slate-600">
                                        <span>💬 付箋意見: <b>{cards.length} 件</b></span>
                                        <span>👍 いいね総数: <b>{cards.reduce((s, c) => s + (c.votes || 0), 0)}</b></span>
                                    </div>
                                </div>

                                <div className="mb-5">
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5">
                                        アーカイブ記録タイトル
                                    </label>
                                    <input 
                                        type="text"
                                        value={newSessionTitle}
                                        onChange={(e) => setNewSessionTitle(e.target.value)}
                                        placeholder="例: 第1部 課題の洗い出し"
                                        className="w-full border border-slate-300 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none font-medium"
                                    />
                                    <p className="text-[11px] text-slate-400 mt-1">
                                        ※保存した板書は「📚 過去の記録」からいつでも閲覧・復元できます
                                    </p>
                                </div>

                                <div className="flex flex-col gap-2">
                                    <button 
                                        onClick={handleSaveArchiveAndStartNew}
                                        className="w-full py-2.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow transition flex items-center justify-center gap-1.5 active:scale-[0.99]">
                                        <i className="fa-solid fa-box-archive"></i>
                                        現在の板書をアーカイブに保存して新しく始める
                                    </button>

                                    <div className="flex items-center justify-between gap-2 pt-2 border-t border-slate-100">
                                        <button 
                                            onClick={handleStartNewWithoutSaving}
                                            className="text-[11px] text-slate-400 hover:text-rose-500 py-1.5 transition flex items-center gap-1">
                                            <i className="fa-solid fa-trash-can text-[10px]"></i> 保存せずにクリアして開始
                                        </button>
                                        <button 
                                            onClick={() => setShowNewBoardModal(false)}
                                            className="text-xs text-slate-500 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">
                                            キャンセル
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 💾 板書のスナップショット保存確認モーダル（付箋0件でも確実に保存可能） */}
                    {showSaveSnapshotModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-150">
                                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-floppy-disk text-indigo-600"></i>
                                        現在の板書を保存
                                    </h3>
                                    <button onClick={() => setShowSaveSnapshotModal(false)} className="text-slate-400 hover:text-slate-600 text-sm">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="mb-4">
                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs text-slate-600 mb-3 space-y-1">
                                        <div className="font-bold text-slate-800 flex items-center justify-between">
                                            <span>現在の板書状態:</span>
                                            <span className={`px-2 py-0.5 rounded-full text-[11px] font-mono ${cards.length > 0 ? 'bg-indigo-100 text-indigo-700 font-bold' : 'bg-amber-100 text-amber-800 font-bold'}`}>
                                                付箋 {cards.length} 件 {cards.length === 0 && '(付箋なし・空)'}
                                            </span>
                                        </div>
                                        <p className="text-[11px] text-slate-500">
                                            ※画面は消去されず、現在の状態を維持したまま過去ログに保存されます。
                                        </p>
                                    </div>

                                    <label className="block text-xs font-bold text-slate-700 mb-1.5">
                                        保存する記録タイトル
                                    </label>
                                    <input 
                                        type="text"
                                        value={saveSnapshotTitle}
                                        onChange={(e) => setSaveSnapshotTitle(e.target.value)}
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter') handleConfirmSaveSnapshot();
                                            if (e.key === 'Escape') setShowSaveSnapshotModal(false);
                                        }}
                                        placeholder="例: 第1部 課題の洗い出し"
                                        className="w-full border border-slate-300 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none font-bold"
                                        autoFocus
                                    />
                                </div>

                                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                                    <button 
                                        onClick={() => setShowSaveSnapshotModal(false)}
                                        className="text-xs text-slate-500 hover:bg-slate-100 px-3.5 py-2 rounded-xl transition">
                                        キャンセル
                                    </button>
                                    <button 
                                        onClick={handleConfirmSaveSnapshot}
                                        className="py-2 px-5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow transition flex items-center gap-1.5 active:scale-[0.99]">
                                        <i className="fa-solid fa-check"></i>
                                        この内容で保存する
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 📚 過去の板書アーカイブ一覧モーダル */}
                    {showArchiveModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 flex flex-col max-h-[85vh] relative">
                                {/* ✕ 閉じるボタン（モーダル右上固定） */}
                                <button 
                                    onClick={() => setShowArchiveModal(false)} 
                                    title="閉じる"
                                    className="absolute right-4 top-4 text-slate-400 hover:text-slate-700 hover:bg-slate-100 w-8 h-8 rounded-full flex items-center justify-center transition text-base z-10 cursor-pointer">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 flex-wrap gap-2 pr-10">
                                    <div>
                                        <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                            <i className="fa-solid fa-box-archive text-indigo-600"></i>
                                            過去の板書アーカイブ記録
                                            <span className="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-mono font-bold">
                                                {archives.length} 件
                                            </span>
                                        </h3>
                                        <p className="text-xs text-slate-400 mt-0.5">記録された過去セッションの閲覧・復元・他PCへの引き継ぎができます</p>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <label 
                                            title="別PCから保存したJSONバックアップファイルを読み込み"
                                            className="cursor-pointer px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition flex items-center gap-1">
                                            <i className="fa-solid fa-file-import text-indigo-600"></i>
                                            <span>📤 読込 (JSON)</span>
                                            <input 
                                                type="file" 
                                                accept=".json" 
                                                onChange={handleImportBackupJson} 
                                                className="hidden" 
                                            />
                                        </label>
                                        <button 
                                            onClick={handleExportBackupJson}
                                            title="全アーカイブをJSONファイルとしてダウンロード保存（別PC移行用）"
                                            className="px-2.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-lg text-xs font-bold transition flex items-center gap-1">
                                            <i className="fa-solid fa-file-arrow-down text-indigo-600"></i>
                                            <span>📥 保存 (JSON)</span>
                                        </button>
                                    </div>
                                </div>

                                {archives.length === 0 ? (
                                    <div className="text-center py-12 border-2 border-dashed border-slate-200 rounded-2xl my-auto">
                                        <i className="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i>
                                        <p className="text-xs font-bold text-slate-500">まだアーカイブ記録はありません</p>
                                        <p className="text-[11px] text-slate-400 mt-1">「✨ 新しい板書」を実行すると、現在の板書がここに自動保存されます</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3 flex-1 overflow-y-auto pr-1">
                                        {archives.map(arch => (
                                            <div 
                                                key={arch.id}
                                                className="bg-slate-50 hover:bg-slate-100/80 p-4 rounded-xl border border-slate-200 shadow-xs transition flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                                
                                                <div className="space-y-1 min-w-0">
                                                    <div className="flex items-center gap-2 flex-wrap">
                                                        <h4 className="text-xs font-bold text-slate-800 truncate">
                                                            📁 {arch.title}
                                                        </h4>
                                                        <span className="text-[10px] text-slate-400 font-mono">
                                                            🕒 {arch.savedAt}
                                                        </span>
                                                    </div>
                                                    <div className="flex items-center gap-3 text-[11px] text-slate-600">
                                                        <span>💬 <b>{arch.cardCount || (arch.cards ? arch.cards.length : 0)}</b> 件の意見</span>
                                                        <span>👍 <b>{arch.totalVotes || 0}</b> いいね</span>
                                                        {arch.summaries && Object.keys(arch.summaries).length > 0 && (
                                                            <span className="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.2 rounded font-bold">
                                                                💡 AI要約あり
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>

                                                <div className="flex items-center gap-1.5 shrink-0">
                                                    <button 
                                                        onClick={() => handleRestoreArchive(arch)}
                                                        title="この板書を現在のボードに復元"
                                                        className="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold shadow-xs transition flex items-center gap-1 active:scale-95">
                                                        <i className="fa-solid fa-rotate-left text-[10px]"></i> 復元
                                                    </button>
                                                    <button 
                                                        onClick={() => {
                                                            const md = generateArchiveMarkdown(arch);
                                                            navigator.clipboard.writeText(md);
                                                            showToast(`「${arch.title}」のMarkdownをコピーしました！`);
                                                        }}
                                                        title="Markdown形式でクリップボードにコピー"
                                                        className="px-2.5 py-1.5 bg-white hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-lg text-xs font-medium transition flex items-center gap-1 shadow-2xs">
                                                        <i className="fa-solid fa-copy text-[10px]"></i> 出力
                                                    </button>
                                                    <button 
                                                        onClick={() => handleDeleteArchive(arch.id)}
                                                        title="アーカイブを削除"
                                                        className="p-1.5 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition">
                                                        <i className="fa-solid fa-trash-can text-xs"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 📄 研修スライド（Googleスライド / PDF）設定モーダル */}
                    {showSlideModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-150">
                                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-file-powerpoint text-indigo-600"></i>
                                        研修スライド資料の設定
                                    </h3>
                                    <button onClick={() => setShowSlideModal(false)} className="text-slate-400 hover:text-slate-600 text-sm">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div className="bg-indigo-50/80 p-3 rounded-xl border border-indigo-100 text-[11px] text-indigo-900 space-y-1.5">
                                        <p className="font-bold flex items-center gap-1.5">
                                            <i className="fa-solid fa-lightbulb text-amber-500"></i>
                                            対応している資料形式
                                        </p>
                                        <ul className="list-disc pl-4 space-y-0.5 text-indigo-800">
                                            <li><b>Googleスライド</b>: 共有リンクをそのまま貼り付けで自動埋め込み変換</li>
                                            <li><b>Googleドライブ上のPDF</b>: 共有リンク貼り付けでプレビュー表示</li>
                                            <li><b>その他のWeb公開資料/PDF URL</b>: 直接埋め込み表示</li>
                                        </ul>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">
                                            スライドまたはPDFのURL
                                        </label>
                                        <input 
                                            type="url"
                                            value={slideInputUrl}
                                            onChange={(e) => setSlideInputUrl(e.target.value)}
                                            placeholder="https://docs.google.com/presentation/d/.../edit"
                                            className="w-full border border-slate-300 rounded-xl p-2.5 text-xs font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                            autoFocus
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter') handleSaveSlideUrl(slideInputUrl);
                                                if (e.key === 'Escape') setShowSlideModal(false);
                                            }}
                                        />
                                        <p className="text-[10px] text-slate-400 mt-1">
                                            ※登録すると講師の大画面と受講生のスマホ画面にリアルタイムで共有されます。
                                        </p>
                                    </div>

                                    <div className="flex flex-col gap-2 pt-2 border-t border-slate-100">
                                        <div className="flex items-center gap-2">
                                            <button 
                                                onClick={() => setShowSlideModal(false)}
                                                className="flex-1 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                                                キャンセル
                                            </button>
                                            <button 
                                                onClick={() => handleSaveSlideUrl(slideInputUrl)}
                                                className="flex-1 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow transition flex items-center justify-center gap-1.5 cursor-pointer">
                                                <i className="fa-solid fa-check"></i>
                                                保存して同期
                                            </button>
                                        </div>

                                        {slideUrl && (
                                            <button 
                                                onClick={() => handleSaveSlideUrl('')}
                                                className="text-[11px] text-rose-500 hover:text-rose-700 py-1 transition flex items-center justify-center gap-1 cursor-pointer">
                                                <i className="fa-solid fa-trash-can text-[10px]"></i>
                                                スライドの登録を解除
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ⚙️ Gemini API 設定モーダル */}
                    {showConfigModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-150">
                                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-wand-magic-sparkles text-indigo-600"></i>
                                        Gemini AI 設定
                                        <span className="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-mono font-bold">
                                            gemini-2.5-flash
                                        </span>
                                    </h3>
                                    <button onClick={() => setShowConfigModal(false)} className="text-slate-400 hover:text-slate-600 text-sm">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-[11px] text-slate-600 space-y-1">
                                        <p className="font-bold text-slate-700 flex items-center gap-1.5">
                                            <i className="fa-solid fa-shield-halved text-emerald-600"></i>
                                            セキュリティについて
                                        </p>
                                        <p>APIキーはお使いのブラウザ（LocalStorage）にのみ安全に保存され、GitHubや参加者のスマホには一切共有されません。</p>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">
                                            Google Gemini API キー
                                        </label>
                                        <input 
                                            type="password"
                                            value={configInputKey}
                                            onChange={(e) => setConfigInputKey(e.target.value)}
                                            placeholder="AIzaSy..."
                                            className="w-full border border-slate-300 rounded-xl p-2.5 text-xs font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        />
                                        <div className="flex justify-between items-center mt-1.5 text-[11px]">
                                            <a 
                                                href="https://aistudio.google.com/app/apikey" 
                                                target="_blank" 
                                                rel="noreferrer" 
                                                className="text-indigo-600 hover:underline flex items-center gap-1">
                                                <i className="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                                                APIキーを無料取得 (Google AI Studio)
                                            </a>
                                            {geminiApiKey && (
                                                <span className="text-emerald-600 font-bold flex items-center gap-1">
                                                    <i className="fa-solid fa-circle-check"></i> 設定済
                                                </span>
                                            )}
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-2 pt-2">
                                        <div className="flex items-center gap-2">
                                            <button 
                                                onClick={handleTestApiKey}
                                                disabled={isTestingKey}
                                                className="flex-1 py-2 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition flex items-center justify-center gap-1.5 disabled:opacity-50">
                                                <i className={`fa-solid ${isTestingKey ? 'fa-spinner fa-spin' : 'fa-bolt'}`}></i>
                                                {isTestingKey ? '接続確認中...' : '接続テスト'}
                                            </button>
                                            <button 
                                                onClick={handleSaveApiKey}
                                                className="flex-1 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow transition flex items-center justify-center gap-1.5">
                                                <i className="fa-solid fa-floppy-disk"></i>
                                                保存する
                                            </button>
                                        </div>

                                        {geminiApiKey && (
                                            <button 
                                                onClick={handleDeleteApiKey}
                                                className="text-[11px] text-rose-500 hover:text-rose-700 py-1 transition flex items-center justify-center gap-1">
                                                <i className="fa-solid fa-trash-can text-[10px]"></i>
                                                保存中のAPIキーを削除
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function CategoryHeader({ cat, count, onUpdateTitle, onDelete, onSort }) {
            const [isEditing, setIsEditing] = useState(false);
            const [title, setTitle] = useState(cat.title);

            useEffect(() => { setTitle(cat.title); }, [cat.title]);

            const handleSave = () => {
                if (title.trim() && title.trim() !== cat.title) {
                    onUpdateTitle(cat.id, title.trim());
                } else {
                    setTitle(cat.title);
                }
                setIsEditing(false);
            };

            return (
                <div className="p-3 border-b border-slate-100 bg-slate-50 group/header flex flex-col gap-1.5">
                    <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2 flex-1 min-w-0 mr-2">
                            <span className={`w-3 h-3 rounded-full shrink-0 ${cat.color}`}></span>
                            {isEditing ? (
                                <input
                                    type="text"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    onBlur={handleSave}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter') handleSave();
                                        if (e.key === 'Escape') setIsEditing(false);
                                    }}
                                    autoFocus
                                    className="font-bold text-slate-800 text-xs bg-white border border-indigo-400 rounded px-1.5 py-0.5 w-full focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                            ) : (
                                <h3
                                    onClick={() => setIsEditing(true)}
                                    title="クリックしてグループ名を編集"
                                    className="font-bold text-slate-800 text-sm truncate max-w-[170px] cursor-pointer hover:bg-slate-200/70 px-1.5 py-0.5 rounded transition flex items-center gap-1.5 group-hover/header:text-indigo-600">
                                    <span className="truncate">{cat.title}</span>
                                    <i className="fa-solid fa-pen text-[10px] text-slate-400 opacity-0 group-hover/header:opacity-100 transition shrink-0"></i>
                                </h3>
                            )}
                            <span className="bg-slate-200 text-slate-600 text-xs px-2 py-0.5 rounded-full font-bold shrink-0">
                                {count}
                            </span>
                        </div>
                        <button 
                            onClick={() => onDelete(cat.id)}
                            title="グループ削除"
                            className="text-slate-400 hover:text-rose-500 p-1 text-xs transition shrink-0">
                            <i className="fa-solid fa-trash-can"></i>
                        </button>
                    </div>

                    {/* クイック並び替えバー（カードが2枚以上あるとき表示） */}
                    {count >= 2 && onSort && (
                        <div className="flex items-center justify-between text-[10px] bg-slate-200/60 px-2 py-1 rounded-lg text-slate-500">
                            <span className="font-bold flex items-center gap-1">
                                <i className="fa-solid fa-arrow-down-short-wide"></i> 整列:
                            </span>
                            <div className="flex items-center gap-1">
                                <button 
                                    onClick={() => onSort(cat.id, 'votes')}
                                    title="いいねが多い順に整列"
                                    className="hover:bg-white hover:text-indigo-600 px-1.5 py-0.5 rounded transition font-bold">
                                    👍 いいね順
                                </button>
                                <button 
                                    onClick={() => onSort(cat.id, 'team')}
                                    title="班番号順（①〜⑧）に整列"
                                    className="hover:bg-white hover:text-indigo-600 px-1.5 py-0.5 rounded transition font-bold">
                                    🔢 班順
                                </button>
                                <button 
                                    onClick={() => onSort(cat.id, 'reverse')}
                                    title="上下の並び順を反転"
                                    className="hover:bg-white hover:text-indigo-600 px-1.5 py-0.5 rounded transition font-bold">
                                    🔄 反転
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StickyCard({ card, onDragStart, onCardDrop, onVote, onDelete, onUpdateText, onChangeLevel, onChangeColor }) {
            const [isEditing, setIsEditing] = useState(false);
            const [showColorPicker, setShowColorPicker] = useState(false);
            const [text, setText] = useState(card.text);
            const [isDragOver, setIsDragOver] = useState(false);

            useEffect(() => { setText(card.text); }, [card.text]);

            const handleSave = () => {
                if (text.trim() && text.trim() !== card.text) {
                    onUpdateText(card.id, text.trim());
                } else {
                    setText(card.text);
                }
                setIsEditing(false);
            };

            const level = card.level || 0; // 0=親・大項目, 1=中項目, 2=小項目・具体例

            // 3段階のインデントスタイルと左側のツリー分岐バー
            const indentClass = level === 2 
                ? 'ml-6 border-l-4 border-l-indigo-400 pl-2 shadow-sm' 
                : (level === 1 
                    ? 'ml-3 border-l-4 border-l-amber-400 pl-2 shadow-sm' 
                    : 'ml-0 border-l-4 border-l-transparent');

            return (
                <div 
                    draggable={!isEditing}
                    onDragStart={(e) => onDragStart(e, card.id)}
                    onDragOver={(e) => {
                        e.preventDefault();
                        setIsDragOver(true);
                    }}
                    onDragLeave={() => setIsDragOver(false)}
                    onDrop={(e) => {
                        setIsDragOver(false);
                        if (onCardDrop) onCardDrop(e, card.id, card.categoryId);
                    }}
                    className={`sticky-card ${card.color} ${indentClass} p-3 rounded-2xl border cursor-grab active:cursor-grabbing relative group transition-all duration-150 ${isDragOver ? 'ring-2 ring-indigo-500 scale-[1.02] shadow-lg border-indigo-400' : ''}`}>
                    
                    {/* 上段ヘッダー：名前・階層インジケータ ＋ 【階層調整・色変更・いいね・削除】 */}
                    <div className="mb-2 flex items-center justify-between gap-1">
                        <div className="flex items-center gap-1 min-w-0">
                            {/* 階層バッジ（中・小の場合に表示） */}
                            {level === 1 && (
                                <span className="text-[9px] font-black bg-amber-500/20 text-amber-900 px-1 py-0.2 rounded font-mono shrink-0" title="第2階層（中項目）">
                                    ↳ 中
                                </span>
                            )}
                            {level === 2 && (
                                <span className="text-[9px] font-black bg-indigo-500/20 text-indigo-900 px-1 py-0.2 rounded font-mono shrink-0" title="第3階層（小項目・具体）">
                                    ↳↳ 小
                                </span>
                            )}

                            <div className="text-[10px] font-bold bg-black/10 text-slate-800 px-1.5 py-0.5 rounded-md flex items-center gap-1 shadow-2xs shrink-0">
                                {/* ● カラー丸をクリックしても色パレットが開く */}
                                <button 
                                    type="button"
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        if (onChangeColor) setShowColorPicker(!showColorPicker);
                                    }}
                                    title="クリックして付箋の色を変更"
                                    className="flex items-center cursor-pointer hover:scale-125 transition">
                                    <span className={`w-2.5 h-2.5 rounded-full ${COLOR_PALETTE.find(c => c.id === (card.color || getColorByName(card.author)))?.dot || 'bg-amber-400'} ring-1 ring-black/30 shadow-xs`}></span>
                                </button>
                                <span className="text-xs">{getAvatarByName(card.author)}</span>
                                <span className="truncate max-w-[65px]">{card.author || '受講者'}</span>
                            </div>
                            {card.createdAt && (
                                <span className="text-[9px] text-black/50 font-mono shrink-0">🕒 {card.createdAt}</span>
                            )}
                        </div>

                        {/* アクションボタン群（階層変更・いいね・削除） */}
                        <div className="flex items-center gap-1 shrink-0">
                            {/* 階層変更ボタン（ホバー時・または階層設定時に表示） */}
                            {onChangeLevel && (
                                <div className="flex items-center gap-0.5 opacity-40 group-hover:opacity-100 transition bg-white/60 rounded-lg p-0.5 border border-black/5">
                                    {level > 0 && (
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                onChangeLevel(card.id, -1);
                                            }}
                                            title="↰ 階層を上げる（親に近づける）"
                                            className="hover:bg-white text-slate-700 hover:text-indigo-600 w-4 h-4 rounded flex items-center justify-center text-[10px] font-bold transition cursor-pointer">
                                            ↰
                                        </button>
                                    )}
                                    {level < 2 && (
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                onChangeLevel(card.id, 1);
                                            }}
                                            title="↳ 階層を下げる（子・具体例にする）"
                                            className="hover:bg-white text-slate-700 hover:text-indigo-600 w-4 h-4 rounded flex items-center justify-center text-[10px] font-bold transition cursor-pointer">
                                            ↳
                                        </button>
                                    )}
                                </div>
                            )}

                            {/* いいねボタン */}
                            <button 
                                onClick={(e) => {
                                    e.stopPropagation();
                                    onVote(card.id);
                                }}
                                title="いいね！"
                                className="flex items-center gap-1 hover:scale-110 transition active:scale-95 bg-white/70 hover:bg-white px-1.5 py-0.5 rounded-full text-slate-800 font-bold text-[11px] shadow-2xs cursor-pointer border border-black/5">
                                <span>👍</span>
                                <span className="font-mono text-xs">{card.votes || 0}</span>
                            </button>

                            {/* 削除ボタン */}
                            <button 
                                onClick={(e) => {
                                    e.stopPropagation();
                                    onDelete(card.id);
                                }}
                                title="付箋を削除"
                                className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-600 p-0.5 rounded transition text-xs cursor-pointer">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>

                    {/* 🎨 カラーパレットポップアップ（色選択） */}
                    {showColorPicker && onChangeColor && (
                        <div 
                            onClick={(e) => e.stopPropagation()}
                            className="mb-2 p-1.5 bg-white rounded-xl shadow-xl border border-slate-300 flex items-center justify-between gap-1 animate-in fade-in zoom-in duration-100 ring-2 ring-indigo-400/30">
                            <span className="text-[9px] font-bold text-slate-400 shrink-0 mr-0.5">色:</span>
                            {COLOR_PALETTE.map(color => (
                                <button
                                    key={color.id}
                                    type="button"
                                    onClick={() => {
                                        onChangeColor(card.id, color.id);
                                        setShowColorPicker(false);
                                    }}
                                    title={`カラー: ${color.numLabel} ${color.name}`}
                                    className={`w-5 h-5 rounded-md ${color.bg} ${color.text} flex items-center justify-center font-bold font-mono text-[9px] transition ${card.color === color.id ? 'ring-2 ring-slate-900 scale-110 shadow-sm' : 'hover:scale-105 opacity-70 hover:opacity-100'}`}>
                                    {color.numLabel}
                                </button>
                            ))}
                        </div>
                    )}

                    {/* 付箋本文 */}
                    {isEditing ? (
                        <textarea
                            value={text}
                            onChange={(e) => setText(e.target.value)}
                            onBlur={handleSave}
                            onKeyDown={(e) => {
                                if (e.key === 'Enter' && !e.shiftKey) {
                                    e.preventDefault();
                                    handleSave();
                                }
                            }}
                            autoFocus
                            className="w-full text-xs font-medium leading-relaxed bg-white/90 border border-indigo-400 rounded p-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none h-20"
                        />
                    ) : (
                        <div className="flex justify-between items-start gap-1">
                            <p 
                                onClick={() => setIsEditing(true)}
                                title="クリックして文字を編集"
                                className="text-xs font-medium leading-relaxed break-words cursor-pointer hover:bg-black/5 p-1 -m-1 rounded transition flex-1">
                                {card.text}
                            </p>
                            <button
                                onClick={() => setIsEditing(true)}
                                title="編集"
                                className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-slate-700 p-0.5 text-[10px] transition shrink-0">
                                <i className="fa-solid fa-pen"></i>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
