<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研修ワークナビ AI (v1.51.0)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- MQTT WebSocket for 100% Reliable Realtime Sync -->
    <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
    <!-- PDF.js: 講師PC上でPDFを画像化するために使用（外部取得しないためCORS/403の影響を受けない） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #f3f4f6;
            height: 100dvh;
            min-height: 100dvh;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .sticky-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 4px 8px rgba(0,0,0,0.08);
        }
        .sticky-card:hover {
            transform: translateY(-2px) rotate(-0.5deg);
            box-shadow: 4px 8px 16px rgba(0,0,0,0.12);
        }
        .sticky-yellow { background-color: #fef08a; border-color: #fde047; color: #713f12; }
        .sticky-green  { background-color: #bbf7d0; border-color: #86efac; color: #14532d; }
        .sticky-blue   { background-color: #bfdbfe; border-color: #93c5fd; color: #1e3a8a; }
        .sticky-pink   { background-color: #fbcfe8; border-color: #f9a8d4; color: #831843; }
        .sticky-purple { background-color: #e9d5ff; border-color: #d8b4fe; color: #581c87; }
        .sticky-orange { background-color: #fed7aa; border-color: #fdba74; color: #7c2d12; }
        .sticky-cyan   { background-color: #a5f3fc; border-color: #67e8f9; color: #164e63; }
        .sticky-lime   { background-color: #d9f99d; border-color: #bef264; color: #365314; }
        .sticky-gray   { background-color: #e2e8f0; border-color: #cbd5e1; color: #1e293b; }
        .sticky-white  { background-color: #ffffff; border-color: #e2e8f0; color: #0f172a; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-[100dvh] min-h-[100dvh] w-full max-w-full overflow-x-hidden flex flex-col bg-slate-100 text-slate-800">
    <div id="root" class="h-full w-full max-w-full overflow-x-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const APP_VERSION = "v1.51.0";

        // 付箋カラーパレット定義（①〜⑧班カラー ＋ 🩶グレー・🤍ホワイト）
        const COLOR_PALETTE = [
            { num: 1, numLabel: '①', id: 'sticky-yellow', bg: 'bg-yellow-300', dot: 'bg-yellow-400', name: 'イエロー (1班)', text: 'text-amber-950' },
            { num: 2, numLabel: '②', id: 'sticky-green',  bg: 'bg-emerald-300', dot: 'bg-emerald-400', name: 'グリーン (2班)', text: 'text-emerald-950' },
            { num: 3, numLabel: '③', id: 'sticky-blue',   bg: 'bg-sky-300',     dot: 'bg-sky-400',     name: 'ブルー (3班)',   text: 'text-sky-950' },
            { num: 4, numLabel: '④', id: 'sticky-purple', bg: 'bg-purple-300',  dot: 'bg-purple-400',  name: 'パープル (4班)', text: 'text-purple-950' },
            { num: 5, numLabel: '⑤', id: 'sticky-orange', bg: 'bg-orange-300',  dot: 'bg-orange-400',  name: 'オレンジ (5班)', text: 'text-orange-950' },
            { num: 6, numLabel: '⑥', id: 'sticky-pink',   bg: 'bg-pink-300',    dot: 'bg-pink-400',    name: 'ピンク (6班)',   text: 'text-pink-950' },
            { num: 7, numLabel: '⑦', id: 'sticky-cyan',   bg: 'bg-cyan-300',    dot: 'bg-cyan-400',    name: 'シアン (7班)',   text: 'text-cyan-950' },
            { num: 8, numLabel: '⑧', id: 'sticky-lime',   bg: 'bg-lime-300',    dot: 'bg-lime-400',    name: 'ライム (8班)',   text: 'text-lime-950' },
            { num: 9, numLabel: '🩶', id: 'sticky-gray',   bg: 'bg-slate-300',   dot: 'bg-slate-400',   name: 'グレー (中項目・見出し用)', text: 'text-slate-800' },
            { num: 10, numLabel: '🤍', id: 'sticky-white',  bg: 'bg-white border border-slate-300', dot: 'bg-slate-200', name: 'ホワイト (シンプル・メモ用)', text: 'text-slate-800' }
        ];

        // 動物アバター一覧（名前から自動決定）
        const ANIMAL_AVATARS = [
            '🦊', '🐼', '🐨', '🦁', '🐯', 
            '🐶', '🐱', '🐰', '🐻', '🐵', 
            '🐧', '🐬', '🦉', '🦄', '🐝', 
            '🐙', '🐸', '🦆', '🦖', '🐘'
        ];

        // 投稿者名から自動で動物アバターを算出
        const getAvatarByName = (name) => {
            if (!name || !name.trim()) return '👤';
            let hash = 0;
            const str = name.trim();
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % ANIMAL_AVATARS.length;
            return ANIMAL_AVATARS[index];
        };

        // 投稿者名から自動でカラーを算出するハッシュ関数（方式A: 投稿者とカラーの自動連動）
        const getColorByName = (name) => {
            if (!name || !name.trim()) return 'sticky-yellow';
            let hash = 0;
            const str = name.trim();
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % COLOR_PALETTE.length;
            return COLOR_PALETTE[index].id;
        };

        // WebPでエンコードできるか（JPEGより1〜2割小さい）。不可ならJPEGにフォールバック。
        const SCREEN_IMAGE_TYPE = (() => {
            try {
                const c = document.createElement('canvas');
                c.width = 2; c.height = 2;
                return c.toDataURL('image/webp').startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg';
            } catch (e) {
                return 'image/jpeg';
            }
        })();

        // 画面フレームのバイナリ形式
        //   [0] 形式 (1=jpeg, 2=webp) / [1] 宛先IDの長さ (0=全員) / [2..] 宛先ID / 残り=画像バイト列
        //   base64のJSONで送ると約33%膨らむため、生バイトで送る。
        const packScreenFrame = (bytes, mime, targetClientId) => {
            const idBytes = targetClientId ? new TextEncoder().encode(targetClientId) : new Uint8Array(0);
            const out = new Uint8Array(2 + idBytes.length + bytes.length);
            out[0] = mime === 'image/webp' ? 2 : 1;
            out[1] = idBytes.length;
            out.set(idBytes, 2);
            out.set(bytes, 2 + idBytes.length);
            return out;
        };

        const unpackScreenFrame = (buf) => {
            const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
            if (bytes.length < 2) return null;
            const mime = bytes[0] === 2 ? 'image/webp' : 'image/jpeg';
            const idLen = bytes[1];
            const targetClientId = idLen > 0 ? new TextDecoder().decode(bytes.subarray(2, 2 + idLen)) : '';
            return { mime, targetClientId, image: bytes.subarray(2 + idLen) };
        };

        // 🖥️ 画面配信の画質プリセット
        //   実測: 1024px/q0.5 で約97KB。面積比で 800px≒52KB / 640px≒32KB。
        //   解像度を落とすほど、同じ通信量でより短い間隔（滑らかさ）に回せる。
        const SCREEN_QUALITY_PRESETS = {
            tiny:   { width: 480,  quality: 0.32, label: '最小', note: '最も軽い' },
            low:    { width: 640,  quality: 0.35, label: '低',   note: '軽い' },
            medium: { width: 800,  quality: 0.45, label: '中',   note: '標準' },
            high:   { width: 1024, quality: 0.55, label: '高',   note: '重い' }
        };

        const SCREEN_INTERVAL_OPTIONS = [
            { ms: 300,  label: '0.3秒' },
            { ms: 500,  label: '0.5秒' },
            { ms: 1000, label: '1秒' },
            { ms: 2000, label: '2秒' }
        ];

        // 推測困難なルームIDを生成（公開MQTTブローカー経由での資料流出を防ぐ）
        const generateSecureRoomId = () => {
            const chars = 'abcdefghijkmnpqrstuvwxyz23456789';
            const buf = new Uint8Array(20);
            if (window.crypto && window.crypto.getRandomValues) {
                window.crypto.getRandomValues(buf);
            } else {
                for (let i = 0; i < buf.length; i++) buf[i] = Math.floor(Math.random() * 256);
            }
            return Array.from(buf, b => chars[b % chars.length]).join('');
        };

        // ============================================================
        // 📄 スライド画像デッキの永続化（IndexedDB）
        //   画像は数MBになるためLocalStorageではなくIndexedDBに保存する。
        //   これにより講師がブラウザを再読み込みしても資料が消えない。
        // ============================================================
        const DECK_DB = 'bansho_slide_deck';
        const DECK_STORE = 'deck';

        const openDeckDb = () => new Promise((resolve, reject) => {
            const req = indexedDB.open(DECK_DB, 1);
            req.onupgradeneeded = () => {
                if (!req.result.objectStoreNames.contains(DECK_STORE)) {
                    req.result.createObjectStore(DECK_STORE);
                }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });

        const deckDbPut = async (value) => {
            const db = await openDeckDb();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DECK_STORE, 'readwrite');
                tx.objectStore(DECK_STORE).put(value, 'current');
                tx.oncomplete = () => { db.close(); resolve(); };
                tx.onerror = () => { db.close(); reject(tx.error); };
            });
        };

        const deckDbGet = async () => {
            const db = await openDeckDb();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DECK_STORE, 'readonly');
                const req = tx.objectStore(DECK_STORE).get('current');
                req.onsuccess = () => { db.close(); resolve(req.result || null); };
                req.onerror = () => { db.close(); reject(req.error); };
            });
        };

        const deckDbClear = async () => {
            const db = await openDeckDb();
            return new Promise((resolve) => {
                const tx = db.transaction(DECK_STORE, 'readwrite');
                tx.objectStore(DECK_STORE).delete('current');
                tx.oncomplete = () => { db.close(); resolve(); };
                tx.onerror = () => { db.close(); resolve(); };
            });
        };

        // ============================================================
        // 📄 PDF → 「許可ページだけ」の画像化（講師PCのローカル処理）
        //   MQTTの1メッセージ上限に収まるよう、幅と画質を段階的に落として調整する。
        // ============================================================
        const MAX_PAGE_PAYLOAD = 420 * 1024; // base64込みの1ページ上限（ブローカー1MB制限への安全域）

        const renderPdfPageToJpeg = async (page, maxWidth) => {
            const base = page.getViewport({ scale: 1 });
            const scale = Math.min(2.5, maxWidth / base.width);
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(viewport.width));
            canvas.height = Math.max(1, Math.round(viewport.height));
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // intent:'print' で描画すると pdf.js が requestAnimationFrame を使わなくなる。
            // 講師が別タブ/別アプリに切り替えた（=タブが非表示の）間も変換が止まらない。
            await page.render({ canvasContext: ctx, viewport, intent: 'print' }).promise;

            let quality = 0.72;
            let dataUrl = canvas.toDataURL('image/jpeg', quality);
            while (dataUrl.length > MAX_PAGE_PAYLOAD && quality > 0.36) {
                quality -= 0.12;
                dataUrl = canvas.toDataURL('image/jpeg', quality);
            }
            return dataUrl;
        };

        const rasterizePdfRange = async (file, startPage, endPage, onProgress) => {
            if (!window.pdfjsLib) {
                throw new Error('PDF.jsの読み込みに失敗しました。通信環境を確認して再読み込みしてください。');
            }
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

            const first = Math.min(Math.max(1, parseInt(startPage, 10) || 1), pdf.numPages);
            const rawEnd = parseInt(endPage, 10) || 0;
            const last = rawEnd > 0 ? Math.min(Math.max(first, rawEnd), pdf.numPages) : pdf.numPages;

            const pages = [];
            for (let p = first; p <= last; p++) {
                const page = await pdf.getPage(p);
                let dataUrl = '';
                for (const w of [1280, 1024, 800]) {
                    dataUrl = await renderPdfPageToJpeg(page, w);
                    if (dataUrl.length <= MAX_PAGE_PAYLOAD) break;
                }
                pages.push({ page: p, dataUrl });
                if (onProgress) onProgress(pages.length, last - first + 1);
            }
            return { pages, first, last, total: pdf.numPages };
        };

        // GoogleスライドURLまたはWeb/PDF URLを埋め込み用URLに自動変換するヘルパー
        const convertToEmbedUrl = (rawUrl, pageNum = 1) => {
            if (!rawUrl || !rawUrl.trim()) return '';
            const url = rawUrl.trim();
            const startNum = parseInt(pageNum, 10) || 1;
            
            // Google Slides: https://docs.google.com/presentation/d/{ID}/edit... -> /embed
            const gslideMatch = url.match(/docs\.google\.com\/presentation\/d\/([a-zA-Z0-9_-]+)/);
            if (gslideMatch && gslideMatch[1]) {
                const id = gslideMatch[1];
                const pageParam = startNum > 1 ? `#slide=id.p${startNum}` : '';
                return `https://docs.google.com/presentation/d/${id}/embed?start=false&loop=false&delayms=60000${pageParam}`;
            }
            
            // Google Drive PDF: https://drive.google.com/file/d/{ID}/view -> /preview
            const gdriveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (gdriveMatch && gdriveMatch[1]) {
                const id = gdriveMatch[1];
                return `https://drive.google.com/file/d/${id}/preview`;
            }
            
            return url;
        };

        const getEmbedUrlForSlide = (rawUrl) => {
            return convertToEmbedUrl(rawUrl);
        };

        // ============================================================
        // 📄 受講者用スライドビューアー（Googleスライド公式埋め込み＋公開範囲ガイダンス）
        // ============================================================
        // ============================================================
        // 📄 受講者用スライドビューアー
        //   ① デッキ方式（推奨）: 講師PCでPDFから画像化した「許可ページのみ」を表示。
        //      受講者の端末には資料URLも範囲外ページも一切届かないため、制限が確実に効く。
        //   ② URL方式: 従来のGoogleスライド埋め込み。クロスオリジンiframeのため
        //      ページ制限は技術的に強制できず、案内バッジのみとなる。
        // ============================================================
        function RestrictedSlideViewer({
            slideUrl,
            pages = [],
            progress = null,
            pageStart = 1,
            pageEnd = 0,
            showToast,
            hideLockBadge = false,
            index: indexProp,
            onIndexChange
        }) {
            // 現在ページは外から渡すこともできる。
            //   板書ボードとスライド投影を行き来するとビューアーが作り直されるため、
            //   内部だけで持つと毎回1ページ目に戻ってしまう。親で保持すれば維持される。
            const controlled = typeof indexProp === 'number' && typeof onIndexChange === 'function';
            const [innerIndex, setInnerIndex] = useState(0);
            const total = pages.length;
            const index = Math.max(0, Math.min(controlled ? indexProp : innerIndex, Math.max(0, total - 1)));

            const touchStartXRef = useRef(null);
            const indexRef = useRef(index);
            indexRef.current = index;

            // キーボードのハンドラからも常に最新のページ番号を見られるようrefを経由する
            const setIndex = (updater) => {
                const cur = indexRef.current;
                const raw = typeof updater === 'function' ? updater(cur) : updater;
                const next = Math.max(0, Math.min(raw, Math.max(0, total - 1)));
                if (next === cur) return;
                indexRef.current = next;
                if (controlled) onIndexChange(next);
                else setInnerIndex(next);
            };

            useEffect(() => {
                // ページ数が減った場合だけ範囲内に丸める
                if (total > 0 && indexRef.current > total - 1) setIndex(total - 1);
            }, [total]);

            const goPrev = () => setIndex(i => i - 1);
            const goNext = () => setIndex(i => i + 1);

            // キーボード操作（範囲外へは動かせない）
            useEffect(() => {
                if (total === 0) return;
                const onKey = (e) => {
                    if (e.key === 'ArrowLeft' || e.key === 'PageUp') goPrev();
                    else if (e.key === 'ArrowRight' || e.key === 'PageDown') goNext();
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [total]);

            // --- 資料の受信待ち ---
            if (total === 0 && progress) {
                const pct = progress.total > 0 ? Math.round((progress.done / progress.total) * 100) : 0;
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 text-center gap-3">
                        <i className="fa-solid fa-cloud-arrow-down text-3xl text-indigo-400 animate-bounce"></i>
                        <p className="text-xs font-bold text-slate-200">{progress.label || '資料を受信中...'}</p>
                        <div className="w-40 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div className="h-full bg-indigo-500 transition-all" style={{ width: pct + '%' }}></div>
                        </div>
                        <p className="text-[10px] text-slate-500 font-mono">{progress.done} / {progress.total}</p>
                    </div>
                );
            }

            // --- ① デッキ方式：許可ページの画像だけを表示 ---
            if (total > 0) {
                const current = pages[Math.min(index, total - 1)];
                const receiving = !!(progress && progress.total > 0 && progress.done < progress.total);
                return (
                    <div className="flex-1 flex flex-col min-h-0">
                        <div className="flex-1 w-full rounded-xl overflow-hidden bg-slate-950 border border-slate-700 relative shadow-inner flex flex-col min-h-0">
                            {!hideLockBadge && (
                                <div className="bg-slate-900/95 border-b border-slate-800 text-emerald-300 text-[11px] font-bold px-3 py-1.5 flex items-center justify-between shrink-0 gap-2">
                                    <div className="flex items-center gap-1.5 min-w-0">
                                        <i className="fa-solid fa-shield-halved text-emerald-400 text-xs shrink-0"></i>
                                        <span className="truncate">
                                            本ワークの研修範囲:
                                            <strong className="text-white font-mono bg-emerald-500/20 px-1.5 py-0.2 rounded border border-emerald-500/40 ml-1">
                                                {pages[0].page} 〜 {pages[total - 1].page} ページ
                                            </strong>
                                        </span>
                                    </div>
                                    <span className="text-[10px] text-slate-400 hidden sm:inline shrink-0">※範囲外のページは配信されていません</span>
                                </div>
                            )}

                            <div
                                className="flex-1 min-h-0 flex items-center justify-center bg-slate-950 relative select-none"
                                onTouchStart={(e) => { touchStartXRef.current = e.touches[0].clientX; }}
                                onTouchEnd={(e) => {
                                    if (touchStartXRef.current === null) return;
                                    const dx = e.changedTouches[0].clientX - touchStartXRef.current;
                                    touchStartXRef.current = null;
                                    if (dx < -40) goNext();
                                    else if (dx > 40) goPrev();
                                }}
                                onContextMenu={(e) => e.preventDefault()}>
                                <img
                                    src={current.dataUrl}
                                    alt={'スライド ' + current.page + ' ページ'}
                                    draggable={false}
                                    className="max-w-full max-h-full object-contain pointer-events-none"
                                />
                                {index > 0 && (
                                    <button
                                        onClick={goPrev}
                                        aria-label="前のページ"
                                        className="absolute left-1 top-1/2 -translate-y-1/2 w-9 h-14 rounded-lg bg-slate-900/70 hover:bg-slate-800 text-white flex items-center justify-center shadow active:scale-95 transition">
                                        <i className="fa-solid fa-chevron-left"></i>
                                    </button>
                                )}
                                {index < total - 1 && (
                                    <button
                                        onClick={goNext}
                                        aria-label="次のページ"
                                        className="absolute right-1 top-1/2 -translate-y-1/2 w-9 h-14 rounded-lg bg-slate-900/70 hover:bg-slate-800 text-white flex items-center justify-center shadow active:scale-95 transition">
                                        <i className="fa-solid fa-chevron-right"></i>
                                    </button>
                                )}
                            </div>

                            <div className="bg-slate-900 border-t border-slate-800 px-2.5 py-1.5 flex items-center justify-between shrink-0 gap-2">
                                <button
                                    onClick={goPrev}
                                    disabled={index === 0}
                                    className="px-2.5 py-1 rounded-lg text-[11px] font-bold transition flex items-center gap-1 disabled:opacity-30 disabled:cursor-not-allowed bg-slate-800 hover:bg-slate-700 text-white">
                                    <i className="fa-solid fa-chevron-left text-[9px]"></i> 前へ
                                </button>
                                <div className="flex items-center gap-2 text-[11px] text-slate-300 font-mono min-w-0">
                                    <span className="font-bold text-white">{index + 1} / {total}</span>
                                    <span className="text-slate-500">（資料 {current.page}P）</span>
                                    {receiving && <span className="text-amber-300 animate-pulse text-[10px]">受信中…</span>}
                                </div>
                                <button
                                    onClick={goNext}
                                    disabled={index >= total - 1}
                                    className="px-2.5 py-1 rounded-lg text-[11px] font-bold transition flex items-center gap-1 disabled:opacity-30 disabled:cursor-not-allowed bg-slate-800 hover:bg-slate-700 text-white">
                                    次へ <i className="fa-solid fa-chevron-right text-[9px]"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- 未設定 ---
            if (!slideUrl) {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 text-center text-slate-400">
                        <i className="fa-solid fa-file-powerpoint text-4xl mb-3 text-slate-600"></i>
                        <p className="text-xs font-bold text-slate-300">スライド資料は準備中です</p>
                        <p className="text-[10px] text-slate-500 mt-1">講師が資料を配信するとここに表示されます</p>
                    </div>
                );
            }

            // --- ② URL方式（従来の埋め込み・全ページ閲覧可） ---
            const firstPage = Math.max(1, Number(pageStart) || 1);
            const lastPage = pageEnd > 0 ? Math.max(firstPage, Number(pageEnd)) : 0;

            return (
                <div className="flex-1 flex flex-col min-h-0">
                    <div className="flex-1 w-full rounded-xl overflow-hidden bg-slate-950 border border-slate-700 relative shadow-inner flex flex-col min-h-0">
                        {lastPage > 0 && (
                            <div className="bg-slate-900/95 border-b border-slate-800 text-amber-300 text-[11px] font-bold px-3 py-1.5 flex items-center justify-between shrink-0">
                                <div className="flex items-center gap-1.5">
                                    <i className="fa-solid fa-circle-info text-amber-400 text-xs"></i>
                                    <span>本ワークの研修範囲: <strong className="text-white font-mono bg-amber-500/20 px-1.5 py-0.2 rounded border border-amber-500/40">{firstPage} 〜 {lastPage} ページ</strong></span>
                                </div>
                                <span className="text-[10px] text-slate-400 hidden sm:inline">※この方式では範囲外の閲覧を強制的には防げません</span>
                            </div>
                        )}
                        <div className="flex-1 w-full relative min-h-0">
                            <iframe
                                src={convertToEmbedUrl(slideUrl)}
                                className="w-full h-full border-0 bg-white"
                                allowFullScreen={true}
                                frameBorder="0"
                            ></iframe>
                        </div>
                    </div>
                </div>
            );
        }

        const INITIAL_CATEGORIES = [
            { id: 'cat-1', title: '💡 アイデア・提案', color: 'bg-amber-500' },
            { id: 'cat-2', title: '⚠️ 課題・現状の悩み', color: 'bg-rose-500' },
            { id: 'cat-3', title: '🚀 次のアクション', color: 'bg-emerald-500' }
        ];

        const INITIAL_CARDS = [
            { id: 'c-1', text: 'スマホから誰でもすぐに意見を投稿できるようにしたい', color: 'sticky-yellow', categoryId: null, votes: 4, author: '受講者A', createdAt: '16:10' },
            { id: 'c-2', text: '研修中のグループワークでの発言を可視化したい', color: 'sticky-blue', categoryId: null, votes: 2, author: '受講者B', createdAt: '16:12' },
            { id: 'c-3', text: '意見が多くなりすぎた時に分類に時間がかかる', color: 'sticky-pink', categoryId: null, votes: 5, author: '受講者C', createdAt: '16:15' },
            { id: 'c-4', text: 'AIが要約まで作ってくれるとレポート作成が楽になる', color: 'sticky-green', categoryId: null, votes: 3, author: '受講者D', createdAt: '16:18' }
        ];

        // ============================================================
        // 📽️ 投影専用ウィンドウ（?role=projector）
        //   パワポの発表者ツールと同じ考え方。このウィンドウを外部モニターへ移して
        //   全画面にすると、講師の手元には次ページ付きの発表者ビューが残る。
        //   画像はIndexedDBから直接読むので、表示するページ番号だけを受け取る。
        // ============================================================
        const PROJECTOR_CHANNEL = 'bansho_projector';

        function ProjectorView() {
            const [pages, setPages] = useState([]);
            const [pageNo, setPageNo] = useState(null);
            const [ready, setReady] = useState(false);

            // デッキを読み込む（講師ウィンドウと同じIndexedDBを共有）
            const loadDeck = async () => {
                try {
                    const saved = await deckDbGet();
                    setPages(saved && saved.pages ? saved.pages : []);
                } catch (e) {
                    setPages([]);
                }
                setReady(true);
            };

            useEffect(() => { loadDeck(); }, []);

            useEffect(() => {
                let ch = null;
                try {
                    ch = new BroadcastChannel(PROJECTOR_CHANNEL);
                    ch.onmessage = (e) => {
                        const d = e.data || {};
                        if (d.type === 'SHOW_PAGE') setPageNo(d.page);
                        else if (d.type === 'DECK_UPDATED') loadDeck();
                    };
                    ch.postMessage({ type: 'PROJECTOR_READY' });
                } catch (e) {
                    console.warn('BroadcastChannel unavailable:', e);
                }
                return () => { if (ch) try { ch.close(); } catch (e2) {} };
            }, []);

            const current = pages.find(p => p.page === pageNo);

            return (
                <div className="w-full h-full bg-black flex items-center justify-center select-none">
                    {current ? (
                        <img
                            src={current.dataUrl}
                            alt={`スライド ${current.page} ページ`}
                            draggable={false}
                            onContextMenu={(e) => e.preventDefault()}
                            className="max-w-full max-h-full object-contain"
                        />
                    ) : (
                        <div className="text-center text-slate-500 p-8">
                            <i className="fa-solid fa-display text-5xl mb-4"></i>
                            <p className="text-sm font-bold text-slate-300">投影ウィンドウ</p>
                            <p className="text-xs mt-2">
                                {ready
                                    ? 'このウィンドウを投影用モニターへ移動し、F11 で全画面にしてください'
                                    : '資料を読み込んでいます…'}
                            </p>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const urlParams = new URLSearchParams(window.location.search);
            const isParticipantOnly = urlParams.get('role') === 'participant';
            const initialRole = isParticipantOnly ? 'participant' : 'board';
            const targetRoomParam = urlParams.get('room') || '';

            // 講師用ホストルームID（ユニーク生成または保存済みIDを使用）
            const getInitialHostRoomId = () => {
                if (targetRoomParam) return targetRoomParam;
                let saved = localStorage.getItem('bansho_host_room_id');
                // 旧仕様の短いルームID（6文字）は公開ブローカー上で推測されうるため自動で作り直す
                if (!saved || /^room-[a-z0-9]{1,12}$/.test(saved)) {
                    saved = 'room-' + generateSecureRoomId();
                    localStorage.setItem('bansho_host_room_id', saved);
                }
                return saved;
            };

            const [activeRoomId, setActiveRoomId] = useState(isParticipantOnly ? targetRoomParam : getInitialHostRoomId());
            const [connectedCount, setConnectedCount] = useState(0);
            const [peerConnected, setPeerConnected] = useState(false);

            // 画面サイズ判定（スマホ < 768px <= 一般PC）
            const [isMobile, setIsMobile] = useState(() => typeof window !== 'undefined' ? window.innerWidth < 768 : false);
            const [participantPcTab, setParticipantPcTab] = useState('slide'); // 'slide' | 'board'

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth < 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const [appRole, setAppRole] = useState(initialRole);

            // 参加者お名前変更ハンドラ
            const handleParticipantNameChange = (val) => {
                setParticipantName(val);
                localStorage.setItem('bansho_my_name', val);
            };

            // ホスト・MQTT再接続ハンドラ
            const connectToHost = () => {
                if (mqttClientRef.current) {
                    try {
                        mqttClientRef.current.reconnect();
                        showToast('🔄 ボードへ再接続を試行中...');
                    } catch (e) {
                        console.warn(e);
                    }
                }
            };

            // 板書・ワークショップのテーマタイトル
            const [sessionThemeTitle, setSessionThemeTitle] = useState(() => {
                return localStorage.getItem('bansho_session_title') || 'ワークショップ・意見整理';
            });
            const [isEditingThemeTitle, setIsEditingThemeTitle] = useState(false);
            const [tempThemeTitle, setTempThemeTitle] = useState(sessionThemeTitle);

            const [categories, setCategories] = useState(() => {
                const saved = localStorage.getItem('bansho_categories');
                return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
            });
            const [cards, setCards] = useState(() => {
                const saved = localStorage.getItem('bansho_cards');
                return saved ? JSON.parse(saved) : INITIAL_CARDS;
            });

            // Gemini API Key (LocalStorage保存)
            const [geminiApiKey, setGeminiApiKey] = useState(() => {
                return localStorage.getItem('bansho_gemini_api_key') || '';
            });

            // 過去の板書アーカイブ一覧
            const [archives, setArchives] = useState(() => {
                const saved = localStorage.getItem('bansho_archives');
                return saved ? JSON.parse(saved) : [];
            });

            // 自分の投稿履歴
            const [myHistory, setMyHistory] = useState(() => {
                const saved = localStorage.getItem('bansho_my_history');
                return saved ? JSON.parse(saved) : [];
            });

            // 自分のいいね投票記録 ({ cardId: true })
            const [myVotes, setMyVotes] = useState(() => {
                const saved = localStorage.getItem('bansho_my_votes');
                return saved ? JSON.parse(saved) : {};
            });

            // 参加者画面のタブ ('post' | 'timeline')
            const [participantTab, setParticipantTab] = useState('post');
            // タイムラインの並び順 ('latest' | 'votes')
            const [timelineSort, setTimelineSort] = useState('latest');

            const [participantName, setParticipantName] = useState(() => {
                return localStorage.getItem('bansho_my_name') || '';
            });
            const [facilitatorName, setFacilitatorName] = useState(() => {
                return localStorage.getItem('bansho_facilitator_name') || '講師';
            });
            const [inputLevel, setInputLevel] = useState(0); // 講師追加時の初期階層 (0=大, 1=中, 2=小)
            const [inputText, setInputText] = useState('');
            const [selectedColor, setSelectedColor] = useState(() => {
                return localStorage.getItem('bansho_selected_color') || 'sticky-yellow';
            });

            // 講師の入力名をブラウザに記憶
            useEffect(() => {
                localStorage.setItem('bansho_facilitator_name', facilitatorName);
            }, [facilitatorName]);

            // 手動選択した色をブラウザに記憶
            useEffect(() => {
                localStorage.setItem('bansho_selected_color', selectedColor);
            }, [selectedColor]);

            const [draggedCardId, setDraggedCardId] = useState(null);
            const [viewMode, setViewMode] = useState('kanban');
            const [isAiProcessing, setIsAiProcessing] = useState(false);
            const [showExportModal, setShowExportModal] = useState(false);
            const [showBulkModal, setShowBulkModal] = useState(false);
            const [showQrModal, setShowQrModal] = useState(false);

            // 受講者に配布する公開URL（ローカル環境で開いている時のQR生成に使う）
            const [publicBaseUrl, setPublicBaseUrl] = useState(() => {
                return localStorage.getItem('bansho_public_base_url')
                    || 'https://fujishinoharatt-cpu.github.io/921-Live_Scribe_TV/';
            });
            useEffect(() => {
                localStorage.setItem('bansho_public_base_url', publicBaseUrl);
            }, [publicBaseUrl]);
            const [showArchiveModal, setShowArchiveModal] = useState(false);
            const [showNewBoardModal, setShowNewBoardModal] = useState(false);
            const [showSaveSnapshotModal, setShowSaveSnapshotModal] = useState(false);
            const [showMenuModal, setShowMenuModal] = useState(false);
            const [saveSnapshotTitle, setSaveSnapshotTitle] = useState('');
            const [showConfigModal, setShowConfigModal] = useState(false);
            const [configInputKey, setConfigInputKey] = useState('');
            const [isTestingKey, setIsTestingKey] = useState(false);
            const [newSessionTitle, setNewSessionTitle] = useState('');
            const [bulkInputText, setBulkInputText] = useState('');
            const [newCategoryTitle, setNewCategoryTitle] = useState('');
            const [isAddingCategory, setIsAddingCategory] = useState(false);
            const [summaries, setSummaries] = useState({});
            const [toastMessage, setToastMessage] = useState(null);

            // 📄 スライド資料（Googleスライド / PDF）State & 公開ページ範囲
            const [slideUrl, setSlideUrl] = useState(() => {
                // 受講者は講師からの同期で受け取るため、保存値は読まない
                return isParticipantOnly ? '' : (localStorage.getItem('bansho_slide_url') || '');
            });
            const [slidePageStart, setSlidePageStart] = useState(() => {
                return isParticipantOnly ? 1 : parseInt(localStorage.getItem('bansho_slide_page_start') || '1', 10);
            });
            const [slidePageEnd, setSlidePageEnd] = useState(() => {
                return isParticipantOnly ? 0 : parseInt(localStorage.getItem('bansho_slide_page_end') || '0', 10); // 0 = 制限なし
            });
            // 🔗 共有リンク（受講者に「別タブで開いてもらう」ためのURL）
            //    gemini.google.com のように X-Frame-Options で埋め込みを拒否するサイトは
            //    iframeでは表示できないため、リンクとして配る。
            const [sharedLink, setSharedLink] = useState(() => {
                if (isParticipantOnly) return null;
                try {
                    return JSON.parse(localStorage.getItem('bansho_shared_link') || 'null');
                } catch (e) {
                    return null;
                }
            });
            // 🖥️ 画面配信（低fpsの連続画像をMQTTで配る。WebRTCと違いNAT越えの問題が出ない）
            const [isScreenSharing, setIsScreenSharing] = useState(false);
            const [screenFrame, setScreenFrame] = useState(null);   // 受講者が表示する最新フレーム
            const [screenStats, setScreenStats] = useState(null);   // 講師向けの送信状況
            const screenStreamRef = useRef(null);
            const screenVideoRef = useRef(null);
            const screenTimerRef = useRef(null);
            const screenLastFrameRef = useRef(null);   // 途中参加者への再送用
            const screenThumbRef = useRef(null);       // 差分検知用の縮小ピクセル
            const screenLastSentAtRef = useRef(0);
            const screenSentCountRef = useRef(0);
            const screenTickRef = useRef(null);
            const screenTrafficRef = useRef([]);   // 直近の送信量から実効KB/sを出す
            const screenWorkerRef = useRef(null);     // 非表示タブでも刻めるタイマー用Worker
            const screenInFlightRef = useRef(false); // 前フレームの送信が終わるまで次を送らない
            const screenDroppedRef = useRef([]);     // 回線が追いつかず破棄したフレームの時刻
            const screenTickRef2 = useRef([]);       // tickが実際に回った時刻（タイマーが効いているかの確認用）
            const screenNoChangeRef = useRef([]);    // 画面に変化が無くて送らなかった時刻
            // 送信済みだがまだ送り切れていないバイト数。
            // これを上限で抑えることで「キューに溜まって遅延が伸びる」のを防ぐ。
            // mqtt.jsの内部構造に依存せず、publishの完了通知だけで成立する。
            const screenOutstandingRef = useRef(0);

            // 画質と更新間隔（配信中でも切り替えできる）
            const [screenQuality, setScreenQuality] = useState(() => {
                return localStorage.getItem('bansho_screen_quality') || 'medium';
            });
            const [screenIntervalMs, setScreenIntervalMs] = useState(() => {
                return parseInt(localStorage.getItem('bansho_screen_interval') || '500', 10);
            });
            const screenQualityRef = useRef(screenQuality);
            const screenIntervalRef = useRef(screenIntervalMs);

            useEffect(() => {
                screenQualityRef.current = screenQuality;
                localStorage.setItem('bansho_screen_quality', screenQuality);
            }, [screenQuality]);

            useEffect(() => {
                screenIntervalRef.current = screenIntervalMs;
                localStorage.setItem('bansho_screen_interval', String(screenIntervalMs));
            }, [screenIntervalMs]);

            // よく使うリンクの事前登録（講師の端末に保存）
            const [savedLinks, setSavedLinks] = useState(() => {
                if (isParticipantOnly) return [];
                try {
                    const raw = JSON.parse(localStorage.getItem('bansho_saved_links') || '[]');
                    return Array.isArray(raw) ? raw : [];
                } catch (e) {
                    return [];
                }
            });
            useEffect(() => {
                if (!isParticipantOnly) {
                    localStorage.setItem('bansho_saved_links', JSON.stringify(savedLinks));
                }
            }, [savedLinks]);

            const [showLinkModal, setShowLinkModal] = useState(false);
            const [linkInputUrl, setLinkInputUrl] = useState('');
            const [linkInputLabel, setLinkInputLabel] = useState('');

            // 投影ウィンドウ（別ウィンドウ）との連携用チャンネル
            const projectorChRef = useRef(null);
            const [projectorOpen, setProjectorOpen] = useState(false);

            useEffect(() => {
                if (appRole !== 'board') return;
                let ch = null;
                try {
                    ch = new BroadcastChannel(PROJECTOR_CHANNEL);
                    projectorChRef.current = ch;
                    ch.onmessage = (e) => {
                        // 投影ウィンドウが開いたら、いまのページを送り返す
                        if (e.data && e.data.type === 'PROJECTOR_READY') {
                            setProjectorOpen(true);
                            const pub = slidePagesRef.current || [];
                            const cur = pub[Math.min(boardSlidePageRef.current, Math.max(0, pub.length - 1))];
                            if (cur) ch.postMessage({ type: 'SHOW_PAGE', page: cur.page });
                        }
                    };
                } catch (e) {
                    console.warn('BroadcastChannel unavailable:', e);
                }
                return () => { if (ch) { try { ch.close(); } catch (e2) {} } projectorChRef.current = null; };
            }, [appRole]);

            // スライドの表示中ページ。ビューアーが作り直されても位置を保つために親で持つ。
            const [boardSlidePage, setBoardSlidePage] = useState(0);      // 講師の投影ビュー用
            const boardSlidePageRef = useRef(0);

            // 表示中ページが変わるたびに投影ウィンドウへ通知する
            useEffect(() => {
                boardSlidePageRef.current = boardSlidePage;
                if (appRole !== 'board' || !projectorChRef.current) return;
                const pub = slidePagesRef.current || [];
                const cur = pub[Math.min(boardSlidePage, Math.max(0, pub.length - 1))];
                if (cur) projectorChRef.current.postMessage({ type: 'SHOW_PAGE', page: cur.page });
            }, [boardSlidePage, slidePages, appRole]);
            const [viewerSlidePage, setViewerSlidePage] = useState(0);    // 受講者ビュー用

            // 受講者スマホの色選択を開いているか（畳んでいる間は1行しか使わない）
            const [showColorPicker, setShowColorPicker] = useState(false);

            const [showSlideModal, setShowSlideModal] = useState(false);
            const [slideInputUrl, setSlideInputUrl] = useState('');
            const [slideInputPageStart, setSlideInputPageStart] = useState(1);
            const [slideInputPageEnd, setSlideInputPageEnd] = useState(0);

            // 📄 受講者配信用スライドデッキ（許可ページのみを画像化したもの）
            //    URLを配らないため、範囲外ページは受講者端末に一切存在しない
            const [slidePages, setSlidePages] = useState([]);          // [{ page, dataUrl }]
            const [slideDeckInfo, setSlideDeckInfo] = useState(null);  // { fileName, first, last, total }
            const [slideDeckProgress, setSlideDeckProgress] = useState(null); // { done, total, label }
            // 講師の手元には全ページを保持し、そのうち「公開範囲」だけを受講者へ送る。
            // 答えのページを研修の途中でその場で開放できるようにするため。
            const [allSlidePages, setAllSlidePages] = useState([]);

            // 講師が「投影」に使うソース: 'deck'（PDF画像） / 'url'（Googleスライド等の埋め込み）
            // 受講者へ配信されるのは常にデッキ（方式A）だけで、この設定の影響を受けない
            const [projectionSource, setProjectionSource] = useState(() => {
                return localStorage.getItem('bansho_projection_source') || 'deck';
            });
            useEffect(() => {
                if (!isParticipantOnly) localStorage.setItem('bansho_projection_source', projectionSource);
            }, [projectionSource]);

            const slideUrlRef = useRef(slideUrl);
            const slidePageStartRef = useRef(slidePageStart);
            const slidePageEndRef = useRef(slidePageEnd);
            const slidePagesRef = useRef([]);
            const slideDeckInfoRef = useRef(null);
            const slideDeckBufferRef = useRef([]);
            const slideRepairPendingRef = useRef(false); // 欠落ページの再送要求が飛びすぎないようにする
            const allSlidePagesRef = useRef([]);
            useEffect(() => { allSlidePagesRef.current = allSlidePages; }, [allSlidePages]);

            useEffect(() => { slidePagesRef.current = slidePages; }, [slidePages]);
            useEffect(() => { slideDeckInfoRef.current = slideDeckInfo; }, [slideDeckInfo]);

            useEffect(() => {
                slideUrlRef.current = slideUrl;
                if (!isParticipantOnly) localStorage.setItem('bansho_slide_url', slideUrl);
            }, [slideUrl]);

            useEffect(() => {
                slidePageStartRef.current = slidePageStart;
                if (!isParticipantOnly) localStorage.setItem('bansho_slide_page_start', slidePageStart);
            }, [slidePageStart]);

            useEffect(() => {
                slidePageEndRef.current = slidePageEnd;
                if (!isParticipantOnly) localStorage.setItem('bansho_slide_page_end', slidePageEnd);
            }, [slidePageEnd]);

            // ⏱️ 研修用タイマー & 🔒 投稿受付ロックの State
            const [timerSeconds, setTimerSeconds] = useState(0); // 残り秒数
            const [timerTotal, setTimerTotal] = useState(0);     // 設定総秒数
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [isTimeUp, setIsTimeUp] = useState(false);
            // 投稿受付ロック。初期値は「受付停止中」。
            //   講師が開始の合図を出してから受け付ける運用に合わせる。
            //   ただし講師が一度切り替えた状態は保存し、研修中に再読み込みしても
            //   勝手に受付が閉じないようにする。
            const [isSubmissionsLocked, setIsSubmissionsLocked] = useState(() => {
                if (isParticipantOnly) return true; // 同期が届くまでは閉じておく
                const saved = localStorage.getItem('bansho_submissions_locked');
                return saved === null ? true : saved === 'true';
            });
            useEffect(() => {
                if (!isParticipantOnly) {
                    localStorage.setItem('bansho_submissions_locked', String(isSubmissionsLocked));
                }
            }, [isSubmissionsLocked]);

            const peerRef = useRef(null);
            const connRef = useRef(null);
            const hostConnsRef = useRef([]); // 講師ボード接続クライアント一覧
            const sessionThemeTitleRef = useRef(sessionThemeTitle);
            const cardsRef = useRef(cards);
            const categoriesRef = useRef(categories);
            const sharedLinkRef = useRef(null);

            useEffect(() => {
                sharedLinkRef.current = sharedLink;
                if (!isParticipantOnly) {
                    localStorage.setItem('bansho_shared_link', JSON.stringify(sharedLink));
                }
            }, [sharedLink]);
            const timerSecondsRef = useRef(timerSeconds);
            const isTimerRunningRef = useRef(isTimerRunning);
            const timerTotalRef = useRef(timerTotal);
            const isSubmissionsLockedRef = useRef(isSubmissionsLocked);

            // 講師のブラウザ再読み込み後もデッキを復元する
            useEffect(() => {
                if (appRole !== 'board') return;
                deckDbGet().then(saved => {
                    if (!saved || !saved.pages || saved.pages.length === 0) return;
                    const all = saved.pages;
                    const info = saved.info || null;
                    const first = info && info.first ? info.first : all[0].page;
                    const last = info && info.last ? info.last : all[all.length - 1].page;
                    const published = all.filter(p => p.page >= first && p.page <= last);
                    setAllSlidePages(all);
                    allSlidePagesRef.current = all;
                    setSlidePages(published);
                    slidePagesRef.current = published;
                    setSlideDeckInfo(info);
                }).catch(() => {});
            }, [appRole]);

            // デッキを1ページ1メッセージで配信（ブローカーの1メッセージ上限とレート制限を避ける）
            const broadcastSlideDeck = async (pages, info, targetClientId) => {
                if (!pages || pages.length === 0) return;
                broadcastToClients({ type: 'SLIDE_DECK_START', targetClientId, total: pages.length, info: info || null });
                for (let i = 0; i < pages.length; i++) {
                    broadcastToClients({
                        type: 'SLIDE_DECK_PAGE',
                        targetClientId,
                        index: i,
                        total: pages.length,
                        page: pages[i].page,
                        dataUrl: pages[i].dataUrl
                    });
                    await new Promise(r => setTimeout(r, 120));
                }
                broadcastToClients({ type: 'SLIDE_DECK_END', targetClientId, total: pages.length });
            };

            // PDFを読み込み、指定範囲だけを画像化して配信する
            const handleLoadSlidePdf = async (file) => {
                if (!file) return;
                if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) {
                    showToast('⚠️ PDFファイルを選択してください');
                    return;
                }
                try {
                    setSlideDeckProgress({ done: 0, total: 0, label: 'PDFを解析中...' });

                    // 全ページを画像化して講師の手元に持つ（配信するのは公開範囲だけ）。
                    // こうしておくと、答えのページを研修中にワンクリックで開放できる。
                    const result = await rasterizePdfRange(file, 1, 0, (done, total) => {
                        setSlideDeckProgress({ done, total, label: '全ページを画像化中（配信は公開範囲のみ）...' });
                    });

                    const all = result.pages;
                    const lastPageNo = all[all.length - 1].page;
                    const first = Math.min(Math.max(1, slideInputPageStart), lastPageNo);
                    const last = slideInputPageEnd > 0
                        ? Math.min(Math.max(first, slideInputPageEnd), lastPageNo)
                        : lastPageNo;
                    const published = all.filter(p => p.page >= first && p.page <= last);

                    const info = { fileName: file.name, first, last, total: result.total };
                    setAllSlidePages(all);
                    allSlidePagesRef.current = all;
                    setSlidePages(published);
                    setSlideDeckInfo(info);
                    slidePagesRef.current = published;
                    slideDeckInfoRef.current = info;
                    setSlidePageStart(first);
                    setSlidePageEnd(last);
                    setSlideInputPageStart(first);
                    setSlideInputPageEnd(last);
                    deckDbPut({ pages: all, info })
                        .then(() => { if (projectorChRef.current) projectorChRef.current.postMessage({ type: 'DECK_UPDATED' }); })
                        .catch(() => {});

                    // 受講者へ渡すのは常にデッキだけ。講師の投影用URLは残したまま共有しない
                    broadcastToClients({ type: 'SYNC_SLIDE_URL', slideUrl: '', pageStart: first, pageEnd: last });
                    setProjectionSource('deck');

                    setSlideDeckProgress({ done: 0, total: published.length, label: '受講者へ配信中...' });
                    await broadcastSlideDeck(published, info);
                    broadcastDeckManifest();
                    setTimeout(broadcastDeckManifest, 2500);
                    setSlideDeckProgress(null);
                    // モーダルは閉じない。続けて公開範囲を調整できるようにする
                    showToast(`📄 ${first}〜${last}ページを配信しました（手元には全${result.total}Pを保持）`);
                } catch (e) {
                    console.warn('PDF rasterize error:', e);
                    setSlideDeckProgress(null);
                    showToast('⚠️ PDFの読み込みに失敗しました: ' + (e && e.message ? e.message : e));
                }
            };

            // 公開範囲を変更して受講者へ反映する。
            // 末尾を伸ばしただけなら増えたページだけを送るので、答え合わせが即座に反映される。
            const applyPublishRange = async (newStart, newEnd) => {
                const all = allSlidePagesRef.current;
                if (!all || all.length === 0) return;

                const minPage = all[0].page;
                const maxPage = all[all.length - 1].page;
                const first = Math.min(Math.max(minPage, newStart), maxPage);
                const last = Math.min(Math.max(first, newEnd), maxPage);
                const next = all.filter(p => p.page >= first && p.page <= last);
                const prev = slidePagesRef.current || [];

                setSlidePages(next);
                slidePagesRef.current = next;
                setSlidePageStart(first);
                setSlidePageEnd(last);
                setSlideInputPageStart(first);
                setSlideInputPageEnd(last);

                const info = { ...(slideDeckInfoRef.current || {}), first, last };
                setSlideDeckInfo(info);
                slideDeckInfoRef.current = info;
                deckDbPut({ pages: all, info })
                        .then(() => { if (projectorChRef.current) projectorChRef.current.postMessage({ type: 'DECK_UPDATED' }); })
                        .catch(() => {});

                broadcastToClients({ type: 'SYNC_SLIDE_URL', slideUrl: '', pageStart: first, pageEnd: last });

                const isPrefix = (short, long) => short.every((p, i) => long[i] && long[i].page === p.page);

                if (next.length > prev.length && isPrefix(prev, next)) {
                    // 末尾に追加されただけ → 増えた分のみ送信
                    for (let i = prev.length; i < next.length; i++) {
                        broadcastToClients({
                            type: 'SLIDE_DECK_APPEND',
                            index: i,
                            total: next.length,
                            page: next[i].page,
                            dataUrl: next[i].dataUrl
                        });
                        await new Promise(r => setTimeout(r, 120));
                    }
                } else if (next.length < prev.length && isPrefix(next, prev)) {
                    // 末尾が減っただけ → 長さだけ伝えて切り詰める
                    broadcastToClients({ type: 'SLIDE_DECK_TRUNCATE', total: next.length });
                } else {
                    // 先頭が変わったなど → 全部送り直す
                    await broadcastSlideDeck(next, info);
                }

                // 送信直後に一覧を配って受講者側と突き合わせる。
                // 1通目が落ちても拾えるよう少し間を置いてもう一度送る。
                broadcastDeckManifest();
                setTimeout(broadcastDeckManifest, 2500);
            };

            // 次の1ページ（＝答えのページ）を追加で公開する
            const handleRevealNextPage = () => {
                const all = allSlidePagesRef.current;
                const cur = slidePagesRef.current || [];
                if (!all || all.length === 0) return;
                if (cur.length > 0 && cur[cur.length - 1].page >= all[all.length - 1].page) {
                    showToast('ℹ️ すでに最終ページまで公開しています');
                    return;
                }
                const first = cur.length > 0 ? cur[0].page : all[0].page;
                const nextLast = cur.length > 0 ? cur[cur.length - 1].page + 1 : all[0].page;
                applyPublishRange(first, nextLast);
                // 投影は公開中ページだけを映すので、いま開放したページへ送る
                setBoardSlidePage(Math.max(0, (slidePagesRef.current || []).length - 1));
                showToast(`🔓 ${nextLast} ページを公開しました`);
            };

            // 公開を1ページ戻す（出しすぎた時のリカバリ）
            const handleHideLastPage = () => {
                const cur = slidePagesRef.current || [];
                if (cur.length <= 1) {
                    showToast('ℹ️ これ以上は戻せません');
                    return;
                }
                const first = cur[0].page;
                const nextLast = cur[cur.length - 1].page - 1;
                applyPublishRange(first, nextLast);
                showToast(`🔒 ${nextLast + 1} ページを非公開に戻しました`);
            };

            // デッキ配信の解除
            const handleClearSlideDeck = () => {
                setSlidePages([]);
                setAllSlidePages([]);
                setSlideDeckInfo(null);
                slidePagesRef.current = [];
                allSlidePagesRef.current = [];
                slideDeckInfoRef.current = null;
                deckDbClear().catch(() => {});
                broadcastToClients({ type: 'SLIDE_DECK_CLEAR' });

                // デッキが無くなったので、URLが登録されていれば従来通りそれを受講者へ共有する
                broadcastToClients({
                    type: 'SYNC_SLIDE_URL',
                    slideUrl: slideUrlRef.current || '',
                    pageStart: slidePageStartRef.current,
                    pageEnd: slidePageEndRef.current
                });
                setProjectionSource('url');
                showToast('📄 受講者へのPDF配信を解除しました');
            };

            // ==========================================================
            // 🖥️ 画面配信
            //   getDisplayMediaで取得した画面を一定間隔でJPEG化し、MQTTで配信する。
            //   画面に変化が無いフレームは送らないため、静止中は通信が発生しない。
            // ==========================================================
            const SCREEN_MAX_PAYLOAD = 420 * 1024;   // 1フレームの上限（ブローカーの1MB制限への安全域）
            const SCREEN_KEYFRAME_MS = 8000;         // 変化が無くても定期的に送り直す間隔
            // 同時に送信中のフレームは1枚まで。
            //   バイト数で上限を設けると、回線が細い環境では上限分の吐き出しに数秒かかり
            //   受講者が数秒前の画面を見続けることになる。1枚に絞ると遅延は
            //   「1フレームの送信時間」で頭打ちになり、常に最新の画面が届く。
            //   その分fpsは回線の実力どおりに自動で下がる（滑らかさより鮮度を優先）。

            const stopScreenShare = (silent) => {
                if (screenTimerRef.current) {
                    clearInterval(screenTimerRef.current);
                    screenTimerRef.current = null;
                }
                if (screenWorkerRef.current) {
                    try { screenWorkerRef.current.terminate(); } catch (e) {}
                    screenWorkerRef.current = null;
                }
                if (screenStreamRef.current) {
                    screenStreamRef.current.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
                    screenStreamRef.current = null;
                }
                screenVideoRef.current = null;
                screenLastFrameRef.current = null;
                screenThumbRef.current = null;
                screenSentCountRef.current = 0;
                screenTrafficRef.current = [];
                screenInFlightRef.current = false;
                screenDroppedRef.current = [];
                screenTickRef2.current = [];
                screenNoChangeRef.current = [];
                screenOutstandingRef.current = 0;
                screenTickRef.current = null;
                setIsScreenSharing(false);
                setScreenStats(null);
                broadcastToClients({ type: 'SCREEN_STOP' });
                if (!silent) showToast('🖥️ 画面配信を終了しました');
            };

            const startScreenShare = async () => {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                    showToast('⚠️ このブラウザは画面配信に対応していません');
                    return;
                }
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({
                        video: { frameRate: 5 },
                        audio: false
                    });
                    screenStreamRef.current = stream;

                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.muted = true;
                    video.playsInline = true;
                    await video.play();
                    screenVideoRef.current = video;

                    // ブラウザの「共有を停止」バーから止められた場合
                    stream.getVideoTracks()[0].addEventListener('ended', () => stopScreenShare(true));

                    const canvas = document.createElement('canvas');
                    const thumb = document.createElement('canvas');
                    thumb.width = 64; thumb.height = 36;

                    const tick = () => {
                        const nowTick = Date.now();
                        // タイマーが設定どおり回っているかを記録（fpsが上がらない原因の切り分け用）
                        const tw = screenTickRef2.current;
                        tw.push(nowTick);
                        while (tw.length && nowTick - tw[0] > 5000) tw.shift();

                        const v = screenVideoRef.current;
                        if (!v || !v.videoWidth) return;

                        // --- 差分検知（縮小画像で比較。静止中は送らない） ---
                        //   平均だけで見ると「小さい領域だけ変わった」場合に見逃すので、
                        //   1画素あたりの最大変化量も併せて判定する。
                        const tctx = thumb.getContext('2d');
                        tctx.drawImage(v, 0, 0, thumb.width, thumb.height);
                        const cur = tctx.getImageData(0, 0, thumb.width, thumb.height).data;
                        const prev = screenThumbRef.current;
                        let changed = true;
                        if (prev && prev.length === cur.length) {
                            let diff = 0, maxDiff = 0;
                            for (let i = 0; i < cur.length; i += 4) {
                                const d = Math.abs(cur[i] - prev[i]) + Math.abs(cur[i + 1] - prev[i + 1]) + Math.abs(cur[i + 2] - prev[i + 2]);
                                diff += d;
                                if (d > maxDiff) maxDiff = d;
                            }
                            const mean = diff / (cur.length / 4);
                            changed = mean > 3 || maxDiff > 40;
                        }
                        screenThumbRef.current = new Uint8ClampedArray(cur);

                        const now = nowTick;
                        const needKeyframe = now - screenLastSentAtRef.current > SCREEN_KEYFRAME_MS;
                        if (!changed && !needKeyframe) {
                            const nw = screenNoChangeRef.current;
                            nw.push(now);
                            while (nw.length && now - nw[0] > 5000) nw.shift();
                            return;
                        }

                        // --- 背圧制御 ---
                        // ① エンコード中なら重ねて走らせない
                        if (screenInFlightRef.current) {
                            screenDroppedRef.current.push(now);
                            return;
                        }
                        // ② 前のフレームがまだ送り切れていなければ、今回は送らない（鮮度優先）
                        if (screenOutstandingRef.current > 0) {
                            screenDroppedRef.current.push(now);
                            return;
                        }

                        // --- 本フレームを画像化（画質は設定に従う。WebPが使えればWebP） ---
                        const preset = SCREEN_QUALITY_PRESETS[screenQualityRef.current] || SCREEN_QUALITY_PRESETS.medium;
                        const scale = Math.min(1, preset.width / v.videoWidth);
                        canvas.width = Math.round(v.videoWidth * scale);
                        canvas.height = Math.round(v.videoHeight * scale);
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

                        // ここから非同期。toBlobはtoDataURLと違いbase64化しないので約25%小さい。
                        screenInFlightRef.current = true;
                        const frameW = canvas.width;
                        canvas.toBlob(async (blob) => {
                            const done = () => { screenInFlightRef.current = false; };
                            try {
                                if (!blob || blob.size > SCREEN_MAX_PAYLOAD) { done(); return; }
                                const bytes = new Uint8Array(await blob.arrayBuffer());
                                screenLastFrameRef.current = { bytes, mime: blob.type || SCREEN_IMAGE_TYPE };
                                screenLastSentAtRef.current = now;
                                screenSentCountRef.current += 1;

                                const payload = packScreenFrame(bytes, blob.type || SCREEN_IMAGE_TYPE, null);

                                // 滞留量に計上し、送り切れたら差し引く
                                screenOutstandingRef.current += payload.length;
                                let settled = false;
                                const settle = () => {
                                    if (settled) return;
                                    settled = true;
                                    screenOutstandingRef.current = Math.max(0, screenOutstandingRef.current - payload.length);
                                };
                                // 完了通知が来ない環境でも詰まったままにならないよう保険をかける
                                setTimeout(settle, 5000);

                                mqttClientRef.current.publish(
                                    `bansho/room/${activeRoomId}/screen`,
                                    payload,
                                    { qos: 0 },
                                    settle
                                );
                                done(); // エンコードの排他はここで解除。送信可否は滞留量で判断する

                                // 直近5秒の実測から、実効レートと実際に出ているfpsを算出
                                const traffic = screenTrafficRef.current;
                                traffic.push({ t: now, bytes: bytes.length });
                                while (traffic.length && now - traffic[0].t > 5000) traffic.shift();
                                const span = traffic.length > 1 ? (now - traffic[0].t) / 1000 : 1;
                                const kbps = Math.round(traffic.reduce((a, b) => a + b.bytes, 0) / 1024 / Math.max(1, span));
                                const fps = Math.round((traffic.length / Math.max(1, span)) * 10) / 10;
                                const dw = screenDroppedRef.current;
                                while (dw.length && now - dw[0] > 5000) dw.shift();

                                const tw2 = screenTickRef2.current;
                                const tickSpan = tw2.length > 1 ? (now - tw2[0]) / 1000 : 1;
                                const tickHz = Math.round((tw2.length / Math.max(1, tickSpan)) * 10) / 10;
                                const nw2 = screenNoChangeRef.current;
                                while (nw2.length && now - nw2[0] > 5000) nw2.shift();

                                setScreenStats({
                                    frames: screenSentCountRef.current,
                                    kb: Math.round(bytes.length / 1024),
                                    kbps,
                                    fps,
                                    tickHz,
                                    noChange: nw2.length,
                                    dropped: dw.length,
                                    queuedKB: Math.round(screenOutstandingRef.current / 1024),
                                    w: frameW,
                                    fmt: (blob.type || SCREEN_IMAGE_TYPE) === 'image/webp' ? 'WebP' : 'JPEG'
                                });
                            } catch (e) {
                                console.warn('Screen frame publish error:', e);
                                done();
                            }
                        }, SCREEN_IMAGE_TYPE, preset.quality);
                    };

                    // 実際のタイマーは下のuseEffectが張る（配信中の間隔変更に追従させるため）
                    screenTickRef.current = tick;
                    setIsScreenSharing(true);
                    broadcastToClients({ type: 'SCREEN_START' });
                    showToast('🖥️ 画面配信を開始しました（受講者の「画面」タブに表示されます）');
                } catch (e) {
                    console.warn('Screen share error:', e);
                    if (e && e.name === 'NotAllowedError') {
                        showToast('画面配信をキャンセルしました');
                    } else {
                        showToast('⚠️ 画面配信を開始できませんでした: ' + (e && e.message ? e.message : e));
                    }
                    stopScreenShare(true);
                }
            };

            // 配信のタイマー。更新間隔の変更にも追従する。
            //   メインスレッドの setInterval は「タブが非表示」の間 1Hz に制限されるため、
            //   講師が別ウィンドウで操作を見せている間は 0.3秒/0.5秒 の設定が効かなくなる。
            //   Web Worker のタイマーはこの制限を受けないので、そちらで刻む。
            useEffect(() => {
                if (!isScreenSharing || appRole !== 'board') return;

                const runTick = () => { if (screenTickRef.current) screenTickRef.current(); };

                let worker = null;
                let objectUrl = null;
                try {
                    const workerCode = 'let id=null;onmessage=function(e){if(id)clearInterval(id);if(e.data>0){id=setInterval(function(){postMessage(0);},e.data);}};';
                    objectUrl = URL.createObjectURL(new Blob([workerCode], { type: 'application/javascript' }));
                    worker = new Worker(objectUrl);
                    worker.onmessage = runTick;
                    worker.postMessage(screenIntervalMs);
                    screenWorkerRef.current = worker;
                } catch (e) {
                    // Workerが使えない環境では従来のタイマーにフォールバック（非表示時は1Hz止まり）
                    console.warn('Screen timer worker unavailable, falling back:', e);
                    screenTimerRef.current = setInterval(runTick, screenIntervalMs);
                }

                return () => {
                    if (worker) {
                        try { worker.terminate(); } catch (e) {}
                        screenWorkerRef.current = null;
                    }
                    if (objectUrl) URL.revokeObjectURL(objectUrl);
                    if (screenTimerRef.current) {
                        clearInterval(screenTimerRef.current);
                        screenTimerRef.current = null;
                    }
                };
            }, [isScreenSharing, screenIntervalMs, appRole]);

            // 受講者へリンクを配る（埋め込まず、各自のブラウザで開いてもらう）
            const handleShareLink = (rawUrl, rawLabel) => {
                const input = (rawUrl || '').trim();
                if (!input) {
                    showToast('⚠️ URLを入力してください');
                    return;
                }
                const url = /^https?:\/\//i.test(input) ? input : 'https://' + input;
                const next = { url, label: (rawLabel || '').trim() };

                setSharedLink(next);
                sharedLinkRef.current = next;
                setShowLinkModal(false);
                broadcastToClients({ type: 'SYNC_SHARED_LINK', link: next });
                showToast('🔗 リンクを受講者に配りました');
            };

            // 公開中のページ番号一覧を送る。画像を含まないので軽い。
            //   受講者はこれと手元を突き合わせ、欠けている番号だけを取り直す。
            //   タイマーだけに頼ると、講師タブが非表示のときブラウザに1分間隔まで
            //   間引かれるため、公開範囲を変えた直後にも必ず送る。
            const broadcastDeckManifest = () => {
                const pub = slidePagesRef.current || [];
                if (pub.length === 0) return;
                broadcastToClients({ type: 'SLIDE_DECK_MANIFEST', pages: pub.map(p => p.page) });
            };

            // 公開中のスライドのページ番号だけを定期配信する（画像は含まないので軽い）。
            // 受講者はこれと自分の持ち分を突き合わせ、欠けている番号だけを取り直す。
            useEffect(() => {
                if (appRole !== 'board') return;
                const timer = setInterval(broadcastDeckManifest, 15000);
                return () => clearInterval(timer);
            }, [appRole]);

            // 受講者が一瞬でも切れていると QoS0 のメッセージは届かず、
            // 接続が生きているため再同期も起きない（解除したリンクが残り続ける等）。
            // 20秒ごとに軽い状態を配り直して、取りこぼしても自動で揃うようにする。
            useEffect(() => {
                if (appRole !== 'board') return;
                const timer = setInterval(() => {
                    broadcastToClients({
                        type: 'SYNC_SMALL_STATE',
                        sharedLink: sharedLinkRef.current,
                        isLocked: isSubmissionsLockedRef.current,
                        screenSharing: !!screenTickRef.current
                    });
                }, 20000);
                return () => clearInterval(timer);
            }, [appRole]);

            // 入力中の内容をよく使うリンクとして登録する
            const handleAddSavedLink = () => {
                const input = (linkInputUrl || '').trim();
                if (!input) {
                    showToast('⚠️ URLを入力してください');
                    return;
                }
                const url = /^https?:\/\//i.test(input) ? input : 'https://' + input;
                const label = (linkInputLabel || '').trim();
                if (savedLinks.some(l => l.url === url)) {
                    showToast('ℹ️ 同じURLが既に登録されています');
                    return;
                }
                setSavedLinks(prev => [...prev, { id: 'lnk-' + Date.now(), url, label }]);
                showToast('⭐ よく使うリンクに登録しました');
            };

            const handleDeleteSavedLink = (id) => {
                setSavedLinks(prev => prev.filter(l => l.id !== id));
            };

            const handleClearSharedLink = () => {
                setSharedLink(null);
                sharedLinkRef.current = null;
                broadcastToClients({ type: 'SYNC_SHARED_LINK', link: null });
                showToast('🔗 リンクの共有を解除しました');
            };

            const handleSaveSlideUrl = (url, startP = 1, endP = 0) => {
                const sNum = Math.max(1, parseInt(startP, 10) || 1);
                const eNum = Math.max(0, parseInt(endP, 10) || 0);

                // URLは変換せず「元のURL」を保存する
                const originalUrl = (url || '').trim();

                const hasDeckNow = allSlidePagesRef.current.length > 0;

                setSlideUrl(originalUrl);
                slideUrlRef.current = originalUrl;

                if (hasDeckNow) {
                    // 受講者へはPDF配信を続ける。URLは講師の投影専用なので送らないし、
                    // 公開ページ範囲もデッキ側が持っているので触らない。
                    if (originalUrl) setProjectionSource('url');
                    showToast(
                        originalUrl
                            ? '📽️ 講師の投影用URLを設定しました（受講者へはPDF配信のまま）'
                            : '📽️ 講師の投影用URLを解除しました'
                    );
                    return;
                }

                // デッキが無い場合は従来通り、URLと公開範囲をそのまま受講者へ共有する
                setSlidePageStart(sNum);
                setSlidePageEnd(eNum);
                broadcastToClients({
                    type: 'SYNC_SLIDE_URL',
                    slideUrl: originalUrl,
                    pageStart: sNum,
                    pageEnd: eNum
                });

                const rangeText = eNum > 0
                    ? `（公開範囲: ${sNum}〜${eNum}P）`
                    : '（全ページ公開）';

                showToast(
                    originalUrl
                        ? `📄 研修スライドを設定しました${rangeText}`
                        : '📄 スライドの登録を解除しました'
                );
            };

            useEffect(() => { timerSecondsRef.current = timerSeconds; }, [timerSeconds]);
            useEffect(() => { isTimerRunningRef.current = isTimerRunning; }, [isTimerRunning]);
            useEffect(() => { timerTotalRef.current = timerTotal; }, [timerTotal]);
            useEffect(() => { isSubmissionsLockedRef.current = isSubmissionsLocked; }, [isSubmissionsLocked]);

            // Web Audio APIによるタイムアップ音（ベルチャイム・外部ファイル不要）
            const playTimeUpSound = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = ctx.currentTime;
                    const freqs = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
                    freqs.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + i * 0.18);
                        gain.gain.setValueAtTime(0.3, now + i * 0.18);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.6);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
