<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研修ワークナビ AI (v1.19.1)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- MQTT WebSocket for 100% Reliable Realtime Sync -->
    <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #f3f4f6;
            height: 100dvh;
            min-height: 100dvh;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .sticky-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 4px 8px rgba(0,0,0,0.08);
        }
        .sticky-card:hover {
            transform: translateY(-2px) rotate(-0.5deg);
            box-shadow: 4px 8px 16px rgba(0,0,0,0.12);
        }
        .sticky-yellow { background-color: #fef08a; border-color: #fde047; color: #713f12; }
        .sticky-green  { background-color: #bbf7d0; border-color: #86efac; color: #14532d; }
        .sticky-blue   { background-color: #bfdbfe; border-color: #93c5fd; color: #1e3a8a; }
        .sticky-pink   { background-color: #fbcfe8; border-color: #f9a8d4; color: #831843; }
        .sticky-purple { background-color: #e9d5ff; border-color: #d8b4fe; color: #581c87; }
        .sticky-orange { background-color: #fed7aa; border-color: #fdba74; color: #7c2d12; }
        .sticky-cyan   { background-color: #a5f3fc; border-color: #67e8f9; color: #164e63; }
        .sticky-lime   { background-color: #d9f99d; border-color: #bef264; color: #365314; }
        .sticky-gray   { background-color: #e2e8f0; border-color: #cbd5e1; color: #1e293b; }
        .sticky-white  { background-color: #ffffff; border-color: #e2e8f0; color: #0f172a; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-[100dvh] min-h-[100dvh] w-full max-w-full overflow-x-hidden flex flex-col bg-slate-100 text-slate-800">
    <div id="root" class="h-full w-full max-w-full overflow-x-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const APP_VERSION = "v1.19.1";

        // 付箋カラーパレット定義（①〜⑧班カラー ＋ 🩶グレー・🤍ホワイト）
        const COLOR_PALETTE = [
            { num: 1, numLabel: '①', id: 'sticky-yellow', bg: 'bg-yellow-300', dot: 'bg-yellow-400', name: 'イエロー (1班)', text: 'text-amber-950' },
            { num: 2, numLabel: '②', id: 'sticky-green',  bg: 'bg-emerald-300', dot: 'bg-emerald-400', name: 'グリーン (2班)', text: 'text-emerald-950' },
            { num: 3, numLabel: '③', id: 'sticky-blue',   bg: 'bg-sky-300',     dot: 'bg-sky-400',     name: 'ブルー (3班)',   text: 'text-sky-950' },
            { num: 4, numLabel: '④', id: 'sticky-purple', bg: 'bg-purple-300',  dot: 'bg-purple-400',  name: 'パープル (4班)', text: 'text-purple-950' },
            { num: 5, numLabel: '⑤', id: 'sticky-orange', bg: 'bg-orange-300',  dot: 'bg-orange-400',  name: 'オレンジ (5班)', text: 'text-orange-950' },
            { num: 6, numLabel: '⑥', id: 'sticky-pink',   bg: 'bg-pink-300',    dot: 'bg-pink-400',    name: 'ピンク (6班)',   text: 'text-pink-950' },
            { num: 7, numLabel: '⑦', id: 'sticky-cyan',   bg: 'bg-cyan-300',    dot: 'bg-cyan-400',    name: 'シアン (7班)',   text: 'text-cyan-950' },
            { num: 8, numLabel: '⑧', id: 'sticky-lime',   bg: 'bg-lime-300',    dot: 'bg-lime-400',    name: 'ライム (8班)',   text: 'text-lime-950' },
            { num: 9, numLabel: '🩶', id: 'sticky-gray',   bg: 'bg-slate-300',   dot: 'bg-slate-400',   name: 'グレー (中項目・見出し用)', text: 'text-slate-800' },
            { num: 10, numLabel: '🤍', id: 'sticky-white',  bg: 'bg-white border border-slate-300', dot: 'bg-slate-200', name: 'ホワイト (シンプル・メモ用)', text: 'text-slate-800' }
        ];

        // 動物アバター一覧（名前から自動決定）
        const ANIMAL_AVATARS = [
            '🦊', '🐼', '🐨', '🦁', '🐯', 
            '🐶', '🐱', '🐰', '🐻', '🐵', 
            '🐧', '🐬', '🦉', '🦄', '🐝', 
            '🐙', '🐸', '🦆', '🦖', '🐘'
        ];

        // 投稿者名から自動で動物アバターを算出
        const getAvatarByName = (name) => {
            if (!name || !name.trim()) return '👤';
            let hash = 0;
            const str = name.trim();
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % ANIMAL_AVATARS.length;
            return ANIMAL_AVATARS[index];
        };

        // 投稿者名から自動でカラーを算出するハッシュ関数（方式A: 投稿者とカラーの自動連動）
        const getColorByName = (name) => {
            if (!name || !name.trim()) return 'sticky-yellow';
            let hash = 0;
            const str = name.trim();
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % COLOR_PALETTE.length;
            return COLOR_PALETTE[index].id;
        };

        // お名前からアバター絵文字を決定するヘルパー
        const AVATAR_LIST = ['🐱', '🐶', '🐰', '🐼', '🦊', '🦁', '🐻', '🐨', '🐯', '🐵', '🐮', '🐥'];
        const getAvatarByName = (name) => {
            if (!name || !name.trim()) return '👤';
            let hash = 0;
            const str = name.trim();
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return AVATAR_LIST[Math.abs(hash) % AVATAR_LIST.length];
        };

        // GoogleスライドURLまたはWeb/PDF URLを埋め込み用URLに自動変換するヘルパー
        const convertToEmbedUrl = (rawUrl) => {
            if (!rawUrl || !rawUrl.trim()) return '';
            const url = rawUrl.trim();
            // Google Slides: https://docs.google.com/presentation/d/{ID}/edit... -> /embed
            const gslideMatch = url.match(/docs\.google\.com\/presentation\/d\/([a-zA-Z0-9_-]+)/);
            if (gslideMatch && gslideMatch[1]) {
                return `https://docs.google.com/presentation/d/${gslideMatch[1]}/embed?start=false&loop=false&delayms=3000`;
            }
            // Google Drive PDF: https://drive.google.com/file/d/{ID}/view -> /preview
            const gdriveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (gdriveMatch && gdriveMatch[1]) {
                return `https://drive.google.com/file/d/${gdriveMatch[1]}/preview`;
            }
            return url;
        };

        const INITIAL_CATEGORIES = [
            { id: 'cat-1', title: '💡 アイデア・提案', color: 'bg-amber-500' },
            { id: 'cat-2', title: '⚠️ 課題・現状の悩み', color: 'bg-rose-500' },
            { id: 'cat-3', title: '🚀 次のアクション', color: 'bg-emerald-500' }
        ];

        const INITIAL_CARDS = [
            { id: 'c-1', text: 'スマホから誰でもすぐに意見を投稿できるようにしたい', color: 'sticky-yellow', categoryId: null, votes: 4, author: '受講者A', createdAt: '16:10' },
            { id: 'c-2', text: '研修中のグループワークでの発言を可視化したい', color: 'sticky-blue', categoryId: null, votes: 2, author: '受講者B', createdAt: '16:12' },
            { id: 'c-3', text: '意見が多くなりすぎた時に分類に時間がかかる', color: 'sticky-pink', categoryId: null, votes: 5, author: '受講者C', createdAt: '16:15' },
            { id: 'c-4', text: 'AIが要約まで作ってくれるとレポート作成が楽になる', color: 'sticky-green', categoryId: null, votes: 3, author: '受講者D', createdAt: '16:18' }
        ];

        function App() {
            const urlParams = new URLSearchParams(window.location.search);
            const isParticipantOnly = urlParams.get('role') === 'participant';
            const initialRole = isParticipantOnly ? 'participant' : 'board';
            const targetRoomParam = urlParams.get('room') || '';

            // 講師用ホストルームID（ユニーク生成または保存済みIDを使用）
            const getInitialHostRoomId = () => {
                if (targetRoomParam) return targetRoomParam;
                let saved = localStorage.getItem('bansho_host_room_id');
                if (!saved) {
                    saved = 'room-' + Math.random().toString(36).substring(2, 8);
                    localStorage.setItem('bansho_host_room_id', saved);
                }
                return saved;
            };

            const [activeRoomId, setActiveRoomId] = useState(isParticipantOnly ? targetRoomParam : getInitialHostRoomId());
            const [connectedCount, setConnectedCount] = useState(0);
            const [peerConnected, setPeerConnected] = useState(false);

            // 画面サイズ判定（スマホ < 768px <= 一般PC）
            const [isMobile, setIsMobile] = useState(() => typeof window !== 'undefined' ? window.innerWidth < 768 : false);
            const [participantPcTab, setParticipantPcTab] = useState('slide'); // 'slide' | 'board'

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth < 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const [appRole, setAppRole] = useState(initialRole);

            // 参加者お名前変更ハンドラ
            const handleParticipantNameChange = (val) => {
                setParticipantName(val);
                localStorage.setItem('bansho_my_name', val);
            };

            // ホスト・MQTT再接続ハンドラ
            const connectToHost = () => {
                if (mqttClientRef.current) {
                    try {
                        mqttClientRef.current.reconnect();
                        showToast('🔄 ボードへ再接続を試行中...');
                    } catch (e) {
                        console.warn(e);
                    }
                }
            };

            // 板書・ワークショップのテーマタイトル
            const [sessionThemeTitle, setSessionThemeTitle] = useState(() => {
                return localStorage.getItem('bansho_session_title') || 'ワークショップ・意見整理';
            });
            const [isEditingThemeTitle, setIsEditingThemeTitle] = useState(false);
            const [tempThemeTitle, setTempThemeTitle] = useState(sessionThemeTitle);

            const [categories, setCategories] = useState(() => {
                const saved = localStorage.getItem('bansho_categories');
                return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
            });
            const [cards, setCards] = useState(() => {
                const saved = localStorage.getItem('bansho_cards');
                return saved ? JSON.parse(saved) : INITIAL_CARDS;
            });

            // Gemini API Key (LocalStorage保存)
            const [geminiApiKey, setGeminiApiKey] = useState(() => {
                return localStorage.getItem('bansho_gemini_api_key') || '';
            });

            // 過去の板書アーカイブ一覧
            const [archives, setArchives] = useState(() => {
                const saved = localStorage.getItem('bansho_archives');
                return saved ? JSON.parse(saved) : [];
            });

            // 自分の投稿履歴
            const [myHistory, setMyHistory] = useState(() => {
                const saved = localStorage.getItem('bansho_my_history');
                return saved ? JSON.parse(saved) : [];
            });

            // 自分のいいね投票記録 ({ cardId: true })
            const [myVotes, setMyVotes] = useState(() => {
                const saved = localStorage.getItem('bansho_my_votes');
                return saved ? JSON.parse(saved) : {};
            });

            // 参加者画面のタブ ('post' | 'timeline')
            const [participantTab, setParticipantTab] = useState('post');
            // タイムラインの並び順 ('latest' | 'votes')
            const [timelineSort, setTimelineSort] = useState('latest');

            const [participantName, setParticipantName] = useState(() => {
                return localStorage.getItem('bansho_my_name') || '';
            });
            const [facilitatorName, setFacilitatorName] = useState(() => {
                return localStorage.getItem('bansho_facilitator_name') || '講師';
            });
            const [inputLevel, setInputLevel] = useState(0); // 講師追加時の初期階層 (0=大, 1=中, 2=小)
            const [inputText, setInputText] = useState('');
            const [selectedColor, setSelectedColor] = useState(() => {
                return localStorage.getItem('bansho_selected_color') || 'sticky-yellow';
            });

            // 講師の入力名をブラウザに記憶
            useEffect(() => {
                localStorage.setItem('bansho_facilitator_name', facilitatorName);
            }, [facilitatorName]);

            // 手動選択した色をブラウザに記憶
            useEffect(() => {
                localStorage.setItem('bansho_selected_color', selectedColor);
            }, [selectedColor]);

            // お名前入力（アバター連動、色は手動選択したものを維持）
            const handleParticipantNameChange = (name) => {
                setParticipantName(name);
            };
            const [draggedCardId, setDraggedCardId] = useState(null);
            const [viewMode, setViewMode] = useState('kanban');
            const [isAiProcessing, setIsAiProcessing] = useState(false);
            const [showExportModal, setShowExportModal] = useState(false);
            const [showBulkModal, setShowBulkModal] = useState(false);
            const [showQrModal, setShowQrModal] = useState(false);
            const [showArchiveModal, setShowArchiveModal] = useState(false);
            const [showNewBoardModal, setShowNewBoardModal] = useState(false);
            const [showSaveSnapshotModal, setShowSaveSnapshotModal] = useState(false);
            const [saveSnapshotTitle, setSaveSnapshotTitle] = useState('');
            const [showConfigModal, setShowConfigModal] = useState(false);
            const [configInputKey, setConfigInputKey] = useState('');
            const [isTestingKey, setIsTestingKey] = useState(false);
            const [newSessionTitle, setNewSessionTitle] = useState('');
            const [bulkInputText, setBulkInputText] = useState('');
            const [newCategoryTitle, setNewCategoryTitle] = useState('');
            const [isAddingCategory, setIsAddingCategory] = useState(false);
            const [summaries, setSummaries] = useState({});
            const [toastMessage, setToastMessage] = useState(null);
            const [peerConnected, setPeerConnected] = useState(false);

            // 📄 スライド資料（Googleスライド / PDF）State
            const [slideUrl, setSlideUrl] = useState(() => {
                return localStorage.getItem('bansho_slide_url') || '';
            });
            const [showSlideModal, setShowSlideModal] = useState(false);
            const [slideInputUrl, setSlideInputUrl] = useState('');
            const slideUrlRef = useRef(slideUrl);

            useEffect(() => {
                slideUrlRef.current = slideUrl;
                localStorage.setItem('bansho_slide_url', slideUrl);
            }, [slideUrl]);

            // ⏱️ 研修用タイマー & 🔒 投稿受付ロックの State
            const [timerSeconds, setTimerSeconds] = useState(0); // 残り秒数
            const [timerTotal, setTimerTotal] = useState(0);     // 設定総秒数
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [isTimeUp, setIsTimeUp] = useState(false);
            const [isSubmissionsLocked, setIsSubmissionsLocked] = useState(false); // 投稿受付ロック

            const peerRef = useRef(null);
            const connRef = useRef(null);
            const hostConnsRef = useRef([]); // 講師ボード接続クライアント一覧
            const sessionThemeTitleRef = useRef(sessionThemeTitle);
            const cardsRef = useRef(cards);
            const timerSecondsRef = useRef(timerSeconds);
            const isTimerRunningRef = useRef(isTimerRunning);
            const timerTotalRef = useRef(timerTotal);
            const isSubmissionsLockedRef = useRef(isSubmissionsLocked);

            const handleSaveSlideUrl = (url) => {
                const converted = convertToEmbedUrl(url);
                setSlideUrl(converted);
                setShowSlideModal(false);
                broadcastToClients({ type: 'SYNC_SLIDE_URL', slideUrl: converted });
                showToast(converted ? '📄 研修スライド資料を設定しました（全員のスマホにも同期）' : '📄 スライド資料の登録を解除しました');
            };

            useEffect(() => { timerSecondsRef.current = timerSeconds; }, [timerSeconds]);
            useEffect(() => { isTimerRunningRef.current = isTimerRunning; }, [isTimerRunning]);
            useEffect(() => { timerTotalRef.current = timerTotal; }, [timerTotal]);
            useEffect(() => { isSubmissionsLockedRef.current = isSubmissionsLocked; }, [isSubmissionsLocked]);

            // Web Audio APIによるタイムアップ音（ベルチャイム・外部ファイル不要）
            const playTimeUpSound = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = ctx.currentTime;
                    const freqs = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
                    freqs.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + i * 0.18);
                        gain.gain.setValueAtTime(0.3, now + i * 0.18);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.6);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + i * 0.18);
                        osc.stop(now + i * 0.18 + 0.6);
                    });
                } catch (e) {
                    console.warn('Audio context error:', e);
                }
            };

            // タイマーのカウントダウン処理（講師側のみ動作し、受講者へブロードキャスト）
            useEffect(() => {
                let interval = null;
                if (isTimerRunning && appRole === 'board') {
                    interval = setInterval(() => {
                        setTimerSeconds(prev => {
                            if (prev <= 1) {
                                setIsTimerRunning(false);
                                setIsTimeUp(true);
                                playTimeUpSound();
                                broadcastToClients({ 
                                    type: 'SYNC_TIMER', 
                                    seconds: 0, 
                                    total: timerTotalRef.current, 
                                    isRunning: false, 
                                    isTimeUp: true 
                                });
                                return 0;
                            }
                            const next = prev - 1;
                            broadcastToClients({ 
                                type: 'SYNC_TIMER', 
                                seconds: next, 
                                total: timerTotalRef.current, 
                                isRunning: true, 
                                isTimeUp: false 
                            });
                            return next;
                        });
                    }, 1000);
                }
                return () => {
                    if (interval) clearInterval(interval);
                };
            }, [isTimerRunning, appRole]);

            // タイマー開始・停止・リセットハンドラー
            const handleStartTimer = (minutes) => {
                const totalSec = minutes * 60;
                setTimerTotal(totalSec);
                setTimerSeconds(totalSec);
                setIsTimerRunning(true);
                setIsTimeUp(false);
                broadcastToClients({ 
                    type: 'SYNC_TIMER', 
                    seconds: totalSec, 
                    total: totalSec, 
                    isRunning: true, 
                    isTimeUp: false 
                });
                showToast(`⏱️ ${minutes}分タイマーを開始しました！`);
            };

            const handleToggleTimer = () => {
                if (timerSeconds <= 0) return;
                const nextRunning = !isTimerRunning;
                setIsTimerRunning(nextRunning);
                broadcastToClients({ 
                    type: 'SYNC_TIMER', 
                    seconds: timerSeconds, 
                    total: timerTotal, 
                    isRunning: nextRunning, 
                    isTimeUp: false 
                });
            };

            const handleResetTimer = () => {
                setIsTimerRunning(false);
                setTimerSeconds(0);
                setTimerTotal(0);
                setIsTimeUp(false);
                broadcastToClients({ 
                    type: 'SYNC_TIMER', 
                    seconds: 0, 
                    total: 0, 
                    isRunning: false, 
                    isTimeUp: false 
                });
            };

            // 投稿ロック切り替えハンドラー
            const handleToggleLock = () => {
                const nextLocked = !isSubmissionsLocked;
                setIsSubmissionsLocked(nextLocked);
                broadcastToClients({ type: 'SYNC_LOCK', isLocked: nextLocked });
                showToast(nextLocked ? '🔒 受講者の投稿受付を一時停止しました（解説モード）' : '🟢 受講者の投稿受付を再開しました！');
            };

            // 時間表示フォーマッタ（mm:ss）
            const formatTime = (totalSeconds) => {
                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            useEffect(() => {
                sessionThemeTitleRef.current = sessionThemeTitle;
            }, [sessionThemeTitle]);

            useEffect(() => {
                cardsRef.current = cards;
            }, [cards]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            // リアルタイム通信用クライアントID & 在室管理マップ
            const myClientId = useRef('user_' + Math.random().toString(36).substring(2, 9)).current;
            const activeClientsRef = useRef(new Map());
            const mqttClientRef = useRef(null);

            // ホストから全参加者へのブロードキャスト関数（MQTT）
            const broadcastToClients = (msg) => {
                if (mqttClientRef.current && mqttClientRef.current.connected) {
                    try {
                        const topic = `bansho/room/${activeRoomId}`;
                        mqttClientRef.current.publish(topic, JSON.stringify({ ...msg, senderId: myClientId }));
                    } catch (e) {
                        console.warn('Broadcast error:', e);
                    }
                }
            };

            // テーマタイトル変更時に全クライアントへ即時自動配信
            useEffect(() => {
                if (appRole === 'board') {
                    broadcastToClients({ type: 'SYNC_THEME', themeTitle: sessionThemeTitle });
                }
            }, [sessionThemeTitle, appRole]);

            // MQTT WebSocketによる100%確実なリアルタイム同期
            useEffect(() => {
                let isMounted = true;
                const topic = `bansho/room/${activeRoomId}`;

                try {
                    console.log('Connecting to MQTT Broker for room:', activeRoomId);
                    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                        clientId: myClientId,
                        clean: true,
                        connectTimeout: 5000,
                        reconnectPeriod: 3000,
                        keepalive: 30
                    });
                    mqttClientRef.current = client;

                    client.on('connect', () => {
                        console.log('MQTT Connected successfully to topic:', topic);
                        if (!isMounted) return;
                        setPeerConnected(true);
                        client.subscribe(topic, { qos: 0 }, (err) => {
                            if (err) console.warn('Subscribe error:', err);
                            else {
                                if (appRole === 'participant') {
                                    client.publish(topic, JSON.stringify({
                                        type: 'JOIN',
                                        senderId: myClientId,
                                        author: participantName || '受講者'
                                    }));
                                    client.publish(topic, JSON.stringify({
                                        type: 'REQUEST_SYNC',
                                        senderId: myClientId
                                    }));
                                }
                            }
                        });
                    });

                    client.on('reconnect', () => {
                        console.log('MQTT Reconnecting...');
                    });

                    client.on('close', () => {
                        if (isMounted) setPeerConnected(false);
                    });

                    client.on('error', (err) => {
                        console.warn('MQTT Error:', err);
                    });

                    client.on('message', (t, message) => {
                        if (!isMounted || t !== topic) return;
                        try {
                            const data = JSON.parse(message.toString());
                            if (!data || data.senderId === myClientId) return; // 自分が送信したメッセージは無視

                            if (appRole === 'board') {
                                // 講師側でのメッセージ受信処理
                                if (data.type === 'JOIN' || data.type === 'HEARTBEAT') {
                                    activeClientsRef.current.set(data.senderId, Date.now());
                                    setConnectedCount(activeClientsRef.current.size);
                                } else if (data.type === 'REQUEST_SYNC') {
                                    activeClientsRef.current.set(data.senderId, Date.now());
                                    setConnectedCount(activeClientsRef.current.size);
                                    client.publish(topic, JSON.stringify({
                                        type: 'SYNC_FULL_STATE',
                                        senderId: myClientId,
                                        targetClientId: data.senderId,
                                        cards: cardsRef.current,
                                        themeTitle: sessionThemeTitleRef.current,
                                        timer: {
                                            seconds: timerSecondsRef.current,
                                            total: timerTotalRef.current,
                                            isRunning: isTimerRunningRef.current
                                        },
                                        isLocked: isSubmissionsLockedRef.current,
                                        slideUrl: slideUrlRef.current
                                    }));
                                } else if (data.type === 'NEW_CARD') {
                                    setCards(prev => {
                                        const next = [data.card, ...prev];
                                        return next;
                                    });
                                    showToast(`📩 ${data.card.author || '受講者'}から意見が届きました！`);
                                } else if (data.type === 'DELETE_CARD') {
                                    setCards(prev => prev.filter(c => c.id !== data.cardId));
                                    showToast(`🗑️ ${data.author || '受講者'}が意見の送信を取り消しました`);
                                } else if (data.type === 'VOTE_CARD') {
                                    setCards(prev => prev.map(c => c.id === data.cardId ? { ...c, votes: Math.max(0, (c.votes || 0) + (data.delta || 1)) } : c));
                                }
                            } else if (appRole === 'participant') {
                                // 参加者側でのメッセージ受信処理
                                if (data.type === 'SYNC_FULL_STATE' && (!data.targetClientId || data.targetClientId === myClientId)) {
                                    if (data.cards) setCards(data.cards);
                                    if (data.themeTitle) setSessionThemeTitle(data.themeTitle);
                                    if (data.timer) {
                                        setTimerSeconds(data.timer.seconds || 0);
                                        setTimerTotal(data.timer.total || 0);
                                        setIsTimerRunning(!!data.timer.isRunning);
                                    }
                                    if (typeof data.isLocked === 'boolean') {
                                        setIsSubmissionsLocked(data.isLocked);
                                    }
                                    if (data.slideUrl !== undefined) {
                                        setSlideUrl(data.slideUrl);
                                    }
                                } else if (data.type === 'SYNC_CARDS') {
                                    if (data.cards) setCards(data.cards);
                                    if (data.themeTitle) setSessionThemeTitle(data.themeTitle);
                                } else if (data.type === 'SYNC_SLIDE_URL') {
                                    setSlideUrl(data.slideUrl || '');
                                    if (data.slideUrl) showToast('📄 研修スライド資料が更新されました');
                                } else if (data.type === 'SYNC_TIMER') {
                                    setTimerSeconds(data.seconds || 0);
                                    setTimerTotal(data.total || 0);
                                    setIsTimerRunning(!!data.isRunning);
                                    if (data.isTimeUp) {
                                        setIsTimeUp(true);
                                        playTimeUpSound();
                                        showToast('🔔 ワークショップの制限時間が終了しました！');
                                    } else {
                                        setIsTimeUp(false);
                                    }
                                } else if (data.type === 'SYNC_LOCK') {
                                    setIsSubmissionsLocked(!!data.isLocked);
                                    showToast(data.isLocked ? '🔒 講師により投稿受付が一時停止されました' : '🟢 投稿受付が再開されました！');
                                } else if (data.type === 'SYNC_THEME') {
                                    if (data.themeTitle) {
                                        setSessionThemeTitle(data.themeTitle);
                                        showToast(`📌 テーマが「${data.themeTitle}」に更新されました`);
                                    }
                                } else if (data.type === 'SESSION_STARTED') {
                                    showToast(`📢 新しい板書「${data.title || '新規セッション'}」が開始されました！`);
                                    if (data.title) setSessionThemeTitle(data.title);
                                    setParticipantTab('post');
                                } else if (data.type === 'SESSION_RESTORED') {
                                    showToast(`🔄 過去の板書「${data.title}」が復元されました`);
                                    if (data.title) setSessionThemeTitle(data.title);
                                }
                            }
                        } catch (err) {
                            console.warn('Message parsing error:', err);
                        }
                    });
                } catch (e) {
                    console.warn('MQTT init notice:', e);
                }

                return () => {
                    isMounted = false;
                    if (mqttClientRef.current) {
                        try { mqttClientRef.current.end(true); } catch (_) {}
                    }
                };
            }, [appRole, activeRoomId]);

            // 受講者のハートビート送信（15秒ごと） & 講師の接続者カウントクリーンアップ
            useEffect(() => {
                const timer = setInterval(() => {
                    const topic = `bansho/room/${activeRoomId}`;
                    if (appRole === 'participant' && mqttClientRef.current && mqttClientRef.current.connected) {
                        mqttClientRef.current.publish(topic, JSON.stringify({
                            type: 'HEARTBEAT',
                            senderId: myClientId,
                            author: participantName || '受講者'
                        }));
                    } else if (appRole === 'board') {
                        // 45秒以上アクセスのない受講生を切断と判定
                        const now = Date.now();
                        let changed = false;
                        activeClientsRef.current.forEach((lastSeen, cId) => {
                            if (now - lastSeen > 45000) {
                                activeClientsRef.current.delete(cId);
                                changed = true;
                            }
                        });
                        if (changed) setConnectedCount(activeClientsRef.current.size);
                    }
                }, 15000);
                return () => clearInterval(timer);
            }, [appRole, activeRoomId, participantName]);

            // リアルタイム送信ヘルパー（参加者・講師共通）
            const sendP2pMessage = (payload, onComplete) => {
                const topic = `bansho/room/${activeRoomId}`;
                if (mqttClientRef.current && mqttClientRef.current.connected) {
                    try {
                        mqttClientRef.current.publish(topic, JSON.stringify({
                            ...payload,
                            senderId: myClientId
                        }));
                    } catch (e) {
                        console.warn('Send error:', e);
                    }
                }
                if (onComplete) onComplete();
            };

            // LocalStorage Auto-Save
            useEffect(() => {
                localStorage.setItem('bansho_categories', JSON.stringify(categories));
            }, [categories]);

            useEffect(() => {
                localStorage.setItem('bansho_cards', JSON.stringify(cards));
                if (appRole === 'board') {
                    broadcastToClients({ 
                        type: 'SYNC_CARDS', 
                        cards, 
                        themeTitle: sessionThemeTitleRef.current 
                    });
                }
            }, [cards, appRole]);

            useEffect(() => {
                localStorage.setItem('bansho_my_history', JSON.stringify(myHistory));
            }, [myHistory]);

            useEffect(() => {
                localStorage.setItem('bansho_my_votes', JSON.stringify(myVotes));
            }, [myVotes]);

            useEffect(() => {
                localStorage.setItem('bansho_my_name', participantName);
            }, [participantName]);

            // いいね投票切り替え（参加者側）
            const handleToggleVote = (cardId) => {
                const hasVoted = !!myVotes[cardId];
                const delta = hasVoted ? -1 : 1;

                // 自分の投票状態を更新
                const updatedVotes = { ...myVotes };
                if (hasVoted) {
                    delete updatedVotes[cardId];
                    showToast('いいねを取り消しました');
                } else {
                    updatedVotes[cardId] = true;
                    showToast('👍 いいねしました！');
                }
                setMyVotes(updatedVotes);

                // 手元のカード表示も即時反映
                setCards(prev => prev.map(c => c.id === cardId ? { ...c, votes: Math.max(0, (c.votes || 0) + delta) } : c));

                // 講師ボードへシグナル送信（P2P）
                sendP2pMessage({ type: 'VOTE_CARD', cardId, delta });
            };

            // LocalStorage Auto-Save
            useEffect(() => {
                localStorage.setItem('bansho_categories', JSON.stringify(categories));
            }, [categories]);

            useEffect(() => {
                localStorage.setItem('bansho_cards', JSON.stringify(cards));
                if (appRole === 'board') {
                    broadcastToClients({ type: 'SYNC_CARDS', cards });
                }
            }, [cards, appRole]);

            useEffect(() => {
                localStorage.setItem('bansho_archives', JSON.stringify(archives));
            }, [archives]);

            useEffect(() => {
                localStorage.setItem('bansho_session_title', sessionThemeTitle);
            }, [sessionThemeTitle]);

            useEffect(() => {
                localStorage.setItem('bansho_my_history', JSON.stringify(myHistory));
            }, [myHistory]);

            useEffect(() => {
                localStorage.setItem('bansho_my_votes', JSON.stringify(myVotes));
            }, [myVotes]);

            useEffect(() => {
                localStorage.setItem('bansho_my_name', participantName);
            }, [participantName]);

            // テーマタイトルの保存 & P2P配信
            const handleSaveThemeTitle = (newTitle) => {
                const title = newTitle.trim() || 'ワークショップ・意見整理';
                setSessionThemeTitle(title);
                localStorage.setItem('bansho_session_title', title);
                setIsEditingThemeTitle(false);
                if (appRole === 'board') {
                    broadcastToClients({ type: 'SYNC_THEME', themeTitle: title });
                }
                showToast(`📌 テーマを「${title}」に変更しました`);
            };

            // 💾 現在の作業中板書の保存モーダルを開く（付箋0件でもOK）
            const handleOpenSaveSnapshotModal = () => {
                setSaveSnapshotTitle(sessionThemeTitle || 'ワークショップ・意見整理');
                setShowSaveSnapshotModal(true);
            };

            // 💾 アーカイブ保存の確定実行（付箋0件でも確実に保存）
            const handleConfirmSaveSnapshot = () => {
                const now = new Date();
                const timeStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                const finalTitle = saveSnapshotTitle.trim() || sessionThemeTitle.trim() || `${timeStr} セッション`;

                const newArchive = {
                    id: 'arch-' + Date.now(),
                    title: finalTitle,
                    savedAt: timeStr,
                    cards: [...cards],
                    categories: [...categories],
                    summaries: { ...summaries },
                    cardCount: cards.length,
                    totalVotes: cards.reduce((sum, c) => sum + (c.votes || 0), 0)
                };

                setArchives(prev => [newArchive, ...prev]);
                setShowSaveSnapshotModal(false);
                showToast(`💾「${finalTitle}」を過去の記録に保存しました！（付箋 ${cards.length} 件）`);
            };

            // 新規板書モーダルを開く
            const handleOpenNewBoardModal = () => {
                const now = new Date();
                const defaultTitle = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} セッション`;
                setNewSessionTitle(sessionThemeTitle || defaultTitle);
                setShowNewBoardModal(true);
            };

            // 現在の板書をアーカイブ保存して新規開始
            const handleSaveArchiveAndStartNew = () => {
                const now = new Date();
                const timeStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                const finalTitle = newSessionTitle.trim() || `${timeStr} セッション`;
                
                const newArchive = {
                    id: 'arch-' + Date.now(),
                    title: finalTitle,
                    savedAt: timeStr,
                    cards: [...cards],
                    categories: [...categories],
                    summaries: { ...summaries },
                    cardCount: cards.length,
                    totalVotes: cards.reduce((sum, c) => sum + (c.votes || 0), 0)
                };

                setArchives(prev => [newArchive, ...prev]);
                setCards([]);
                setSummaries({});
                setCategories(INITIAL_CATEGORIES);
                setSessionThemeTitle(finalTitle);
                setShowNewBoardModal(false);
                broadcastToClients({ type: 'SESSION_STARTED', title: finalTitle });
                showToast(`📁「${finalTitle}」をアーカイブに記録し、新しい板書を開始しました！`);
            };

            // 保存せずに真っ新な板書を開始
            const handleStartNewWithoutSaving = () => {
                setCards([]);
                setSummaries({});
                setCategories(INITIAL_CATEGORIES);
                setShowNewBoardModal(false);
                broadcastToClients({ type: 'SESSION_STARTED', title: '新しいセッション' });
                showToast('新しい板書を開始しました（未分類・意見0件）');
            };

            // アーカイブを現在のボードに復元
            const handleRestoreArchive = (archive) => {
                if (cards.length > 0 && !confirm(`現在の作業中の板書は上書きされます。\n「${archive.title}」を復元しますか？`)) {
                    return;
                }
                const restoredTitle = archive.title || 'ワークショップ・意見整理';
                const restoredCards = archive.cards || [];
                const restoredCategories = archive.categories || INITIAL_CATEGORIES;
                const restoredSummaries = archive.summaries || {};

                setCards(restoredCards);
                setCategories(restoredCategories);
                setSummaries(restoredSummaries);
                setSessionThemeTitle(restoredTitle);
                setTempThemeTitle(restoredTitle);

                localStorage.setItem('bansho_session_title', restoredTitle);
                localStorage.setItem('bansho_cards', JSON.stringify(restoredCards));
                localStorage.setItem('bansho_categories', JSON.stringify(restoredCategories));

                setShowArchiveModal(false);
                broadcastToClients({ type: 'SYNC_THEME', themeTitle: restoredTitle });
                broadcastToClients({ type: 'SYNC_CARDS', cards: restoredCards, themeTitle: restoredTitle });
                broadcastToClients({ type: 'SESSION_RESTORED', title: restoredTitle });
                showToast(`🔄「${restoredTitle}」の板書を復元しました！`);
            };

            // アーカイブを削除
            const handleDeleteArchive = (archiveId) => {
                if (!confirm('この過去の板書ログを削除しますか？')) return;
                setArchives(prev => prev.filter(a => a.id !== archiveId));
                showToast('アーカイブを削除しました');
            };

            // 📥 バックアップをJSONファイルとして保存（エクスポート）
            const handleExportBackupJson = () => {
                const now = new Date();
                const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
                const backupPayload = {
                    appName: 'bansho-app',
                    version: APP_VERSION,
                    exportedAt: now.toLocaleString('ja-JP'),
                    archives: archives,
                    currentBoard: {
                        cards: cards,
                        categories: categories,
                        summaries: summaries
                    }
                };

                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupPayload, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `bansho_backup_${dateStr}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast('📥 バックアップJSONファイルを保存しました！');
            };

            // 📤 バックアップJSONファイルを読み込み（インポート）
            const handleImportBackupJson = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (!imported || (!Array.isArray(imported.archives) && !imported.currentBoard)) {
                            throw new Error('バックアップJSONファイルの形式が正しくありません');
                        }

                        let importCount = 0;
                        if (Array.isArray(imported.archives) && imported.archives.length > 0) {
                            setArchives(prev => {
                                const existingIds = new Set(prev.map(a => a.id));
                                const newItems = imported.archives.filter(a => !existingIds.has(a.id));
                                importCount = newItems.length;
                                return [...newItems, ...prev];
                            });
                        }

                        if (imported.currentBoard && imported.currentBoard.cards && imported.currentBoard.cards.length > 0) {
                            if (confirm(`ファイルに含まれる現在の板書（${imported.currentBoard.cards.length}件）も画面に反映しますか？`)) {
                                setCards(imported.currentBoard.cards || []);
                                setCategories(imported.currentBoard.categories || INITIAL_CATEGORIES);
                                setSummaries(imported.currentBoard.summaries || {});
                            }
                        }

                        showToast(`📤 ${importCount}件の過去アーカイブを読み込みました！`);
                    } catch (err) {
                        alert('ファイル読み込みエラー: ' + err.message);
                    } finally {
                        e.target.value = '';
                    }
                };
                reader.readAsText(file);
            };

            // アーカイブ用のMarkdown生成
            const generateArchiveMarkdown = (arch) => {
                let md = `# 板書レポート: ${arch.title}\n\n`;
                md += `- **記録日時:** ${arch.savedAt}\n`;
                md += `- **総意見数:** ${arch.cards ? arch.cards.length : 0}件\n`;
                md += `- **総いいね数:** ${arch.totalVotes || 0}\n\n`;

                const archCats = arch.categories || INITIAL_CATEGORIES;
                const archCards = arch.cards || [];
                const archSummaries = arch.summaries || {};

                const uncategorized = archCards.filter(c => c.categoryId === null);
                if (uncategorized.length > 0) {
                    md += `## 📥 未分類 (${uncategorized.length}件)\n\n`;
                    uncategorized.forEach(c => {
                        md += `- ${c.text} (by ${c.author || '匿名'}, 👍 ${c.votes || 0})\n`;
                    });
                    md += `\n`;
                }

                archCats.forEach(cat => {
                    const catCards = archCards.filter(c => c.categoryId === cat.id);
                    md += `## ${cat.title} (${catCards.length}件)\n\n`;
                    if (archSummaries[cat.id]) {
                        md += `> 💡 **AI要約:** ${archSummaries[cat.id]}\n\n`;
                    }
                    if (catCards.length === 0) {
                        md += `*(意見なし)*\n\n`;
                    } else {
                        catCards.forEach(c => {
                            md += `- ${c.text} (by ${c.author || '匿名'}, 👍 ${c.votes || 0})\n`;
                        });
                        md += `\n`;
                    }
                });
                return md;
            };

            const handleResetData = () => {
                setCategories(INITIAL_CATEGORIES);
                setCards(INITIAL_CARDS);
                setSummaries({});
                localStorage.removeItem('bansho_categories');
                localStorage.removeItem('bansho_cards');
                showToast('データを初期サンプルに戻しました');
            };

            const handleAddCard = (e) => {
                if (e) e.preventDefault();
                if (!inputText.trim()) return;

                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

                const cardAuthor = appRole === 'board' ? (facilitatorName.trim() || '講師') : (participantName.trim() || '受講者');
                const cardLevel = appRole === 'board' ? inputLevel : 0;

                const newCard = {
                    id: 'c-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                    text: inputText.trim(),
                    color: selectedColor,
                    categoryId: null,
                    votes: 0,
                    author: cardAuthor,
                    level: cardLevel,
                    createdAt: timeStr
                };

                // P2P送信（確実送信ヘルパー利用）
                sendP2pMessage({ type: 'NEW_CARD', card: newCard });

                setCards(prev => [newCard, ...prev]);
                setMyHistory(prev => [newCard, ...prev]);

                setInputText('');
                showToast('意見を送信しました！未分類へ追加されました。');
            };

            const handleSendParticipantCard = (e) => {
                handleAddCard(e);
            };

            // 送信取り消し（講師ボードからも連動削除）
            const handleCancelSend = (item) => {
                const preview = item.text.length > 15 ? item.text.substring(0, 15) + '...' : item.text;
                if (!confirm(`「${preview}」の送信を取り消しますか？\n（講師ボードの付箋も自動削除されます）`)) {
                    return;
                }

                // P2Pで講師画面へ削除通知
                sendP2pMessage({ 
                    type: 'DELETE_CARD', 
                    cardId: item.id, 
                    author: item.author || participantName || '受講者' 
                });

                // 参加者の手元カード & 履歴から削除
                setCards(prev => prev.filter(c => c.id !== item.id));
                setMyHistory(prev => prev.filter(h => h.id !== item.id));
                showToast('意見の送信を取り消しました（ボードからも削除）');
            };

            // 履歴全クリア（手元の履歴表示消去）
            const handleClearHistory = () => {
                if (confirm('投稿履歴ログをすべて消去しますか？\n（※既に送信されたボード上の付箋はそのまま残ります）')) {
                    setMyHistory([]);
                    showToast('投稿履歴をクリアしました');
                }
            };

            // 履歴から再利用
            const handleReuseHistory = (item) => {
                setInputText(item.text);
                setSelectedColor(item.color);
                showToast('履歴からテキストをセットしました');
            };

            const handleBulkAdd = () => {
                if (!bulkInputText.trim()) return;
                const lines = bulkInputText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const newCards = lines.map((line, idx) => ({
                    id: 'c-' + (Date.now() + idx),
                    text: line,
                    color: selectedColor,
                    categoryId: null,
                    votes: 0,
                    author: '一括投入'
                }));
                setCards(prev => [...newCards, ...prev]);
                setBulkInputText('');
                setShowBulkModal(false);
                showToast(`${newCards.length}件の意見を一括生成しました！`);
            };

            const handleDragStart = (e, cardId) => {
                setDraggedCardId(cardId);
                e.dataTransfer.setData('text/plain', cardId);
            };

            // カードの上へのドロップ（そのカードの直前に挿入・並び替え）
            const handleCardDrop = (e, targetCardId, targetCategoryId) => {
                e.preventDefault();
                e.stopPropagation();
                if (!draggedCardId || draggedCardId === targetCardId) return;

                setCards(prevCards => {
                    const nextCards = [...prevCards];
                    const draggedIndex = nextCards.findIndex(c => c.id === draggedCardId);
                    if (draggedIndex === -1) return prevCards;

                    const [draggedCard] = nextCards.splice(draggedIndex, 1);
                    const updatedCard = { ...draggedCard, categoryId: targetCategoryId };

                    const targetIndex = nextCards.findIndex(c => c.id === targetCardId);
                    if (targetIndex !== -1) {
                        nextCards.splice(targetIndex, 0, updatedCard);
                    } else {
                        nextCards.push(updatedCard);
                    }
                    return nextCards;
                });
                setDraggedCardId(null);
            };

            // グループ枠の空きスペースにドロップした時の移動
            const handleDrop = (e, targetCategoryId) => {
                e.preventDefault();
                if (!draggedCardId) return;
                setCards(prevCards => {
                    const nextCards = [...prevCards];
                    const draggedIndex = nextCards.findIndex(c => c.id === draggedCardId);
                    if (draggedIndex === -1) return prevCards;

                    const [draggedCard] = nextCards.splice(draggedIndex, 1);
                    const updatedCard = { ...draggedCard, categoryId: targetCategoryId };
                    nextCards.push(updatedCard);
                    return nextCards;
                });
                setDraggedCardId(null);
            };

            // グループ内カードの並び替えソート（いいね順 / 班番号順 / 反転）
            const handleSortCategoryCards = (catId, sortType) => {
                setCards(prevCards => {
                    const targetCards = prevCards.filter(c => c.categoryId === catId);
                    if (targetCards.length <= 1) return prevCards;

                    let sorted = [...targetCards];
                    if (sortType === 'votes') {
                        sorted.sort((a, b) => (b.votes || 0) - (a.votes || 0));
                        showToast('👍 いいねが多い順に整列しました');
                    } else if (sortType === 'team') {
                        const getColorIndex = (c) => {
                            const idx = COLOR_PALETTE.findIndex(p => p.id === c.color);
                            return idx !== -1 ? idx : 999;
                        };
                        sorted.sort((a, b) => getColorIndex(a) - getColorIndex(b));
                        showToast('🔢 班番号順（①〜⑧）に整列しました');
                    } else if (sortType === 'reverse') {
                        sorted.reverse();
                        showToast('🔄 並び順を上下反転しました');
                    }

                    const result = [];
                    let sortedIdx = 0;
                    prevCards.forEach(c => {
                        if (c.categoryId === catId) {
                            result.push(sorted[sortedIdx++]);
                        } else {
                            result.push(c);
                        }
                    });
                    return result;
                });
            };

            const handleDragOver = (e) => e.preventDefault();

            const handleVote = (cardId) => {
                setCards(cards.map(c => c.id === cardId ? { ...c, votes: c.votes + 1 } : c));
            };

            // 🏷️ 付箋の階層（level: 0=親・大項目, 1=中項目, 2=小項目）を変更
            const handleChangeCardLevel = (cardId, delta) => {
                setCards(prevCards => {
                    const nextCards = prevCards.map(c => {
                        if (c.id === cardId) {
                            const currentLevel = c.level || 0;
                            const newLevel = Math.max(0, Math.min(2, currentLevel + delta));
                            return { ...c, level: newLevel };
                        }
                        return c;
                    });
                    broadcastToClients({ type: 'SYNC_CARDS', cards: nextCards, themeTitle: sessionThemeTitleRef.current });
                    return nextCards;
                });
            };

            // 🎨 付箋のカラーを変更（中項目・小項目の色分け対応）
            const handleChangeCardColor = (cardId, newColor) => {
                setCards(prevCards => {
                    const nextCards = prevCards.map(c => c.id === cardId ? { ...c, color: newColor } : c);
                    broadcastToClients({ type: 'SYNC_CARDS', cards: nextCards, themeTitle: sessionThemeTitleRef.current });
                    return nextCards;
                });
            };

            const handleDeleteCard = (cardId) => {
                setCards(cards.filter(c => c.id !== cardId));
            };

            const handleUpdateCardText = (cardId, newText) => {
                setCards(cards.map(c => c.id === cardId ? { ...c, text: newText } : c));
                showToast('付箋を更新しました');
            };

            const handleAddCategory = () => {
                if (!newCategoryTitle.trim()) return;
                const colors = ['bg-indigo-500', 'bg-teal-500', 'bg-orange-500', 'bg-purple-500', 'bg-cyan-500'];
                const randomColor = colors[categories.length % colors.length];
                const newCat = {
                    id: 'cat-' + Date.now(),
                    title: newCategoryTitle.trim(),
                    color: randomColor
                };
                setCategories([...categories, newCat]);
                setNewCategoryTitle('');
                setIsAddingCategory(false);
                showToast(`グループ「${newCat.title}」を作成しました`);
            };

            const handleDeleteCategory = (catId) => {
                setCategories(categories.filter(c => c.id !== catId));
                setCards(cards.map(c => c.categoryId === catId ? { ...c, categoryId: null } : c));
                showToast('グループを削除しました');
            };

            const handleUpdateCategoryTitle = (catId, newTitle) => {
                setCategories(categories.map(c => c.id === catId ? { ...c, title: newTitle } : c));
                showToast('グループ名を変更しました');
            };

            // APIキー保存
            const handleSaveApiKey = () => {
                const key = configInputKey.trim();
                setGeminiApiKey(key);
                localStorage.setItem('bansho_gemini_api_key', key);
                setShowConfigModal(false);
                showToast(key ? 'Gemini APIキーを保存しました' : 'APIキーをクリアしました');
            };

            // APIキー削除
            const handleDeleteApiKey = () => {
                setGeminiApiKey('');
                setConfigInputKey('');
                localStorage.removeItem('bansho_gemini_api_key');
                showToast('APIキーを削除しました');
            };

            // Gemini API 呼び出しヘルパー（動的モデル検出 ＋ 優先候補フォールバック）
            const callGeminiApi = async (key, bodyPayload) => {
                let candidateModels = [
                    'gemini-3.6-flash-lite',
                    'gemini-3.6-flash',
                    'gemini-2.5-flash-lite',
                    'gemini-2.5-flash',
                    'gemini-2.0-flash',
                    'gemini-2.0-flash-lite',
                    'gemini-1.5-flash',
                    'gemini-1.5-flash-8b',
                    'gemini-1.5-pro'
                ];

                // 可能であればAPIキーに紐づく有効なモデル一覧をGoogleから直接取得して最優先化
                try {
                    const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                    if (listRes.ok) {
                        const listData = await listRes.json();
                        if (listData.models && Array.isArray(listData.models)) {
                            const availableModels = listData.models
                                .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
                                .map(m => m.name.replace('models/', ''));
                            
                            // flash系・lite系を優先してソート
                            const sorted = availableModels.sort((a, b) => {
                                const score = (name) => {
                                    if (name.includes('flash-lite')) return 10;
                                    if (name.includes('flash')) return 8;
                                    if (name.includes('gemini')) return 5;
                                    return 1;
                                };
                                return score(b) - score(a);
                            });

                            if (sorted.length > 0) {
                                candidateModels = [...new Set([...sorted, ...candidateModels])];
                            }
                        }
                    }
                } catch (e) {
                    console.log('Dynamic model list notice:', e);
                }

                let lastError = null;
                for (const model of candidateModels) {
                    try {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
                        const res = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(bodyPayload)
                        });
                        if (res.ok) {
                            const resData = await res.json();
                            return { resData, model };
                        }
                        const err = await res.json().catch(() => ({}));
                        lastError = new Error(err.error?.message || `HTTP ${res.status} (${model})`);
                    } catch (e) {
                        lastError = e;
                    }
                }
                throw lastError || new Error('利用可能なGeminiモデルが見つかりませんでした');
            };

            // APIキーテスト接続
            const handleTestApiKey = async () => {
                const key = configInputKey.trim() || geminiApiKey;
                if (!key) {
                    showToast('APIキーを入力してください');
                    return;
                }
                setIsTestingKey(true);
                try {
                    const { model } = await callGeminiApi(key, {
                        contents: [{ parts: [{ text: 'ping' }] }]
                    });
                    showToast(`✅ Gemini (${model}) への接続テストに成功しました！`);
                } catch (e) {
                    alert('接続エラー: ' + e.message);
                } finally {
                    setIsTestingKey(false);
                }
            };

            // ✨ Gemini 本格AIクラスタリング
            const handleAiCluster = async () => {
                if (cards.length === 0) {
                    showToast('分類対象の意見がありません！');
                    return;
                }

                if (!geminiApiKey) {
                    // APIキーがない場合は設定モーダルを開く
                    setConfigInputKey('');
                    setShowConfigModal(true);
                    showToast('⚙️ Gemini APIキーを設定すると、完全自動AI整理が有効になります');
                    return;
                }

                setIsAiProcessing(true);

                const palette = [
                    'bg-amber-500', 'bg-indigo-500', 'bg-rose-500', 
                    'bg-emerald-500', 'bg-sky-500', 'bg-purple-500', 'bg-teal-500'
                ];

                const prompt = `あなたは研修・ワークショップの板書・意見整理ファシリテーターAIです。
以下の受講者から出された意見（付箋カード）の一覧を分析し、意見の文脈・類似性に基づいて最適な3〜5個のグループ（カテゴリ）に分類してください。

【出力要件】
1. グループ名（title）は意見の内容に最も適した分かりやすい日本語とし、先頭に適切な絵文字を1つ付けてください（例: "💡 UI・操作性の改善要望", "⚠️ 承認フローの課題", "🚀 今後の活用アイデア"）。
2. 各グループごとに、そのグループの意見の共通点・重要ポイント・ネクストアクションを的確にまとめた2〜3行の要約文（summary）を作成してください。
3. 全てのカードを必ずいずれかのグループに割り当ててください。

【入力カード一覧】
${cards.map(c => `- ID: "${c.id}", 意見: "${c.text}", 投稿者: "${c.author || '匿名'}"`).join('\n')}

【出力JSONフォーマット】
{
  "categories": [
    {
      "id": "cat-1",
      "title": "💡 グループ名",
      "summary": "要約文"
    }
  ],
  "cardAssignments": [
    {
      "cardId": "c-xxx",
      "categoryId": "cat-1"
    }
  ]
}`;

                try {
                    const { resData, model } = await callGeminiApi(geminiApiKey, {
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            temperature: 0.2
                        }
                    });

                    const rawJson = resData.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!rawJson) throw new Error('AIからの応答が空でした');

                    const parsed = JSON.parse(rawJson);

                    // 新しいカテゴリ一覧の構築
                    const newCategories = (parsed.categories || []).map((cat, idx) => ({
                        id: cat.id || `cat-ai-${idx+1}`,
                        title: cat.title || `グループ ${idx+1}`,
                        color: palette[idx % palette.length]
                    }));

                    // AI要約マップ
                    const newSummaries = {};
                    (parsed.categories || []).forEach((cat, idx) => {
                        const cid = cat.id || `cat-ai-${idx+1}`;
                        if (cat.summary) newSummaries[cid] = cat.summary;
                    });

                    // 各カードのカテゴリ割り当て
                    const assignmentMap = {};
                    (parsed.cardAssignments || []).forEach(a => {
                        assignmentMap[a.cardId] = a.categoryId;
                    });

                    const updatedCards = cards.map(c => ({
                        ...c,
                        categoryId: assignmentMap[c.id] || (newCategories[0] ? newCategories[0].id : null)
                    }));

                    setCategories(newCategories.length > 0 ? newCategories : INITIAL_CATEGORIES);
                    setSummaries(newSummaries);
                    setCards(updatedCards);
                    showToast(`✨ Gemini (${model}) により ${newCategories.length} 個のグループに自動分類・要約しました！`);
                } catch (e) {
                    console.error('Gemini error:', e);
                    alert('AI整理中にエラーが発生しました:\n' + e.message);
                } finally {
                    setIsAiProcessing(false);
                }
            };

            const generateMarkdown = () => {
                let md = `# 📋 板書レポート: ${sessionThemeTitle}\n\n日時: ${new Date().toLocaleDateString('ja-JP')}\n\n`;
                categories.forEach(cat => {
                    const catCards = cards.filter(c => c.categoryId === cat.id);
                    md += `## ${cat.title}\n`;
                    if (summaries[cat.id]) {
                        md += `> 💡 **AI要約:** ${summaries[cat.id]}\n\n`;
                    }
                    if (catCards.length === 0) {
                        md += `*(意見なし)*\n\n`;
                    } else {
                        catCards.forEach(c => {
                            const level = c.level || 0;
                            const prefix = level === 2 ? '    - ↳↳ ' : (level === 1 ? '  - ↳ ' : '- ');
                            md += `${prefix}${c.text} (by ${c.author || '匿名'}, 👍 ${c.votes || 0})\n`;
                        });
                        md += `\n`;
                    }
                });
                return md;
            };

            // 参加者用URL生成
            const participantUrl = `${window.location.origin}${window.location.pathname}?role=participant&room=${activeRoomId}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(participantUrl)}`;
            const uncategorizedCards = cards.filter(c => c.categoryId === null);

            return (
                <div className="h-full flex flex-col relative">
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="absolute top-4 right-4 z-50 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl border border-slate-700 flex items-center gap-2">
                            <i className="fa-solid fa-circle-check text-emerald-400"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Header (整理された1段統合・中央特大テーマ & 役割別ボタングループ) */}
                    <header className={`bg-slate-950 text-white shadow-xl z-20 shrink-0 ${isParticipantOnly ? 'px-3.5 py-2' : 'px-5 py-2.5'} flex items-center justify-between border-b border-slate-800 gap-3`}>
                        
                        {/* ⬅ 左側：ロゴ & アプリ名（3段構え: 講師PC / 一般PC / スマホ） */}
                        <div className="flex items-center space-x-2.5 shrink-0">
                            <div className={`bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold shadow-inner ${isParticipantOnly && isMobile ? 'w-7 h-7 text-sm' : 'w-9 h-9 text-base sm:text-lg'}`}>
                                <i className={isParticipantOnly ? (isMobile ? "fa-solid fa-mobile-screen" : "fa-solid fa-laptop") : "fa-solid fa-chalkboard-user"}></i>
                            </div>
                            <div>
                                <h1 className={`${isParticipantOnly && isMobile ? 'text-xs' : 'text-sm'} font-bold tracking-wide flex items-center gap-1.5 leading-tight`}>
                                    {isParticipantOnly ? (isMobile ? "受講者ポータル" : "受講者ボード") : "講師進行ボード"}
                                    <span className="text-[9px] bg-indigo-600/90 text-white px-1.5 py-0.2 rounded font-mono font-bold">{APP_VERSION}</span>
                                </h1>
                                <p className="text-[10px] text-slate-400 hidden sm:block">
                                    {isParticipantOnly 
                                        ? (isMobile ? "手元のスマホで意見投稿・スライド確認" : "大画面でスライド閲覧＆リアルタイム意見投稿")
                                        : "リアルタイム意見収集 ➔ スライド投影 ➔ AI一元整理"}
                                </p>
                            </div>
                        </div>

                        {/* 🎯 中央：本日のテーマ（大画面の主役・中央特大フォント・インライン編集） */}
                        {appRole === 'board' && !isParticipantOnly ? (
                            <div className="flex-1 flex items-center justify-center max-w-2xl mx-2">
                                {isEditingThemeTitle ? (
                                    <div className="flex items-center gap-2 w-full">
                                        <input 
                                            type="text"
                                            value={tempThemeTitle}
                                            onChange={(e) => setTempThemeTitle(e.target.value)}
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter') handleSaveThemeTitle(tempThemeTitle);
                                                if (e.key === 'Escape') setIsEditingThemeTitle(false);
                                            }}
                                            autoFocus
                                            placeholder="例: 2026年度 新人研修 振り返りワーク"
                                            className="bg-slate-900 text-white text-sm sm:text-base lg:text-lg font-bold border-2 border-indigo-400 rounded-xl px-3 py-1 flex-1 focus:outline-none focus:ring-2 focus:ring-indigo-400 shadow-inner"
                                        />
                                        <button 
                                            onClick={() => handleSaveThemeTitle(tempThemeTitle)}
                                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1 shadow shrink-0">
                                            <i className="fa-solid fa-check"></i> 保存
                                        </button>
                                        <button 
                                            onClick={() => setIsEditingThemeTitle(false)}
                                            className="text-slate-400 hover:text-white px-2 py-1 text-xs transition shrink-0">
                                            取消
                                        </button>
                                    </div>
                                ) : (
                                    <div 
                                        onClick={() => {
                                            setTempThemeTitle(sessionThemeTitle);
                                            setIsEditingThemeTitle(true);
                                        }}
                                        title="クリックしてテーマタイトルを編集"
                                        className="group flex items-center gap-2 cursor-pointer bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 hover:border-indigo-500/50 px-4 py-1 rounded-2xl transition shadow-inner max-w-full">
                                        <span className="bg-amber-400 text-slate-950 font-black text-[10px] sm:text-xs px-2 py-0.5 rounded-md shrink-0 shadow-2xs">
                                            🎯 テーマ
                                        </span>
                                        <h2 className="text-sm sm:text-base md:text-lg lg:text-xl font-black text-white group-hover:text-indigo-200 transition tracking-wide truncate">
                                            {sessionThemeTitle}
                                        </h2>
                                        <i className="fa-solid fa-pen text-[10px] text-slate-500 opacity-0 group-hover:opacity-100 group-hover:text-indigo-300 transition shrink-0"></i>
                                    </div>
                                )}
                            </div>
                        ) : null}

                        {/* ➡ 右側：機能別にグループ化されたボタン群 */}
                        <div className="flex items-center space-x-2 shrink-0">
                            {/* 参加者専用URLアクセス時 */}
                            {isParticipantOnly ? (
                                <button 
                                    onClick={() => connectToHost()}
                                    title={peerConnected ? "講師ボードとP2P接続中" : "タップして再接続を試行"}
                                    className={`flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-lg border transition font-medium cursor-pointer active:scale-95 ${peerConnected ? 'bg-emerald-950/80 text-emerald-300 border-emerald-700/60' : 'bg-amber-950/90 text-amber-300 border-amber-600/70 hover:bg-amber-900'}`}>
                                    <span className={`w-2 h-2 rounded-full ${peerConnected ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                                    <span>{peerConnected ? 'ボード接続中' : '待機中 (タップ再接続)'}</span>
                                </button>
                            ) : (
                                <>
                                    {/* 👥 講師用：受講者のリアルタイム接続状況 */}
                                    <div 
                                        onClick={() => setShowQrModal(true)}
                                        title={`現在 ${connectedCount} 台の受講者スマホとP2P接続中（クリックでQRコード表示）`}
                                        className="flex items-center gap-1.5 bg-slate-900 px-2.5 py-1.5 rounded-xl border border-slate-800 text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition cursor-pointer">
                                        <span className={`w-2 h-2 rounded-full ${connectedCount > 0 ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'}`}></span>
                                        <span className="text-[11px]">{connectedCount > 0 ? `👥 受講者 ${connectedCount}台 接続` : '👥 受講者 待機中'}</span>
                                    </div>
                                    {/* 0. ⏱️ 研修進行グループ（タイマー & 投稿受付ロック） */}
                                    <div className="flex items-center gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800">
                                        {/* タイマー表示 & コントロール */}
                                        <div className="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800">
                                            {timerSeconds > 0 || isTimeUp ? (
                                                <div className="flex items-center gap-1.5">
                                                    <span className={`font-mono font-black text-xs sm:text-sm px-1.5 py-0.2 rounded flex items-center gap-1 ${isTimeUp ? 'bg-rose-600 text-white animate-bounce' : (timerSeconds <= 30 ? 'bg-amber-500 text-slate-950 animate-pulse' : 'bg-indigo-900/80 text-indigo-200')}`}>
                                                        <span>{isTimeUp ? '🔔 終了' : '⏱️'}</span>
