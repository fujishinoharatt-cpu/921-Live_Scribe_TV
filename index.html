                                                        <span>{formatTime(timerSeconds)}</span>
                                                    </span>
                                                    <button
                                                        onClick={handleToggleTimer}
                                                        title={isTimerRunning ? "一時停止" : "再開"}
                                                        className="text-slate-300 hover:text-white p-0.5 text-xs transition cursor-pointer">
                                                        <i className={`fa-solid ${isTimerRunning ? 'fa-pause' : 'fa-play'}`}></i>
                                                    </button>
                                                    <button
                                                        onClick={handleResetTimer}
                                                        title="タイマーをリセット"
                                                        className="text-slate-400 hover:text-rose-400 p-0.5 text-xs transition cursor-pointer">
                                                        <i className="fa-solid fa-xmark"></i>
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="flex items-center gap-0.5">
                                                    <span className="text-[10px] text-slate-400 font-bold mr-0.5">⏱️</span>
                                                    <button onClick={() => handleStartTimer(1)} className="px-1.5 py-0.5 hover:bg-slate-800 rounded text-[10px] font-bold text-slate-300 hover:text-white cursor-pointer">1分</button>
                                                    <button onClick={() => handleStartTimer(3)} className="px-1.5 py-0.5 hover:bg-slate-800 rounded text-[10px] font-bold text-indigo-300 hover:text-white bg-indigo-950/60 border border-indigo-800/40 cursor-pointer">3分</button>
                                                    <button onClick={() => handleStartTimer(5)} className="px-1.5 py-0.5 hover:bg-slate-800 rounded text-[10px] font-bold text-slate-300 hover:text-white cursor-pointer">5分</button>
                                                    <button onClick={() => handleStartTimer(10)} className="px-1.5 py-0.5 hover:bg-slate-800 rounded text-[10px] font-bold text-slate-300 hover:text-white cursor-pointer">10分</button>
                                                </div>
                                            )}
                                        </div>

                                        {/* 🔒 投稿受付ロック切り替えボタン */}
                                        <button
                                            onClick={handleToggleLock}
                                            title={isSubmissionsLocked ? "クリックして投稿受付を再開" : "クリックして受講者の投稿を一時停止（解説モード）"}
                                            className={`px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 active:scale-95 shadow-sm cursor-pointer ${isSubmissionsLocked ? 'bg-amber-600 hover:bg-amber-500 text-white animate-pulse' : 'bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-600/30'}`}>
                                            <i className={`fa-solid ${isSubmissionsLocked ? 'fa-lock' : 'fa-lock-open'}`}></i>
                                            <span className="hidden sm:inline">{isSubmissionsLocked ? '受付停止中' : '受付中'}</span>
                                        </button>
                                    </div>
                                    {/* 1. 受講者・AIメイン操作グループ（鮮やかカラーで目立たせる） */}
                                    <div className="flex items-center gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800">
                                        <button 
                                            onClick={() => setShowQrModal(true)}
                                            title="参加者用QRコード・URLを表示"
                                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow flex items-center gap-1.5 transition active:scale-95">
                                            <i className="fa-solid fa-qrcode"></i>
                                            <span className="hidden sm:inline">参加者QR</span>
                                        </button>

                                        <button 
                                            onClick={handleAiCluster}
                                            disabled={isAiProcessing}
                                            title="Gemini AIで意見を自動分類・要約"
                                            className="bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow flex items-center gap-1.5 transition active:scale-95 disabled:opacity-50">
                                            <i className={`fa-solid ${isAiProcessing ? 'fa-spinner fa-spin' : 'fa-wand-magic-sparkles'} text-amber-300`}></i>
                                            <span>{isAiProcessing ? 'AI整理中...' : 'AI整理'}</span>
                                        </button>
                                    </div>

                                    {/* 2. 板書データ管理グループ */}
                                    <div className="flex items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
                                        <button 
                                            onClick={handleOpenSaveSnapshotModal}
                                            title="現在の板書を過去の記録に保存（付箋0件でもタイトル付きで保存可能）"
                                            className="bg-indigo-700 hover:bg-indigo-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold shadow flex items-center gap-1.5 transition active:scale-95">
                                            <i className="fa-solid fa-floppy-disk text-indigo-200"></i>
                                            <span className="hidden md:inline">保存</span>
                                        </button>

                                        <button 
                                            onClick={() => setShowArchiveModal(true)}
                                            title="過去の板書アーカイブ一覧を表示・復元"
                                            className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
                                            <i className="fa-solid fa-box-archive text-indigo-400"></i>
                                            <span className="hidden md:inline">記録</span>
                                            <span className="bg-indigo-600 text-white text-[10px] px-1.5 py-0.2 rounded-full font-mono font-bold">
                                                {archives.length}
                                            </span>
                                        </button>

                                        <button 
                                            onClick={handleOpenNewBoardModal}
                                            title="現在の板書を保存して新しい板書を開始"
                                            className="text-slate-400 hover:text-white hover:bg-slate-800 px-2 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">
                                            <i className="fa-solid fa-folder-plus text-amber-400"></i>
                                            <span className="hidden lg:inline">新規</span>
                                        </button>
                                    </div>

                                    {/* 3. 設定・その他補助グループ */}
                                    <div className="flex items-center gap-1">
                                        <button 
                                            onClick={() => {
                                                setSlideInputUrl(slideUrl);
                                                setShowSlideModal(true);
                                            }}
                                            title="研修スライド（Googleスライド / PDF）のURL設定"
                                            className={`border px-2 py-1.5 rounded-lg text-xs transition flex items-center gap-1 font-bold ${slideUrl ? 'bg-indigo-950 text-indigo-300 border-indigo-500/60 hover:bg-indigo-900' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-700'}`}>
                                            <i className="fa-solid fa-file-powerpoint text-indigo-400"></i>
                                            <span className="hidden xl:inline">スライド設定</span>
                                        </button>

                                        <button 
                                            onClick={() => setShowExportModal(true)}
                                            title="マークダウン/テキスト出力"
                                            className="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2 py-1.5 rounded-lg text-xs transition">
                                            <i className="fa-solid fa-file-export"></i>
                                        </button>

                                        <button 
                                            onClick={() => {
                                                setConfigInputKey(geminiApiKey);
                                                setShowConfigModal(true);
                                            }}
                                            title="Gemini APIキー設定"
                                            className={`border p-1.5 rounded-lg text-xs transition ${geminiApiKey ? 'bg-slate-800 hover:bg-slate-700 text-emerald-400 border-emerald-600/40' : 'bg-amber-950/80 hover:bg-amber-900 text-amber-300 border-amber-600/60'}`}>
                                            <i className="fa-solid fa-gear"></i>
                                        </button>

                                        <button 
                                            onClick={handleResetData}
                                            title="データを初期状態にリセット"
                                            className="bg-slate-800 hover:bg-rose-900/60 text-slate-400 hover:text-rose-200 border border-slate-700 p-1.5 rounded-lg text-xs transition">
                                            <i className="fa-solid fa-rotate-right"></i>
                                        </button>
                                    </div>
                                </>
                            )}
                        </div>
                    </header>

                    {appRole === 'participant' ? (
                        isMobile ? (
                            /* 📱 受講者スマホビュー（3タブ構成: スライド ➔ 投稿 ➔ 意見） */
                            <div className="flex-1 bg-slate-900 p-2 sm:p-4 overflow-x-hidden overflow-y-hidden flex flex-col items-center justify-start h-full min-h-0 w-full max-w-full">
                                <div className="max-w-md w-full max-w-full flex flex-col h-full min-h-0 gap-2 overflow-x-hidden">
                                    
                                    {/* ⏱️ リアルタイム同期タイマーバー */}
                                    {(timerSeconds > 0 || isTimeUp) && (
                                        <div className={`px-3 py-1.5 rounded-xl border flex items-center justify-between shadow-md shrink-0 transition-all ${isTimeUp ? 'bg-rose-900/90 border-rose-500 text-white animate-bounce' : (timerSeconds <= 30 ? 'bg-amber-900/90 border-amber-500 text-amber-200 animate-pulse' : 'bg-indigo-950/90 border-indigo-500/50 text-indigo-100')}`}>
                                            <div className="flex items-center gap-1.5 font-bold text-xs">
                                                <span className="text-sm">{isTimeUp ? '🔔' : '⏱️'}</span>
                                                <span>{isTimeUp ? '時間終了！' : (isTimerRunning ? '残りワーク時間' : 'タイマー一時停止中')}</span>
                                            </div>
                                            <span className="font-mono font-black text-sm tracking-wider bg-black/30 px-2 py-0.5 rounded-md">
                                                {formatTime(timerSeconds)}
                                            </span>
                                        </div>
                                    )}

                                    {/* 📌 現在のテーマタイトル表示バナー */}
                                    <div className="bg-gradient-to-r from-indigo-900/90 to-slate-800/90 px-3 py-1.5 rounded-xl border border-indigo-500/30 flex items-center justify-between gap-2 shadow-xs shrink-0">
                                        <div className="flex items-center gap-1.5 min-w-0">
                                            <span className="text-[10px] bg-amber-400 text-slate-900 font-bold px-1.5 py-0.2 rounded shrink-0">テーマ</span>
                                            <h2 className="text-xs font-bold text-white truncate">
                                                {sessionThemeTitle}
                                            </h2>
                                        </div>
                                        {isSubmissionsLocked && (
                                            <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded font-bold shrink-0 flex items-center gap-1">
                                                <i className="fa-solid fa-lock text-[9px]"></i> 受付停止中
                                            </span>
                                        )}
                                    </div>

                                    {/* タブ切り替えバー（3タブ構成: スライド ➔ 投稿 ➔ 意見） */}
                                    <div className="bg-slate-800 p-1 rounded-xl border border-slate-700 flex items-center gap-1 shrink-0 shadow-md">
                                        <button 
                                            onClick={() => setParticipantTab('slide')}
                                            className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1 ${participantTab === 'slide' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                            <i className="fa-solid fa-file-powerpoint text-indigo-300"></i> スライド
                                            {slideUrl && (
                                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                            )}
                                        </button>
                                        <button 
                                            onClick={() => setParticipantTab('post')}
                                            className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1 ${participantTab === 'post' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                            <i className="fa-solid fa-pen-to-square"></i> 投稿
                                        </button>
                                        <button 
                                            onClick={() => setParticipantTab('timeline')}
                                            className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1 ${participantTab === 'timeline' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                            <i className="fa-solid fa-comments"></i> 意見
                                            <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-mono font-bold ${participantTab === 'timeline' ? 'bg-white text-indigo-700' : 'bg-slate-700 text-slate-300'}`}>
                                                {cards.length}
                                            </span>
                                        </button>
                                    </div>

                                    {participantTab === 'post' ? (
                                        /* 📝 投稿・履歴タブ */
                                        <div className="flex flex-col flex-1 min-h-0 gap-2">
                                            {/* 📜 あなたの投稿履歴 */}
                                            <div className="bg-slate-800/95 rounded-2xl p-2.5 border border-slate-700 shadow-xl backdrop-blur-sm flex-1 min-h-0 flex flex-col overflow-hidden">
                                                <div className="flex items-center justify-between mb-1.5 pb-1 border-b border-slate-700/80 shrink-0">
                                                    <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                                                        <i className="fa-solid fa-clock-rotate-left text-amber-400 text-[11px]"></i>
                                                        あなたの投稿履歴
                                                        <span className="bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 text-[10px] px-1.5 py-0.2 rounded-full font-mono">
                                                            {myHistory.length} 件
                                                        </span>
                                                    </h3>
                                                    {myHistory.length > 0 && (
                                                        <button 
                                                            onClick={handleClearHistory}
                                                            className="text-[10px] text-slate-400 hover:text-rose-400 transition flex items-center gap-1">
                                                            <i className="fa-solid fa-trash-can text-[9px]"></i> 履歴消去
                                                        </button>
                                                    )}
                                                </div>

                                                {myHistory.length === 0 ? (
                                                    <div className="text-center py-4 border border-dashed border-slate-700 rounded-xl my-auto">
                                                        <p className="text-[11px] text-slate-400 font-medium">まだ投稿した意見はありません</p>
                                                        <p className="text-[10px] text-slate-500 mt-0.5">下のフォームから意見を送信してみましょう！</p>
                                                    </div>
                                                ) : (
                                                    <div className="space-y-1.5 flex-1 overflow-y-auto pr-1">
                                                        {myHistory.map((item) => (
                                                            <div 
                                                                key={item.id} 
                                                                className={`${item.color} p-2 rounded-xl border shadow-xs flex flex-col justify-between transition hover:shadow-sm`}>
                                                                <div className="flex items-center justify-between gap-1.5 mb-1">
                                                                    <div className="flex items-center gap-1.5">
                                                                        <span className="text-[9px] font-bold bg-black/10 text-slate-800 px-1.5 py-0.2 rounded flex items-center gap-1">
                                                                            <span>{getAvatarByName(item.author)}</span>
                                                                            <span>{item.author || '受講者'}</span>
                                                                        </span>
                                                                        {item.createdAt && (
                                                                            <span className="text-[9px] text-black/60 font-mono">
                                                                                🕒 {item.createdAt}
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                    <div className="flex items-center gap-1">
                                                                        <button 
                                                                            onClick={() => handleReuseHistory(item)}
                                                                            title="この内容をもう一度入力欄にセット"
                                                                            className="text-slate-700 hover:text-slate-900 bg-white/70 hover:bg-white px-1.5 py-0.5 rounded text-[9px] font-bold transition flex items-center gap-1 shadow-2xs">
                                                                            <i className="fa-solid fa-arrow-rotate-left text-[8px]"></i> 再利用
                                                                        </button>
                                                                        <button 
                                                                            onClick={() => handleCancelSend(item)}
                                                                            title="この意見の送信を取り消す"
                                                                            className="text-rose-700 hover:text-white bg-rose-500/15 hover:bg-rose-600 px-1.5 py-0.5 rounded text-[9px] font-bold transition flex items-center gap-1 border border-rose-400/30">
                                                                            <i className="fa-solid fa-trash-can text-[8px]"></i> 取消
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                                <p className="text-xs font-medium leading-snug break-words text-slate-800">
                                                                    {item.text}
                                                                </p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            {/* 📝 意見投稿フォーム */}
                                            <div className="bg-slate-800/95 rounded-2xl p-2.5 border border-slate-700 shadow-xl backdrop-blur-sm shrink-0 flex flex-col gap-2">
                                                {/* 名前入力 & 班カラーパレット */}
                                                <div className="flex flex-col gap-1.5">
                                                    <div className="flex items-center gap-1.5">
                                                        <span className="text-[11px] font-bold text-slate-300 shrink-0">お名前/班:</span>
                                                        <div className="relative flex-1">
                                                            <input 
                                                                type="text"
                                                                value={participantName}
                                                                onChange={(e) => handleParticipantNameChange(e.target.value)}
                                                                placeholder="例: 山田 / A班"
                                                                className="w-full bg-slate-900 border border-slate-600 rounded-lg px-2 py-1 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 pl-6"
                                                            />
                                                            <span className="absolute left-1.5 top-1/2 -translate-y-1/2 text-xs">
                                                                {getAvatarByName(participantName)}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center gap-1 overflow-x-auto pb-0.5 pt-0.5">
                                                        <span className="text-[10px] font-bold text-slate-400 shrink-0 mr-0.5">色:</span>
                                                        {COLOR_PALETTE.map((c) => (
                                                            <button
                                                                key={c.id}
                                                                type="button"
                                                                onClick={() => setSelectedColor(c.id)}
                                                                title={c.name}
                                                                className={`px-1.5 py-0.5 rounded text-[10px] font-bold border transition shrink-0 cursor-pointer ${selectedColor === c.id ? 'ring-2 ring-indigo-400 scale-105 shadow-sm ' + c.id : 'opacity-70 hover:opacity-100 ' + c.id}`}>
                                                                {c.label}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                <form onSubmit={handleSendParticipantCard} className="flex flex-col gap-1.5">
                                                    <div className="relative">
                                                        <textarea
                                                            value={inputText}
                                                            onChange={(e) => setInputText(e.target.value)}
                                                            disabled={isSubmissionsLocked}
                                                            placeholder={isSubmissionsLocked ? "現在、講師により投稿受付が一時停止されています" : "あなたの意見や気づきを入力してください..."}
                                                            rows="2"
                                                            className={`w-full ${selectedColor} border rounded-xl p-2 text-xs placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none font-medium leading-snug transition ${isSubmissionsLocked ? 'opacity-50 cursor-not-allowed' : ''}`}
                                                            onKeyDown={(e) => {
                                                                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                                                                    handleSendParticipantCard(e);
                                                                }
                                                            }}
                                                        ></textarea>
                                                    </div>
                                                    <button
                                                        type="submit"
                                                        disabled={isSubmissionsLocked || !inputText.trim()}
                                                        className={`w-full py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow active:scale-95 cursor-pointer ${isSubmissionsLocked || !inputText.trim() ? 'bg-slate-700 text-slate-400 cursor-not-allowed opacity-60' : 'bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white'}`}>
                                                        <i className="fa-solid fa-paper-plane text-[10px]"></i>
                                                        <span>{isSubmissionsLocked ? '受付停止中' : 'ボードに意見を送信'}</span>
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    ) : participantTab === 'timeline' ? (
                                        /* 💬 みんなの意見タイムライン */
                                        <div className="bg-slate-800/95 rounded-2xl p-2.5 border border-slate-700 shadow-xl backdrop-blur-sm flex-1 flex flex-col min-h-0 overflow-hidden">
                                            <div className="flex items-center justify-between mb-1.5 pb-1 border-b border-slate-700/80 shrink-0">
                                                <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                                                    <i className="fa-solid fa-comments text-indigo-400"></i>
                                                    みんなの意見一覧
                                                    <span className="bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 text-[10px] px-1.5 py-0.2 rounded-full font-mono">
                                                        {cards.length} 件
                                                    </span>
                                                </h3>
                                                <div className="flex items-center gap-1 bg-slate-900 p-0.5 rounded-lg border border-slate-700 text-[10px]">
                                                    <button 
                                                        onClick={() => setTimelineSort('latest')}
                                                        className={`px-1.5 py-0.5 rounded font-bold transition ${timelineSort === 'latest' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                                                        新着順
                                                    </button>
                                                    <button 
                                                        onClick={() => setTimelineSort('votes')}
                                                        className={`px-1.5 py-0.5 rounded font-bold transition ${timelineSort === 'votes' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                                                        いいね順
                                                    </button>
                                                </div>
                                            </div>

                                            {cards.length === 0 ? (
                                                <div className="text-center py-12 border border-dashed border-slate-700 rounded-xl my-auto">
                                                    <p className="text-xs text-slate-400">まだ意見が投稿されていません</p>
                                                    <p className="text-[10px] text-slate-500 mt-1">「投稿」タブから最初の意見を送信してみましょう！</p>
                                                </div>
                                            ) : (
                                                <div className="space-y-2 flex-1 overflow-y-auto pr-1">
                                                    {cards
                                                        .slice()
                                                        .sort((a, b) => {
                                                            if (timelineSort === 'votes') return (b.votes || 0) - (a.votes || 0);
                                                            return 0;
                                                        })
                                                        .map((card) => {
                                                            const hasVoted = !!myVotes[card.id];
                                                            const category = categories.find(c => c.id === card.categoryId);
                                                            return (
                                                                <div 
                                                                    key={card.id} 
                                                                    className={`${card.color || 'sticky-yellow'} p-2.5 rounded-xl border shadow-xs flex flex-col justify-between gap-1 transition hover:shadow-sm`}>
                                                                    <div className="flex items-center justify-between gap-1.5">
                                                                        <div className="flex items-center gap-1.5 flex-wrap">
                                                                            <span className="text-[9px] font-bold bg-black/10 text-slate-800 px-1.5 py-0.2 rounded flex items-center gap-1">
                                                                                <span>{getAvatarByName(card.author)}</span>
                                                                                <span>{card.author || '受講者'}</span>
                                                                            </span>
                                                                            {category && (
                                                                                <span className="text-[9px] font-bold px-1.5 py-0.2 rounded bg-slate-800 text-white">
                                                                                    {category.title}
                                                                                </span>
                                                                            )}
                                                                        </div>
                                                                        <button
                                                                            onClick={() => handleToggleVote(card.id)}
                                                                            title={hasVoted ? "いいねを取り消す" : "共感した！"}
                                                                            className={`px-2 py-0.5 rounded-lg text-[10px] font-bold transition flex items-center gap-1 shadow-2xs border ${hasVoted ? 'bg-rose-500 text-white border-rose-600 scale-105' : 'bg-white/80 hover:bg-white text-slate-700 border-slate-300'}`}>
                                                                            <i className={`fa-solid fa-heart ${hasVoted ? 'text-white' : 'text-rose-500'}`}></i>
                                                                            <span>{card.votes || 0}</span>
                                                                        </button>
                                                                    </div>
                                                                    <p className="text-xs font-medium leading-relaxed break-words text-slate-800">
                                                                        {card.text}
                                                                    </p>
                                                                </div>
                                                            );
                                                        })
                                                    }
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        /* 📄 研修スライド（Googleスライド / PDF）スマホビュー */

                                                    <a 
                                                        href={slideUrl} 
                                                        target="_blank" 
                                                        rel="noreferrer"

                                                    <iframe
                                                        src={slideUrl}
                                                        className="w-full h-full border-0"
                                                        allowFullScreen={true}
                                                        frameBorder="0"

                                            ) : (

                                                    <p className="text-xs text-slate-300 font-bold">スライド資料は準備中です</p>
                                                    <p className="text-[10px] text-slate-400 mt-1">講師がGoogleスライドURLを設定すると、ここに自動で表示されます。</p>

                                </div>

                            /* 💻 受講者一般PCビュー（大画面デュアルパネル: 左 スライド/板書閲覧 + 右 投稿&タイムライン） */

                                    <div className="bg-slate-950 px-4 py-2 border-b border-slate-800 flex items-center justify-between gap-3 shrink-0">
                                        <div className="flex items-center gap-1.5">
                                            <button 
                                                onClick={() => setParticipantPcTab('slide')}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${participantPcTab === 'slide' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                                                <i className="fa-solid fa-file-powerpoint text-indigo-300"></i>
                                                <span>研修スライド</span>
                                                {slideUrl && <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>}
                                            </button>
                                            <button 
                                                onClick={() => setParticipantPcTab('board')}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${participantPcTab === 'board' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                                                <i className="fa-solid fa-chalkboard text-indigo-300"></i>
                                                <span>板書ボード (閲覧)</span>
                                                <span className="bg-slate-800 text-slate-300 text-[10px] px-1.5 py-0.2 rounded-full font-mono">{cards.length}</span>
                                            </button>
                                        </div>

                                        <div className="flex items-center gap-3">
                                            {/* テーマタイトル */}
                                            <div className="hidden xl:flex items-center gap-1.5 bg-slate-900 px-3 py-1 rounded-xl border border-slate-800 text-xs text-white">
                                                <span className="text-[10px] bg-amber-400 text-slate-950 font-bold px-1.5 py-0.2 rounded">テーマ</span>
                                                <span className="font-bold truncate max-w-xs">{sessionThemeTitle}</span>
                                            </div>

                                            {/* タイマー */}
                                            {(timerSeconds > 0 || isTimeUp) && (
                                                <div className={`px-2.5 py-1 rounded-xl border flex items-center gap-1.5 font-bold text-xs shadow-xs ${isTimeUp ? 'bg-rose-900 border-rose-500 text-white animate-bounce' : (timerSeconds <= 30 ? 'bg-amber-900 border-amber-500 text-amber-200 animate-pulse' : 'bg-indigo-950 border-indigo-500/50 text-indigo-200')}`}>
                                                    <span>{isTimeUp ? '🔔 終了' : '⏱️'}</span>
                                                    <span className="font-mono">{formatTime(timerSeconds)}</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* パネルコンテンツ */}
                                    <div className="flex-1 min-h-0 p-3 bg-slate-900/60 overflow-hidden flex flex-col">
                                        {participantPcTab === 'slide' ? (

                                            slideUrl ? (
                                                <div className="flex-1 w-full h-full rounded-xl overflow-hidden bg-black border border-slate-700 relative">
                                                    <iframe
                                                        src={slideUrl}
                                                        className="w-full h-full border-0"
                                                        allowFullScreen={true}
                                                        frameBorder="0"
                                                    ></iframe>
                                                    <a 
                                                        href={slideUrl} 
                                                        target="_blank" 
                                                        rel="noreferrer"
                                                        className="absolute top-3 right-3 bg-slate-900/80 hover:bg-slate-900 text-indigo-300 hover:text-white px-2.5 py-1 rounded-lg text-xs font-bold border border-slate-700 shadow-md backdrop-blur-sm flex items-center gap-1.5 transition">
                                                        <i className="fa-solid fa-up-right-from-square text-[10px]"></i> 別窓で開く
                                                    </a>
                                                </div>
                                            ) : (
                                                <div className="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-800 rounded-2xl p-6 text-center">
                                                    <i className="fa-solid fa-file-powerpoint text-4xl text-slate-700 mb-3"></i>
                                                    <h3 className="text-sm font-bold text-slate-300">研修スライド資料は準備中です</h3>
                                                    <p className="text-xs text-slate-500 mt-1">講師がGoogleスライドURLを登録すると、ここに自動で投影されます。</p>

                                        ) : (

                                            <div className="flex-1 overflow-x-auto overflow-y-hidden flex gap-3.5 pb-2">
                                                {categories.map(cat => {
                                                    const catCards = cards.filter(c => c.categoryId === cat.id);
                                                    return (
                                                        <div key={cat.id} className="w-72 shrink-0 flex flex-col bg-slate-800/90 rounded-2xl border border-slate-700 shadow-md overflow-hidden">
                                                            <div className="p-3 border-b border-slate-700 bg-slate-800 flex items-center justify-between">
                                                                <span className="font-bold text-xs text-white truncate">{cat.title}</span>
                                                                <span className="bg-slate-900 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-mono font-bold">{catCards.length}</span>
                                                            </div>
                                                            {summaries[cat.id] && (
                                                                <div className="p-2.5 bg-indigo-950/60 border-b border-indigo-800/40 text-[11px] text-indigo-200 flex items-start gap-1.5">
                                                                    <i className="fa-solid fa-wand-magic-sparkles text-amber-300 mt-0.5 shrink-0"></i>
                                                                    <p className="leading-snug">{summaries[cat.id]}</p>
                                                                </div>
                                                            )}
                                                            <div className="flex-1 overflow-y-auto p-2.5 space-y-2">
                                                                {catCards.map(c => (
                                                                    <div key={c.id} className={`${c.color || 'sticky-yellow'} p-2.5 rounded-xl border shadow-xs flex flex-col justify-between gap-1`}>
                                                                        <div className="flex items-center justify-between text-[9px]">
                                                                            <span className="font-bold bg-black/10 px-1.5 py-0.2 rounded text-slate-800">{c.author || '受講者'}</span>
                                                                            <button 
                                                                                onClick={() => handleToggleVote(c.id)}
                                                                                className={`px-1.5 py-0.2 rounded flex items-center gap-1 font-bold ${myVotes[c.id] ? 'bg-rose-500 text-white' : 'bg-white/80 text-slate-700'}`}>
                                                                                <i className="fa-solid fa-heart text-rose-500"></i> {c.votes || 0}
                                                                            </button>
                                                                        </div>
                                                                        <p className="text-xs font-medium text-slate-800 leading-snug break-words">{c.text}</p>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* ➡ 右側パネル（40%幅・最大440px）：意見投稿フォーム ＆ タイムライン */}
                                <div className="flex-[2] max-w-md flex flex-col h-full min-h-0 gap-3">
                                    
                                    {/* 📝 意見投稿フォーム */}
                                    <div className="bg-slate-800/95 rounded-2xl p-3 border border-slate-700 shadow-xl backdrop-blur-sm shrink-0 flex flex-col gap-2.5">
                                        <div className="flex items-center justify-between border-b border-slate-700/80 pb-2">
                                            <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                                                <i className="fa-solid fa-pen-to-square text-indigo-400"></i>
                                                意見を投稿する
                                            </h3>
                                            {isSubmissionsLocked && (
                                                <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded font-bold flex items-center gap-1">
                                                    <i className="fa-solid fa-lock text-[9px]"></i> 受付停止中
                                                </span>
                                            )}
                                        </div>

                                        <div className="flex items-center gap-2">
                                            <span className="text-[11px] font-bold text-slate-300 shrink-0">お名前/班:</span>
                                            <div className="relative flex-1">
                                                <input 
                                                    type="text"
                                                    value={participantName}
                                                    onChange={(e) => handleParticipantNameChange(e.target.value)}
                                                    placeholder="例: 山田 / A班"
                                                    className="w-full bg-slate-900 border border-slate-600 rounded-lg px-2.5 py-1 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 pl-6"
                                                />
                                                <span className="absolute left-1.5 top-1/2 -translate-y-1/2 text-xs">
                                                    {getAvatarByName(participantName)}
                                                </span>
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-1 overflow-x-auto pb-0.5">
                                            <span className="text-[10px] font-bold text-slate-400 shrink-0 mr-0.5">色:</span>
                                            {COLOR_PALETTE.map((c) => (
                                                <button
                                                    key={c.id}
                                                    type="button"
                                                    onClick={() => setSelectedColor(c.id)}
                                                    title={c.name}
                                                    className={`px-1.5 py-0.5 rounded text-[10px] font-bold border transition shrink-0 cursor-pointer ${selectedColor === c.id ? 'ring-2 ring-indigo-400 scale-105 shadow-sm ' + c.id : 'opacity-70 hover:opacity-100 ' + c.id}`}>
                                                    {c.label}
                                                </button>
                                            ))}
                                        </div>

                                        <form onSubmit={handleSendParticipantCard} className="flex flex-col gap-1.5">
                                            <textarea
                                                value={inputText}
                                                onChange={(e) => setInputText(e.target.value)}
                                                disabled={isSubmissionsLocked}
                                                placeholder={isSubmissionsLocked ? "現在、講師により投稿受付が一時停止されています" : "あなたの意見や気づきを入力（Ctrl + Enterで送信）..."}
                                                rows="2"
                                                className={`w-full ${selectedColor} border rounded-xl p-2.5 text-xs placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none font-medium leading-snug transition ${isSubmissionsLocked ? 'opacity-50 cursor-not-allowed' : ''}`}
                                                onKeyDown={(e) => {
                                                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                                                        handleSendParticipantCard(e);
                                                    }
                                                }}
                                            ></textarea>
                                            <button
                                                type="submit"
                                                disabled={isSubmissionsLocked || !inputText.trim()}
                                                className={`w-full py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow active:scale-95 cursor-pointer ${isSubmissionsLocked || !inputText.trim() ? 'bg-slate-700 text-slate-400 cursor-not-allowed opacity-60' : 'bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white'}`}>
                                                <i className="fa-solid fa-paper-plane text-[10px]"></i>
                                                <span>{isSubmissionsLocked ? '受付停止中' : 'ボードに意見を送信 (Enter)'}</span>
                                            </button>
                                        </form>
                                    </div>

                                    {/* 💬 リアルタイム意見タイムライン ＆ 投稿履歴 */}
                                    <div className="bg-slate-800/95 rounded-2xl p-3 border border-slate-700 shadow-xl backdrop-blur-sm flex-1 min-h-0 flex flex-col overflow-hidden">
                                        <div className="flex items-center justify-between border-b border-slate-700/80 pb-2 mb-2 shrink-0">
                                            <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                                                <i className="fa-solid fa-comments text-indigo-400"></i>
                                                みんなの意見タイムライン
                                                <span className="bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 text-[10px] px-1.5 py-0.2 rounded-full font-mono">
                                                    {cards.length} 件
                                                </span>
                                            </h3>
                                            <div className="flex items-center gap-1 bg-slate-900 p-0.5 rounded-lg border border-slate-700 text-[10px]">
                                                <button 
                                                    onClick={() => setTimelineSort('latest')}
                                                    className={`px-1.5 py-0.5 rounded font-bold transition ${timelineSort === 'latest' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                                                    新着順
                                                </button>
                                                <button 
                                                    onClick={() => setTimelineSort('votes')}
                                                    className={`px-1.5 py-0.5 rounded font-bold transition ${timelineSort === 'votes' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                                                    いいね順
                                                </button>
                                            </div>
                                        </div>

                                        {cards.length === 0 ? (
                                            <div className="text-center py-8 border border-dashed border-slate-700 rounded-xl my-auto">
                                                <p className="text-xs text-slate-400">まだ意見が投稿されていません</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-2 flex-1 overflow-y-auto pr-1">
                                                {cards
                                                    .slice()
                                                    .sort((a, b) => {
                                                        if (timelineSort === 'votes') return (b.votes || 0) - (a.votes || 0);
                                                        return 0;
                                                    })
                                                    .map((card) => {
                                                        const hasVoted = !!myVotes[card.id];
                                                        const category = categories.find(c => c.id === card.categoryId);
                                                        return (
                                                            <div 
                                                                key={card.id} 
                                                                className={`${card.color || 'sticky-yellow'} p-2.5 rounded-xl border shadow-xs flex flex-col justify-between gap-1 transition hover:shadow-sm`}>
                                                                <div className="flex items-center justify-between gap-1.5">
                                                                    <div className="flex items-center gap-1.5 flex-wrap">
                                                                        <span className="text-[9px] font-bold bg-black/10 text-slate-800 px-1.5 py-0.2 rounded flex items-center gap-1">
                                                                            <span>{getAvatarByName(card.author)}</span>
                                                                            <span>{card.author || '受講者'}</span>
                                                                        </span>
                                                                        {category && (
                                                                            <span className="text-[9px] font-bold px-1.5 py-0.2 rounded bg-slate-800 text-white">
                                                                                {category.title}
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                    <button
                                                                        onClick={() => handleToggleVote(card.id)}
                                                                        className={`px-2 py-0.5 rounded-lg text-[10px] font-bold transition flex items-center gap-1 shadow-2xs border ${hasVoted ? 'bg-rose-500 text-white border-rose-600 scale-105' : 'bg-white/80 hover:bg-white text-slate-700 border-slate-300'}`}>
                                                                        <i className={`fa-solid fa-heart ${hasVoted ? 'text-white' : 'text-rose-500'}`}></i>
                                                                        <span>{card.votes || 0}</span>
                                                                    </button>
                                                                </div>
                                                                <p className="text-xs font-medium leading-relaxed break-words text-slate-800">
                                                                    {card.text}
                                                                </p>
                                                            </div>
                                                        );
                                                    })
                                                }
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )
                    ) : (
        /* Facilitator Board View */
        <>
            <div className="bg-white border-b border-slate-200 px-6 py-2.5 flex items-center justify-between shadow-sm z-10 shrink-0 gap-3">
                <form onSubmit={handleAddCard} className="flex items-center space-x-2.5 flex-1 max-w-5xl">
                    {/* ① 講師の名前入力 */}
