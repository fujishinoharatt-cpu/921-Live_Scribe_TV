                                        Gemini・ChatGPT・Google検索などは、サイト側の設定で画面内への埋め込みが拒否されるため、
                                        こちらでリンクとして配ってください。
                                    </p>

                                    {/* ⭐ 事前登録したリンク */}
                                    {savedLinks.length > 0 && (
                                        <div className="space-y-1.5">
                                            <p className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                                                <i className="fa-solid fa-star text-amber-500 text-[11px]"></i>
                                                よく使うリンク
                                                <span className="text-[10px] font-normal text-slate-400">タップして配る</span>
                                            </p>
                                            <div className="space-y-1">
                                                {savedLinks.map(l => (
                                                    <div key={l.id} className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-lg p-1.5">
                                                        <button
                                                            type="button"
                                                            onClick={() => handleShareLink(l.url, l.label)}
                                                            className="flex-1 min-w-0 text-left px-1.5 py-1 rounded hover:bg-white transition">
                                                            <p className="text-[11px] font-bold text-slate-800 truncate">
                                                                {l.label || l.url}
                                                            </p>
                                                            {l.label && <p className="text-[10px] text-slate-400 font-mono truncate">{l.url}</p>}
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => handleShareLink(l.url, l.label)}
                                                            className="shrink-0 bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold px-2 py-1.5 rounded-lg transition">
                                                            配る
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => handleDeleteSavedLink(l.id)}
                                                            title="登録を削除"
                                                            className="shrink-0 text-slate-400 hover:text-rose-500 px-1 py-1 transition">
                                                            <i className="fa-solid fa-xmark text-xs"></i>
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">URL</label>
                                        <input
                                            type="text"
                                            value={linkInputUrl}
                                            onChange={(e) => setLinkInputUrl(e.target.value)}
                                            placeholder="gemini.google.com"
                                            autoFocus
                                            onKeyDown={(e) => { if (e.key === 'Enter') handleShareLink(linkInputUrl, linkInputLabel); }}
                                            className="w-full border border-slate-300 rounded-xl p-2.5 text-xs font-mono focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                        />
                                        <p className="text-[10px] text-slate-400 mt-1">https:// は省略できます</p>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">
                                            表示名 <span className="font-normal text-slate-400">（任意）</span>
                                        </label>
                                        <input
                                            type="text"
                                            value={linkInputLabel}
                                            onChange={(e) => setLinkInputLabel(e.target.value)}
                                            placeholder="例: Gemini を開いて試してみましょう"
                                            onKeyDown={(e) => { if (e.key === 'Enter') handleShareLink(linkInputUrl, linkInputLabel); }}
                                            className="w-full border border-slate-300 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                        />
                                    </div>

                                    <button
                                        type="button"
                                        onClick={handleAddSavedLink}
                                        className="w-full py-1.5 text-[11px] font-bold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl transition flex items-center justify-center gap-1.5">
                                        <i className="fa-solid fa-star text-[10px]"></i>
                                        いまの内容を「よく使うリンク」に登録
                                    </button>

                                    {/* 投影して読み取ってもらう用のQR */}
                                    {sharedLink && sharedLink.url && (
                                        <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-center space-y-2">
                                            <p className="text-[11px] font-bold text-slate-700">
                                                <i className="fa-solid fa-qrcode text-slate-500 mr-1"></i>
                                                配信中（投影してスマホで読み取れます）
                                            </p>
                                            <div className="bg-white p-3 rounded-xl inline-block border border-slate-200">
                                                <img
                                                    src={`https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=50&data=${encodeURIComponent(sharedLink.url)}`}
                                                    alt="共有リンクQR"
                                                    className="w-40 h-40 block"
                                                />
                                            </div>
                                            <p className="text-[10px] text-slate-500 font-mono break-all">{sharedLink.url}</p>
                                        </div>
                                    )}

                                    <div className="flex flex-col gap-2 pt-2 border-t border-slate-100">
                                        <div className="flex items-center gap-2">
                                            <button
                                                onClick={() => setShowLinkModal(false)}
                                                className="flex-1 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                                                キャンセル
                                            </button>
                                            <button
                                                onClick={() => handleShareLink(linkInputUrl, linkInputLabel)}
                                                className="flex-1 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow transition flex items-center justify-center gap-1.5 cursor-pointer">
                                                <i className="fa-solid fa-paper-plane"></i>
                                                受講者に配る
                                            </button>
                                        </div>

                                        {sharedLink && (
                                            <button
                                                onClick={() => { handleClearSharedLink(); setShowLinkModal(false); }}
                                                className="text-[11px] text-rose-500 hover:text-rose-700 py-1 transition flex items-center justify-center gap-1 cursor-pointer">
                                                <i className="fa-solid fa-trash-can text-[10px]"></i>
                                                共有を解除
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 📄 研修スライド（Googleスライド / PDF）設定モーダル */}
                    {showSlideModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            {/* 画面より高くならないよう、見出しは固定して中身だけスクロールさせる */}
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-150 max-h-[90dvh] flex flex-col">
                                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 shrink-0">
                                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-file-powerpoint text-indigo-600"></i>
                                        研修スライド資料の設定
                                    </h3>
                                    <button onClick={() => setShowSlideModal(false)} className="text-slate-400 hover:text-slate-600 text-sm">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-3 flex-1 min-h-0 overflow-y-auto -mr-2 pr-2">

                                    {/* ============ A: 受講者へ配信する資料 ============ */}
                                    <div className="border-2 border-emerald-300 rounded-xl overflow-hidden">
                                        <div className="bg-emerald-600 px-3 py-2">
                                            <p className="text-xs font-bold text-white flex items-center gap-1.5">
                                                <i className="fa-solid fa-users"></i>
                                                A. 受講者へ配信する資料（PDF）
                                            </p>
                                            <p className="text-[10px] text-emerald-50 mt-0.5">
                                                {allSlidePages.length > 0
                                                    ? `読み込み済み: ${slideDeckInfo ? slideDeckInfo.fileName : ''}（全${allSlidePages.length}ページ）`
                                                    : 'PDFを選ぶと、指定した範囲だけが受講者に届きます'}
                                            </p>
                                        </div>

                                        <div className="p-3 space-y-3 bg-emerald-50/60">
                                            {/* A-1 PDFを選ぶ */}
                                            <div className="bg-white rounded-lg border border-emerald-200 p-2.5 space-y-2">
                                                <p className="text-[11px] font-bold text-slate-800">
                                                    A-1. PDFを選ぶ
                                                    <span className="ml-1 font-normal text-[10px] text-emerald-700">選んだ時点で配信されます</span>
                                                </p>
                                                <p className="text-[10px] text-slate-500 leading-relaxed">
                                                    Googleスライド / ドキュメントは「ファイル → ダウンロード → PDF」で書き出してから選んでください。
                                                </p>
                                                <input
                                                    type="file"
                                                    accept="application/pdf,.pdf"
                                                    disabled={!!slideDeckProgress}
                                                    onChange={(e) => {
                                                        const f = e.target.files && e.target.files[0];
                                                        e.target.value = '';
                                                        handleLoadSlidePdf(f);
                                                    }}
                                                    className="w-full text-[11px] text-slate-600 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[11px] file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 file:cursor-pointer disabled:opacity-50"
                                                />

                                                {slideDeckProgress && (
                                                    <div className="space-y-1">
                                                        <div className="flex items-center justify-between text-[10px] font-bold text-emerald-800">
                                                            <span><i className="fa-solid fa-spinner fa-spin mr-1"></i>{slideDeckProgress.label}</span>
                                                            <span className="font-mono">{slideDeckProgress.done} / {slideDeckProgress.total}</span>
                                                        </div>
                                                        <div className="h-1.5 bg-emerald-100 rounded-full overflow-hidden">
                                                            <div
                                                                className="h-full bg-emerald-500 transition-all"
                                                                style={{ width: (slideDeckProgress.total > 0 ? Math.round((slideDeckProgress.done / slideDeckProgress.total) * 100) : 0) + '%' }}></div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* A-2 公開範囲 */}
                                            <div className="bg-white rounded-lg border border-emerald-200 p-2.5 space-y-2">
                                                <p className="text-[11px] font-bold text-slate-800">
                                                    A-2. 受講者に見せるページ範囲
                                                </p>

                                                <div className="flex items-center gap-1.5">
                                                    <input
                                                        type="number"
                                                        min="1"
                                                        value={slideInputPageStart}
                                                        onChange={(e) => setSlideInputPageStart(Math.max(1, parseInt(e.target.value, 10) || 1))}
                                                        className="w-16 border border-slate-300 rounded-lg p-1.5 text-xs text-center font-bold bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                                    />
                                                    <span className="text-slate-400 font-bold text-xs">〜</span>
                                                    <input
                                                        type="number"
                                                        min="1"
                                                        value={slideInputPageEnd}
                                                        onChange={(e) => setSlideInputPageEnd(Math.max(1, parseInt(e.target.value, 10) || 1))}
                                                        className="w-16 border border-slate-300 rounded-lg p-1.5 text-xs text-center font-bold bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                                    />
                                                    <span className="text-[10px] text-slate-500 shrink-0">ページ</span>
                                                    {allSlidePages.length > 0 && (
                                                        <span className="text-[10px] text-slate-400 shrink-0">/ 全{allSlidePages.length}P</span>
                                                    )}
                                                </div>

                                                {allSlidePages.length > 0 ? (
                                                    <>
                                                        <button
                                                            type="button"
                                                            onClick={() => {
                                                                applyPublishRange(slideInputPageStart, slideInputPageEnd);
                                                                showToast(`📄 公開範囲を ${slideInputPageStart}〜${slideInputPageEnd}P に変更しました`);
                                                            }}
                                                            className="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold py-2 rounded-lg transition flex items-center justify-center gap-1.5">
                                                            <i className="fa-solid fa-check text-[10px]"></i>
                                                            この範囲で公開する
                                                        </button>
                                                        <p className="text-[10px] text-slate-500 text-center">
                                                            いま公開中:
                                                            <b className="text-emerald-700 ml-1">
                                                                {slidePages.length > 0
                                                                    ? `${slidePages[0].page} 〜 ${slidePages[slidePages.length - 1].page} ページ`
                                                                    : 'なし'}
                                                            </b>
                                                        </p>
                                                    </>
                                                ) : (
                                                    <p className="text-[10px] text-slate-500">
                                                        ここで指定した範囲が、A-1でPDFを選んだときに配信されます。
                                                    </p>
                                                )}

                                                {(() => {
                                                    const count = Math.max(0, slideInputPageEnd - slideInputPageStart + 1);
                                                    if (count <= 0) return null;
                                                    const mb = (count * 0.1).toFixed(1);
                                                    const heavy = count > 20;
                                                    return (
                                                        <p className={`text-[10px] leading-relaxed rounded-lg p-2 border ${heavy ? 'bg-amber-50 border-amber-200 text-amber-800' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>
                                                            {heavy && <i className="fa-solid fa-triangle-exclamation mr-1"></i>}
                                                            この範囲は <b>{count}ページ</b>（受講者1人あたり約{mb}MB）。
                                                            {heavy
                                                                ? ' 一度に配るには多く、配信に時間がかかります。進行に合わせて広げる使い方を推奨します。'
                                                                : ' 快適に配信できる範囲です。'}
                                                        </p>
                                                    );
                                                })()}

                                                <p className="text-[10px] text-emerald-900 bg-emerald-50 border border-emerald-200 rounded-lg p-2 leading-relaxed">
                                                    <i className="fa-solid fa-lock-open text-emerald-600 mr-1"></i>
                                                    答えが次ページにある場合は<b>手前のページまで</b>を指定し、投影画面の「次の1P公開」で開放してください。
                                                </p>
                                            </div>

                                            {/* A-3 解除 */}
                                            {allSlidePages.length > 0 && !slideDeckProgress && (
                                                <button
                                                    type="button"
                                                    onClick={handleClearSlideDeck}
                                                    className="w-full text-[11px] font-bold text-rose-600 hover:text-white hover:bg-rose-600 border border-rose-300 rounded-lg py-2 transition flex items-center justify-center gap-1.5">
                                                    <i className="fa-solid fa-trash-can text-[10px]"></i>
                                                    受講者への配信をやめる
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    {/* ============ B: 講師の投影用URL ============ */}
                                    <div className="border-2 border-slate-300 rounded-xl overflow-hidden">
                                        <div className="bg-slate-600 px-3 py-2">
                                            <p className="text-xs font-bold text-white flex items-center gap-1.5">
                                                <i className="fa-solid fa-desktop"></i>
                                                B. 講師の投影用URL（任意）
                                            </p>
                                            <p className="text-[10px] text-slate-200 mt-0.5">
                                                {allSlidePages.length > 0
                                                    ? 'Googleスライドをそのまま投影できます。受講者には届きません'
                                                    : 'Aが未設定のときは、このURLが受講者にも共有されます'}
                                            </p>
                                        </div>

                                        <div className="p-3 space-y-2 bg-slate-50/60">
                                            <div className="bg-white rounded-lg border border-slate-200 p-2.5 space-y-2">
                                                <input
                                                    type="url"
                                                    value={slideInputUrl}
                                                    onChange={(e) => setSlideInputUrl(e.target.value)}
                                                    placeholder="https://docs.google.com/presentation/d/.../edit"
                                                    className="w-full border border-slate-300 rounded-lg p-2 text-xs font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                                />
                                                <button
                                                    type="button"
                                                    onClick={() => handleSaveSlideUrl(slideInputUrl, slideInputPageStart, slideInputPageEnd)}
                                                    className="w-full bg-slate-700 hover:bg-slate-800 text-white text-[11px] font-bold py-2 rounded-lg transition flex items-center justify-center gap-1.5">
                                                    <i className="fa-solid fa-check text-[10px]"></i>
                                                    このURLを設定する
                                                </button>
                                                {slideUrl && (
                                                    <p className="text-[10px] text-slate-500 text-center truncate">
                                                        設定中: <b className="text-slate-700">{slideUrl}</b>
                                                    </p>
                                                )}
                                            </div>

                                            {slideUrl && (
                                                <button
                                                    type="button"
                                                    onClick={() => handleSaveSlideUrl('', 1, 0)}
                                                    className="w-full text-[11px] font-bold text-rose-600 hover:text-white hover:bg-rose-600 border border-rose-300 rounded-lg py-2 transition flex items-center justify-center gap-1.5">
                                                    <i className="fa-solid fa-trash-can text-[10px]"></i>
                                                    投影用URLを解除する
                                                </button>
                                            )}

                                            <p className="text-[10px] text-slate-600 bg-slate-100 border border-slate-200 rounded-lg p-2 leading-relaxed">
                                                <i className="fa-solid fa-circle-exclamation text-slate-500 mr-1"></i>
                                                Gemini・ChatGPT・Google検索などは<b>サイト側が埋め込みを拒否</b>します。
                                                こうしたサイトはヘッダーの<b>「リンク共有」</b>から配ってください。
                                            </p>
                                        </div>
                                    </div>

                                    <button
                                        onClick={() => setShowSlideModal(false)}
                                        className="w-full py-2.5 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">
                                        閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ⚙️ Gemini API 設定モーダル */}
                    {showConfigModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-150 max-h-[90dvh] overflow-y-auto">
                                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-wand-magic-sparkles text-indigo-600"></i>
                                        Gemini AI 設定
                                        <span className="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-mono font-bold">
                                            gemini-2.5-flash
                                        </span>
                                    </h3>
                                    <button onClick={() => setShowConfigModal(false)} className="text-slate-400 hover:text-slate-600 text-sm">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-[11px] text-slate-600 space-y-1">
                                        <p className="font-bold text-slate-700 flex items-center gap-1.5">
                                            <i className="fa-solid fa-shield-halved text-emerald-600"></i>
                                            セキュリティについて
                                        </p>
                                        <p>APIキーはお使いのブラウザ（LocalStorage）にのみ安全に保存され、GitHubや参加者のスマホには一切共有されません。</p>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">
                                            Google Gemini API キー
                                        </label>
                                        <input 
                                            type="password"
                                            value={configInputKey}
                                            onChange={(e) => setConfigInputKey(e.target.value)}
                                            placeholder="AIzaSy..."
                                            className="w-full border border-slate-300 rounded-xl p-2.5 text-xs font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        />
                                        <div className="flex justify-between items-center mt-1.5 text-[11px]">
                                            <a 
                                                href="https://aistudio.google.com/app/apikey" 
                                                target="_blank" 
                                                rel="noreferrer" 
                                                className="text-indigo-600 hover:underline flex items-center gap-1">
                                                <i className="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                                                APIキーを無料取得 (Google AI Studio)
                                            </a>
                                            {geminiApiKey && (
                                                <span className="text-emerald-600 font-bold flex items-center gap-1">
                                                    <i className="fa-solid fa-circle-check"></i> 設定済
                                                </span>
                                            )}
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-2 pt-2">
                                        <div className="flex items-center gap-2">
                                            <button 
                                                onClick={handleTestApiKey}
                                                disabled={isTestingKey}
                                                className="flex-1 py-2 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition flex items-center justify-center gap-1.5 disabled:opacity-50">
                                                <i className={`fa-solid ${isTestingKey ? 'fa-spinner fa-spin' : 'fa-bolt'}`}></i>
                                                {isTestingKey ? '接続確認中...' : '接続テスト'}
                                            </button>
                                            <button 
                                                onClick={handleSaveApiKey}
                                                className="flex-1 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow transition flex items-center justify-center gap-1.5">
                                                <i className="fa-solid fa-floppy-disk"></i>
                                                保存する
                                            </button>
                                        </div>

                                        {geminiApiKey && (
                                            <button 
                                                onClick={handleDeleteApiKey}
                                                className="text-[11px] text-rose-500 hover:text-rose-700 py-1 transition flex items-center justify-center gap-1">
                                                <i className="fa-solid fa-trash-can text-[10px]"></i>
                                                保存中のAPIキーを削除
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ⚙️ メニュー・設定統合モーダル（AI整理・保存・記録・新規・設定を一括集約） */}
                    {showMenuModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-xs">
                            <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-sliders text-indigo-600"></i>
                                        メニュー・板書管理
                                    </h3>
                                    <button 
                                        onClick={() => setShowMenuModal(false)}
                                        className="text-slate-400 hover:text-slate-600 p-1 text-base transition">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-4 pt-3">
                                    {/* 1. 🔮 AIアシスト */}
                                    <div>
                                        <h4 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">🔮 AI機能</h4>
                                        <button
                                            onClick={() => {
                                                setShowMenuModal(false);
                                                handleAiCluster();
                                            }}
                                            disabled={isAiProcessing}
                                            className="w-full p-3 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white shadow font-bold flex items-center justify-between transition active:scale-[0.98] disabled:opacity-50 text-left">
                                            <div className="flex items-center gap-3">
                                                <div className="w-9 h-9 rounded-lg bg-white/20 flex items-center justify-center text-lg">
                                                    <i className={`fa-solid ${isAiProcessing ? 'fa-spinner fa-spin' : 'fa-wand-magic-sparkles'} text-amber-300`}></i>
                                                </div>
                                                <div>
                                                    <div className="text-xs font-bold">AI自動整理・グループ要約</div>
                                                    <div className="text-[10px] text-indigo-200 font-normal">受講者の意見を自動で分類し各グループの要約文を作成</div>
                                                </div>
                                            </div>
                                            <i className="fa-solid fa-chevron-right text-xs text-white/60"></i>
                                        </button>
                                    </div>

                                    {/* 2. 📁 板書データ管理 */}
                                    <div>
                                        <h4 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">📁 板書データ管理</h4>
                                        <div className="grid grid-cols-1 gap-2">
                                            <button
                                                onClick={() => {
                                                    setShowMenuModal(false);
                                                    handleOpenSaveSnapshotModal();
                                                }}
                                                className="p-2.5 rounded-xl border border-slate-200 hover:border-indigo-300 bg-slate-50 hover:bg-indigo-50/50 flex items-center justify-between transition text-left group">
                                                <div className="flex items-center gap-2.5">
                                                    <div className="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center text-sm">
                                                        <i className="fa-solid fa-floppy-disk"></i>
                                                    </div>
                                                    <div>
                                                        <div className="text-xs font-bold text-slate-800 group-hover:text-indigo-600">現在の板書を保存</div>
                                                        <div className="text-[10px] text-slate-500">名前をつけてアーカイブに記録</div>
                                                    </div>
                                                </div>
                                                <i className="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:text-indigo-600"></i>
                                            </button>

                                            <button
                                                onClick={() => {
                                                    setShowMenuModal(false);
                                                    setShowArchiveModal(true);
                                                }}
                                                className="p-2.5 rounded-xl border border-slate-200 hover:border-indigo-300 bg-slate-50 hover:bg-indigo-50/50 flex items-center justify-between transition text-left group">
                                                <div className="flex items-center gap-2.5">
                                                    <div className="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center text-sm">
                                                        <i className="fa-solid fa-box-archive"></i>
                                                    </div>
                                                    <div>
                                                        <div className="text-xs font-bold text-slate-800 group-hover:text-indigo-600 flex items-center gap-1.5">
                                                            <span>過去の記録・復元</span>
                                                            <span className="bg-indigo-600 text-white text-[9px] px-1.5 py-0.2 rounded-full font-mono font-bold">
                                                                {archives.length}件
                                                            </span>
                                                        </div>
                                                        <div className="text-[10px] text-slate-500">過去の板書ログを表示・復元・JSONバックアップ</div>
                                                    </div>
                                                </div>
                                                <i className="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:text-indigo-600"></i>
                                            </button>

                                            <button
                                                onClick={() => {
                                                    setShowMenuModal(false);
                                                    handleOpenNewBoardModal();
                                                }}
                                                className="p-2.5 rounded-xl border border-slate-200 hover:border-amber-300 bg-slate-50 hover:bg-amber-50/50 flex items-center justify-between transition text-left group">
                                                <div className="flex items-center gap-2.5">
                                                    <div className="w-8 h-8 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center text-sm">
                                                        <i className="fa-solid fa-folder-plus"></i>
                                                    </div>
                                                    <div>
                                                        <div className="text-xs font-bold text-slate-800 group-hover:text-amber-700">新しい板書を開始</div>
                                                        <div className="text-[10px] text-slate-500">保存して次のワークショップへ進む</div>
                                                    </div>
                                                </div>
                                                <i className="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:text-amber-700"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {/* 3. ⚙️ 設定 & 出力 */}
                                    <div>
                                        <h4 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">⚙️ 設定 & 出力</h4>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button
                                                onClick={() => {
                                                    setShowMenuModal(false);
                                                    setShowExportModal(true);
                                                }}
                                                className="p-2 rounded-xl border border-slate-200 hover:bg-slate-50 flex items-center gap-2 text-xs font-bold text-slate-700 transition">
                                                <i className="fa-solid fa-file-export text-indigo-600"></i>
                                                <span>レポート出力</span>
                                            </button>

                                            <button
                                                onClick={() => {
                                                    setShowMenuModal(false);
                                                    setConfigInputKey(geminiApiKey);
                                                    setShowConfigModal(true);
                                                }}
                                                className="p-2 rounded-xl border border-slate-200 hover:bg-slate-50 flex items-center gap-2 text-xs font-bold text-slate-700 transition">
                                                <i className={`fa-solid fa-key ${geminiApiKey ? 'text-emerald-600' : 'text-amber-600'}`}></i>
                                                <span>APIキー設定</span>
                                            </button>
                                        </div>

                                        <div className="pt-2 text-center">
                                            <button
                                                onClick={() => {
                                                    setShowMenuModal(false);
                                                    handleResetData();
                                                }}
                                                className="text-[10px] text-slate-400 hover:text-rose-500 transition flex items-center gap-1 mx-auto">
                                                <i className="fa-solid fa-rotate-right text-[9px]"></i>
                                                データを初期サンプルに戻す
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function CategoryHeader({ cat, count, onUpdateTitle, onDelete, onSort, onMove, isFirst, isLast }) {
            const [isEditing, setIsEditing] = useState(false);
            const [title, setTitle] = useState(cat.title);

            useEffect(() => { setTitle(cat.title); }, [cat.title]);

            const handleSave = () => {
                if (title.trim() && title.trim() !== cat.title) {
                    onUpdateTitle(cat.id, title.trim());
                } else {
                    setTitle(cat.title);
                }
                setIsEditing(false);
            };

            return (
                <div className="p-3 border-b border-slate-100 bg-slate-50 group/header flex flex-col gap-1.5">
                    <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2 flex-1 min-w-0 mr-2">
                            <span className={`w-3 h-3 rounded-full shrink-0 ${cat.color}`}></span>
                            {isEditing ? (
                                <input
                                    type="text"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    onBlur={handleSave}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter') handleSave();
                                        if (e.key === 'Escape') setIsEditing(false);
                                    }}
                                    autoFocus
                                    className="font-bold text-slate-800 text-xs bg-white border border-indigo-400 rounded px-1.5 py-0.5 w-full focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                            ) : (
                                <h3
                                    onClick={() => setIsEditing(true)}
                                    title="クリックしてグループ名を編集"
                                    className="font-bold text-slate-800 text-sm truncate max-w-[170px] cursor-pointer hover:bg-slate-200/70 px-1.5 py-0.5 rounded transition flex items-center gap-1.5 group-hover/header:text-indigo-600">
                                    <span className="truncate">{cat.title}</span>
                                    <i className="fa-solid fa-pen text-[10px] text-slate-400 opacity-0 group-hover/header:opacity-100 transition shrink-0"></i>
                                </h3>
                            )}
                            <span className="bg-slate-200 text-slate-600 text-xs px-2 py-0.5 rounded-full font-bold shrink-0">
                                {count}
                            </span>
                        </div>
                        <div className="flex items-center gap-0.5 shrink-0">
                            {/* ◀▶ グループの並び替え（長押し不要のワンクリック移動） */}
                            {onMove && (
                                <>
                                    <button
                                        onClick={() => onMove(cat.id, 'left')}
                                        disabled={isFirst}
                                        title="このグループを1つ左へ（Shift+クリックで左端へ）"
                                        onMouseDown={(e) => { if (e.shiftKey) { e.preventDefault(); onMove(cat.id, 'first'); } }}
                                        className="text-slate-400 hover:text-indigo-600 hover:bg-slate-200 disabled:opacity-25 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-slate-400 p-1 rounded text-xs transition">
                                        <i className="fa-solid fa-chevron-left"></i>
                                    </button>
                                    <button
                                        onClick={() => onMove(cat.id, 'right')}
                                        disabled={isLast}
                                        title="このグループを1つ右へ（Shift+クリックで右端へ）"
                                        onMouseDown={(e) => { if (e.shiftKey) { e.preventDefault(); onMove(cat.id, 'last'); } }}
                                        className="text-slate-400 hover:text-indigo-600 hover:bg-slate-200 disabled:opacity-25 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-slate-400 p-1 rounded text-xs transition">
                                        <i className="fa-solid fa-chevron-right"></i>
                                    </button>
                                </>
                            )}
                            <button
                                onClick={() => onDelete(cat.id)}
                                title="グループ削除"
                                className="text-slate-400 hover:text-rose-500 p-1 text-xs transition">
                                <i className="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>

                    {/* クイック並び替えバー（カードが2枚以上あるとき表示） */}
                    {count >= 2 && onSort && (
                        <div className="flex items-center justify-between text-[10px] bg-slate-200/60 px-2 py-1 rounded-lg text-slate-500">
                            <span className="font-bold flex items-center gap-1">
                                <i className="fa-solid fa-arrow-down-short-wide"></i> 整列:
                            </span>
                            <div className="flex items-center gap-1">
                                <button 
                                    onClick={() => onSort(cat.id, 'votes')}
                                    title="いいねが多い順に整列"
                                    className="hover:bg-white hover:text-indigo-600 px-1.5 py-0.5 rounded transition font-bold">
                                    👍 いいね順
                                </button>
                                <button 
                                    onClick={() => onSort(cat.id, 'team')}
                                    title="班番号順（①〜⑧）に整列"
                                    className="hover:bg-white hover:text-indigo-600 px-1.5 py-0.5 rounded transition font-bold">
                                    🔢 班順
                                </button>
                                <button 
                                    onClick={() => onSort(cat.id, 'reverse')}
                                    title="上下の並び順を反転"
                                    className="hover:bg-white hover:text-indigo-600 px-1.5 py-0.5 rounded transition font-bold">
                                    🔄 反転
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StickyCard({ card, onDragStart, onCardDrop, onVote, onDelete, onUpdateText, onChangeLevel, onChangeColor }) {
            const [isEditing, setIsEditing] = useState(false);
            const [showColorPicker, setShowColorPicker] = useState(false);
            const [text, setText] = useState(card.text);
            const [isDragOver, setIsDragOver] = useState(false);

            useEffect(() => { setText(card.text); }, [card.text]);

            const handleSave = () => {
                if (text.trim() && text.trim() !== card.text) {
                    onUpdateText(card.id, text.trim());
                } else {
                    setText(card.text);
                }
                setIsEditing(false);
            };

            const level = card.level || 0; // 0=親・大項目, 1=中項目, 2=小項目・具体例

            // 3段階のインデントスタイルと左側のツリー分岐バー
            const indentClass = level === 2 
                ? 'ml-6 border-l-4 border-l-indigo-400 pl-2 shadow-sm' 
                : (level === 1 
                    ? 'ml-3 border-l-4 border-l-amber-400 pl-2 shadow-sm' 
                    : 'ml-0 border-l-4 border-l-transparent');

            return (
                <div 
                    draggable={!isEditing}
                    onDragStart={(e) => onDragStart(e, card.id)}
                    onDragOver={(e) => {
                        e.preventDefault();
                        setIsDragOver(true);
                    }}
                    onDragLeave={() => setIsDragOver(false)}
                    onDrop={(e) => {
                        setIsDragOver(false);
                        if (onCardDrop) onCardDrop(e, card.id, card.categoryId);
                    }}
                    className={`sticky-card ${card.color} ${indentClass} p-3 rounded-2xl border cursor-grab active:cursor-grabbing relative group transition-all duration-150 ${isDragOver ? 'ring-2 ring-indigo-500 scale-[1.02] shadow-lg border-indigo-400' : ''}`}>
                    
                    {/* 上段ヘッダー：名前・階層インジケータ ＋ 【階層調整・色変更・いいね・削除】 */}
                    <div className="mb-2 flex items-center justify-between gap-1">
                        <div className="flex items-center gap-1 min-w-0">
                            {/* 階層バッジ（中・小の場合に表示） */}
                            {level === 1 && (
                                <span className="text-[9px] font-black bg-amber-500/20 text-amber-900 px-1 py-0.2 rounded font-mono shrink-0" title="第2階層（中項目）">
                                    ↳ 中
                                </span>
                            )}
                            {level === 2 && (
                                <span className="text-[9px] font-black bg-indigo-500/20 text-indigo-900 px-1 py-0.2 rounded font-mono shrink-0" title="第3階層（小項目・具体）">
                                    ↳↳ 小
                                </span>
                            )}

                            <div className="text-[10px] font-bold bg-black/10 text-slate-800 px-1.5 py-0.5 rounded-md flex items-center gap-1 shadow-2xs shrink-0">
                                {/* ● カラー丸をクリックしても色パレットが開く */}
                                <button 
                                    type="button"
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        if (onChangeColor) setShowColorPicker(!showColorPicker);
                                    }}
                                    title="クリックして付箋の色を変更"
                                    className="flex items-center cursor-pointer hover:scale-125 transition">
                                    <span className={`w-2.5 h-2.5 rounded-full ${COLOR_PALETTE.find(c => c.id === (card.color || getColorByName(card.author)))?.dot || 'bg-amber-400'} ring-1 ring-black/30 shadow-xs`}></span>
                                </button>
                                <span className="text-xs">{getAvatarByName(card.author)}</span>
                                <span className="truncate max-w-[65px]">{card.author || '受講者'}</span>
                            </div>
                            {card.createdAt && (
                                <span className="text-[9px] text-black/50 font-mono shrink-0">🕒 {card.createdAt}</span>
                            )}
                        </div>

                        {/* アクションボタン群（階層変更・いいね・削除） */}
                        <div className="flex items-center gap-1 shrink-0">
                            {/* 階層変更ボタン（ホバー時・または階層設定時に表示） */}
                            {onChangeLevel && (
                                <div className="flex items-center gap-0.5 opacity-40 group-hover:opacity-100 transition bg-white/60 rounded-lg p-0.5 border border-black/5">
                                    {level > 0 && (
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                onChangeLevel(card.id, -1);
                                            }}
                                            title="↰ 階層を上げる（親に近づける）"
                                            className="hover:bg-white text-slate-700 hover:text-indigo-600 w-4 h-4 rounded flex items-center justify-center text-[10px] font-bold transition cursor-pointer">
                                            ↰
                                        </button>
                                    )}
                                    {level < 2 && (
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                onChangeLevel(card.id, 1);
                                            }}
                                            title="↳ 階層を下げる（子・具体例にする）"
                                            className="hover:bg-white text-slate-700 hover:text-indigo-600 w-4 h-4 rounded flex items-center justify-center text-[10px] font-bold transition cursor-pointer">
                                            ↳
                                        </button>
                                    )}
                                </div>
                            )}

                            {/* いいねボタン */}
                            <button 
                                onClick={(e) => {
                                    e.stopPropagation();
                                    onVote(card.id);
                                }}
                                title="いいね！"
                                className="flex items-center gap-1 hover:scale-110 transition active:scale-95 bg-white/70 hover:bg-white px-1.5 py-0.5 rounded-full text-slate-800 font-bold text-[11px] shadow-2xs cursor-pointer border border-black/5">
                                <span>👍</span>
                                <span className="font-mono text-xs">{card.votes || 0}</span>
                            </button>

                            {/* 削除ボタン */}
                            <button 
                                onClick={(e) => {
                                    e.stopPropagation();
                                    onDelete(card.id);
                                }}
                                title="付箋を削除"
                                className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-600 p-0.5 rounded transition text-xs cursor-pointer">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>

                    {/* 🎨 カラーパレットポップアップ（色選択） */}
                    {showColorPicker && onChangeColor && (
                        <div 
                            onClick={(e) => e.stopPropagation()}
                            className="mb-2 p-1.5 bg-white rounded-xl shadow-xl border border-slate-300 flex items-center justify-between gap-1 animate-in fade-in zoom-in duration-100 ring-2 ring-indigo-400/30">
                            <span className="text-[9px] font-bold text-slate-400 shrink-0 mr-0.5">色:</span>
                            {COLOR_PALETTE.map(color => (
                                <button
                                    key={color.id}
                                    type="button"
                                    onClick={() => {
                                        onChangeColor(card.id, color.id);
                                        setShowColorPicker(false);
                                    }}
                                    title={`カラー: ${color.numLabel} ${color.name}`}
                                    className={`w-5 h-5 rounded-md ${color.bg} ${color.text} flex items-center justify-center font-bold font-mono text-[9px] transition ${card.color === color.id ? 'ring-2 ring-slate-900 scale-110 shadow-sm' : 'hover:scale-105 opacity-70 hover:opacity-100'}`}>
                                    {color.numLabel}
                                </button>
                            ))}
                        </div>
                    )}

                    {/* 付箋本文 */}
                    {isEditing ? (
                        <textarea
                            value={text}
                            onChange={(e) => setText(e.target.value)}
                            onBlur={handleSave}
                            onKeyDown={(e) => {
                                if (e.key === 'Enter' && !e.shiftKey) {
                                    e.preventDefault();
                                    handleSave();
                                }
                            }}
                            autoFocus
                            className="w-full text-xs font-medium leading-relaxed bg-white/90 border border-indigo-400 rounded p-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none h-20"
                        />
                    ) : (
                        <div className="flex justify-between items-start gap-1">
                            <p 
                                onClick={() => setIsEditing(true)}
                                title="クリックして文字を編集"
                                className="text-xs font-medium leading-relaxed break-words cursor-pointer hover:bg-black/5 p-1 -m-1 rounded transition flex-1">
                                {card.text}
                            </p>
                            <button
                                onClick={() => setIsEditing(true)}
                                title="編集"
                                className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-slate-700 p-0.5 text-[10px] transition shrink-0">
                                <i className="fa-solid fa-pen"></i>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const rootRole = new URLSearchParams(window.location.search).get('role');
        ReactDOM.createRoot(document.getElementById('root')).render(
            rootRole === 'projector' ? <ProjectorView /> : <App />
        );
    </script>
</body>
</html>
