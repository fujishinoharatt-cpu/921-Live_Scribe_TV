                        osc.start(now + i * 0.18);
                        osc.stop(now + i * 0.18 + 0.6);
                    });
                } catch (e) {
                    console.warn('Audio context error:', e);
                }
            };

            // タイマーのカウントダウン処理（講師側のみ動作し、受講者へブロードキャスト）
            useEffect(() => {
                let interval = null;
                if (isTimerRunning && appRole === 'board') {
                    interval = setInterval(() => {
                        setTimerSeconds(prev => {
                            if (prev <= 1) {
                                setIsTimerRunning(false);
                                setIsTimeUp(true);
                                playTimeUpSound();
                                broadcastToClients({ 
                                    type: 'SYNC_TIMER', 
                                    seconds: 0, 
                                    total: timerTotalRef.current, 
                                    isRunning: false, 
                                    isTimeUp: true 
                                });
                                return 0;
                            }
                            const next = prev - 1;
                            broadcastToClients({ 
                                type: 'SYNC_TIMER', 
                                seconds: next, 
                                total: timerTotalRef.current, 
                                isRunning: true, 
                                isTimeUp: false 
                            });
                            return next;
                        });
                    }, 1000);
                }
                return () => {
                    if (interval) clearInterval(interval);
                };
            }, [isTimerRunning, appRole]);

            // タイマー開始・停止・リセットハンドラー
            const handleStartTimer = (minutes) => {
                const totalSec = minutes * 60;
                setTimerTotal(totalSec);
                setTimerSeconds(totalSec);
                setIsTimerRunning(true);
                setIsTimeUp(false);
                broadcastToClients({ 
                    type: 'SYNC_TIMER', 
                    seconds: totalSec, 
                    total: totalSec, 
                    isRunning: true, 
                    isTimeUp: false 
                });
                showToast(`⏱️ ${minutes}分タイマーを開始しました！`);
            };

            const handleToggleTimer = () => {
                if (timerSeconds <= 0) return;
                const nextRunning = !isTimerRunning;
                setIsTimerRunning(nextRunning);
                broadcastToClients({ 
                    type: 'SYNC_TIMER', 
                    seconds: timerSeconds, 
                    total: timerTotal, 
                    isRunning: nextRunning, 
                    isTimeUp: false 
                });
            };

            const handleResetTimer = () => {
                setIsTimerRunning(false);
                setTimerSeconds(0);
                setTimerTotal(0);
                setIsTimeUp(false);
                broadcastToClients({ 
                    type: 'SYNC_TIMER', 
                    seconds: 0, 
                    total: 0, 
                    isRunning: false, 
                    isTimeUp: false 
                });
            };

            // 投稿ロック切り替えハンドラー
            const handleToggleLock = () => {
                const nextLocked = !isSubmissionsLocked;
                setIsSubmissionsLocked(nextLocked);
                broadcastToClients({ type: 'SYNC_LOCK', isLocked: nextLocked });
                showToast(nextLocked ? '🔒 受講者の投稿受付を一時停止しました（解説モード）' : '🟢 受講者の投稿受付を再開しました！');
            };

            // 時間表示フォーマッタ（mm:ss）
            const formatTime = (totalSeconds) => {
                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            useEffect(() => {
                sessionThemeTitleRef.current = sessionThemeTitle;
            }, [sessionThemeTitle]);

            useEffect(() => {
                cardsRef.current = cards;
            }, [cards]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            // リアルタイム通信用クライアントID & 在室管理マップ
            const myClientId = useRef('user_' + Math.random().toString(36).substring(2, 9)).current;
            const activeClientsRef = useRef(new Map());
            const mqttClientRef = useRef(null);

            // ホストから全参加者へのブロードキャスト関数（MQTT）
            const broadcastToClients = (msg) => {
                if (mqttClientRef.current && mqttClientRef.current.connected) {
                    try {
                        const topic = `bansho/room/${activeRoomId}`;
                        mqttClientRef.current.publish(topic, JSON.stringify({ ...msg, senderId: myClientId }));
                    } catch (e) {
                        console.warn('Broadcast error:', e);
                    }
                }
            };

            // テーマタイトル変更時に全クライアントへ即時自動配信
            useEffect(() => {
                if (appRole === 'board') {
                    broadcastToClients({ type: 'SYNC_THEME', themeTitle: sessionThemeTitle });
                }
            }, [sessionThemeTitle, appRole]);

            // MQTT WebSocketによる100%確実なリアルタイム同期
            useEffect(() => {
                let isMounted = true;
                const topic = `bansho/room/${activeRoomId}`;
                const screenTopic = `${topic}/screen`;

                try {
                    console.log('Connecting to MQTT Broker for room:', activeRoomId);
                    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                        clientId: myClientId,
                        clean: true,
                        connectTimeout: 5000,
                        reconnectPeriod: 3000,
                        keepalive: 30
                    });
                    mqttClientRef.current = client;

                    client.on('connect', () => {
                        console.log('MQTT Connected successfully to topic:', topic);
                        if (!isMounted) return;
                        setPeerConnected(true);
                        client.subscribe(topic, { qos: 0 }, (err) => {
                            if (err) console.warn('Subscribe error:', err);
                            else {
                                if (appRole === 'participant') {
                                    // 画面フレームは専用トピック。講師は購読しないので
                                    // 自分の送ったフレームを受信し直す無駄が無くなる。
                                    client.subscribe(screenTopic, { qos: 0 }, (e2) => {
                                        if (e2) console.warn('Screen subscribe error:', e2);
                                    });
                                    client.publish(topic, JSON.stringify({
                                        type: 'JOIN',
                                        senderId: myClientId,
                                        author: participantName || '受講者'
                                    }));
                                    client.publish(topic, JSON.stringify({
                                        type: 'REQUEST_SYNC',
                                        senderId: myClientId
                                    }));
                                }
                            }
                        });
                    });

                    client.on('reconnect', () => {
                        console.log('MQTT Reconnecting...');
                    });

                    client.on('close', () => {
                        if (isMounted) setPeerConnected(false);
                    });

                    client.on('error', (err) => {
                        console.warn('MQTT Error:', err);
                    });

                    client.on('message', (t, message) => {
                        if (!isMounted) return;

                        // --- 画面フレーム（バイナリ）---
                        if (t === screenTopic) {
                            if (appRole !== 'participant') return;
                            try {
                                const frame = unpackScreenFrame(message);
                                if (!frame) return;
                                if (frame.targetClientId && frame.targetClientId !== myClientId) return;
                                const url = URL.createObjectURL(new Blob([frame.image], { type: frame.mime }));
                                setScreenFrame(prev => {
                                    if (prev && prev.startsWith('blob:')) URL.revokeObjectURL(prev);
                                    return url;
                                });
                                setIsScreenSharing(true);
                            } catch (e) {
                                console.warn('Screen frame decode error:', e);
                            }
                            return;
                        }

                        if (t !== topic) return;
                        try {
                            const data = JSON.parse(message.toString());
                            if (!data || data.senderId === myClientId) return; // 自分が送信したメッセージは無視

                            if (appRole === 'board') {
                                // 講師側でのメッセージ受信処理
                                if (data.type === 'JOIN' || data.type === 'HEARTBEAT') {
                                    activeClientsRef.current.set(data.senderId, Date.now());
                                    setConnectedCount(activeClientsRef.current.size);
                                } else if (data.type === 'REQUEST_SYNC') {
                                    activeClientsRef.current.set(data.senderId, Date.now());
                                    setConnectedCount(activeClientsRef.current.size);
                                    client.publish(topic, JSON.stringify({
                                        type: 'SYNC_FULL_STATE',
                                        senderId: myClientId,
                                        targetClientId: data.senderId,
                                        cards: cardsRef.current,
                                        categories: categoriesRef.current,
                                        sharedLink: sharedLinkRef.current,
                                        themeTitle: sessionThemeTitleRef.current,
                                        timer: {
                                            seconds: timerSecondsRef.current,
                                            total: timerTotalRef.current,
                                            isRunning: isTimerRunningRef.current
                                        },
                                        isLocked: isSubmissionsLockedRef.current,
                                        // デッキ配信中は受講者へURLを渡さない（範囲外の先読みを物理的に不可能にする）
                                        slideUrl: slidePagesRef.current.length > 0 ? '' : slideUrlRef.current,
                                        pageStart: slidePageStartRef.current,
                                        pageEnd: slidePageEndRef.current
                                    }));

                                    // 配信中なら最新の画面フレームを個別に送る
                                    if (screenLastFrameRef.current && screenLastFrameRef.current.bytes) {
                                        client.publish(
                                            screenTopic,
                                            packScreenFrame(
                                                screenLastFrameRef.current.bytes,
                                                screenLastFrameRef.current.mime,
                                                data.senderId
                                            ),
                                            { qos: 0 }
                                        );
                                    }

                                    // 途中参加者にもデッキを個別再送する
                                    if (slidePagesRef.current.length > 0) {
                                        broadcastSlideDeck(slidePagesRef.current, slideDeckInfoRef.current, data.senderId);
                                    }
                                } else if (data.type === 'REQUEST_SLIDE_PAGES') {
                                    // 受講者から「この番号が届いていない」と言われた分だけ送り直す
                                    const pub = slidePagesRef.current || [];
                                    const wanted = Array.isArray(data.pages) ? data.pages : [];
                                    (async () => {
                                        for (const pageNo of wanted) {
                                            const idx = pub.findIndex(p => p.page === pageNo);
                                            if (idx < 0) continue;
                                            client.publish(topic, JSON.stringify({
                                                type: 'SLIDE_DECK_APPEND',
                                                senderId: myClientId,
                                                targetClientId: data.senderId,
                                                index: idx,
                                                total: pub.length,
                                                page: pub[idx].page,
                                                dataUrl: pub[idx].dataUrl,
                                                silent: true
                                            }));
                                            await new Promise(r => setTimeout(r, 150));
                                        }
                                    })();
                                } else if (data.type === 'NEW_CARD') {
                                    setCards(prev => {
                                        const next = [data.card, ...prev];
                                        return next;
                                    });
                                    showToast(`📩 ${data.card.author || '受講者'}から意見が届きました！`);
                                } else if (data.type === 'DELETE_CARD') {
                                    setCards(prev => prev.filter(c => c.id !== data.cardId));
                                    showToast(`🗑️ ${data.author || '受講者'}が意見の送信を取り消しました`);
                                } else if (data.type === 'VOTE_CARD') {
                                    setCards(prev => prev.map(c => c.id === data.cardId ? { ...c, votes: Math.max(0, (c.votes || 0) + (data.delta || 1)) } : c));
                                }
                            } else if (appRole === 'participant') {
                                // 参加者側でのメッセージ受信処理
                                if (data.type === 'SYNC_FULL_STATE' && (!data.targetClientId || data.targetClientId === myClientId)) {
                                    if (data.cards) setCards(data.cards);
                                    if (data.categories) setCategories(data.categories);
                                    if (data.sharedLink !== undefined) setSharedLink(data.sharedLink);
                                    if (data.themeTitle) setSessionThemeTitle(data.themeTitle);
                                    if (data.timer) {
                                        setTimerSeconds(data.timer.seconds || 0);
                                        setTimerTotal(data.timer.total || 0);
                                        setIsTimerRunning(!!data.timer.isRunning);
                                    }
                                    if (typeof data.isLocked === 'boolean') {
                                        setIsSubmissionsLocked(data.isLocked);
                                    }
                                    if (data.slideUrl !== undefined) {
                                        setSlideUrl(data.slideUrl);
                                    }
                                    if (data.pageStart !== undefined) setSlidePageStart(data.pageStart);
                                    if (data.pageEnd !== undefined) setSlidePageEnd(data.pageEnd);
                                } else if (data.type === 'SCREEN_START') {
                                    setIsScreenSharing(true);
                                    setParticipantTab('screen');
                                    showToast('🖥️ 講師の画面配信が始まりました');
                                } else if (data.type === 'SCREEN_STOP') {
                                    setIsScreenSharing(false);
                                    setScreenFrame(prev => {
                                        if (prev && prev.startsWith('blob:')) URL.revokeObjectURL(prev);
                                        return null;
                                    });
                                    setParticipantTab(prev => prev === 'screen' ? 'post' : prev);
                                } else if (data.type === 'SYNC_SMALL_STATE') {
                                    // 取りこぼし復旧用。届いた内容で現在の状態を上書きする
                                    setSharedLink(data.sharedLink || null);
                                    if (typeof data.isLocked === 'boolean') setIsSubmissionsLocked(data.isLocked);
                                    if (data.screenSharing === false) {
                                        setIsScreenSharing(false);
                                        setScreenFrame(prev => {
                                            if (prev && prev.startsWith('blob:')) URL.revokeObjectURL(prev);
                                            return null;
                                        });
                                    }
                                } else if (data.type === 'SYNC_SHARED_LINK') {
                                    setSharedLink(data.link || null);
                                    if (data.link) {
                                        showToast('🔗 講師からリンクが届きました');
                                    }
                                } else if (data.type === 'SYNC_CATEGORIES') {
                                    if (data.categories) setCategories(data.categories);
                                } else if (data.type === 'SYNC_CARDS') {
                                    if (data.cards) setCards(data.cards);
                                    if (data.themeTitle) setSessionThemeTitle(data.themeTitle);
                                } else if (data.type === 'SYNC_SLIDE_URL') {
                                    setSlideUrl(data.slideUrl || '');
                                    if (data.pageStart !== undefined) setSlidePageStart(data.pageStart);
                                    if (data.pageEnd !== undefined) setSlidePageEnd(data.pageEnd);
                                    if (data.slideUrl) {
                                        const rText = data.pageEnd > 0 ? ` (公開範囲: ${data.pageStart || 1}〜${data.pageEnd}P)` : '';
                                        showToast(`📄 研修スライド資料が更新されました${rText}`);
                                    }
                                } else if (data.type === 'SLIDE_DECK_START') {
                                    if (data.targetClientId && data.targetClientId !== myClientId) return;
                                    slideDeckBufferRef.current = new Array(data.total).fill(null);
                                    setSlideDeckInfo(data.info || null);
                                    setSlideDeckProgress({ done: 0, total: data.total, label: '研修資料を受信中...' });
                                } else if (data.type === 'SLIDE_DECK_PAGE') {
                                    if (data.targetClientId && data.targetClientId !== myClientId) return;
                                    if (!slideDeckBufferRef.current || slideDeckBufferRef.current.length !== data.total) {
                                        slideDeckBufferRef.current = new Array(data.total).fill(null);
                                    }
                                    slideDeckBufferRef.current[data.index] = { page: data.page, dataUrl: data.dataUrl };
                                    const arrived = slideDeckBufferRef.current.filter(Boolean);
                                    setSlideDeckProgress({ done: arrived.length, total: data.total, label: '研修資料を受信中...' });
                                    setSlidePages(arrived); // 届いたページから順に閲覧できる
                                    setSlideUrl('');
                                } else if (data.type === 'SLIDE_DECK_END') {
                                    if (data.targetClientId && data.targetClientId !== myClientId) return;
                                    const arrived = (slideDeckBufferRef.current || []).filter(Boolean);
                                    setSlidePages(arrived);
                                    setSlideDeckProgress(null);
                                    setSlideUrl('');
                                    if (arrived.length > 0) {
                                        showToast(`📄 研修スライド（${arrived[0].page}〜${arrived[arrived.length - 1].page}P）を受信しました`);
                                    }
                                } else if (data.type === 'SLIDE_DECK_MANIFEST') {
                                    // 公開中の番号一覧と手元を突き合わせ、欠けていれば取り直す
                                    const want = Array.isArray(data.pages) ? data.pages : [];
                                    const buf = (slideDeckBufferRef.current || []).filter(Boolean);
                                    const have = new Set(buf.map(p => p.page));
                                    const missing = want.filter(n => !have.has(n));
                                    const extra = buf.filter(p => !want.includes(p.page));

                                    if (extra.length > 0) {
                                        // 公開範囲外になったページは手元から外す
                                        const trimmed = buf.filter(p => want.includes(p.page));
                                        slideDeckBufferRef.current = trimmed;
                                        setSlidePages(trimmed);
                                    }
                                    if (missing.length > 0 && !slideRepairPendingRef.current) {
                                        slideRepairPendingRef.current = true;
                                        setTimeout(() => { slideRepairPendingRef.current = false; }, 12000);
                                        client.publish(topic, JSON.stringify({
                                            type: 'REQUEST_SLIDE_PAGES',
                                            senderId: myClientId,
                                            pages: missing
                                        }));
                                    }
                                } else if (data.type === 'SLIDE_DECK_APPEND') {
                                    if (data.targetClientId && data.targetClientId !== myClientId) return;
                                    // 添字ではなくページ番号で管理し、常に番号順に並べる。
                                    // 途中の1枚を取りこぼしても順番がずれない。
                                    const buf = (slideDeckBufferRef.current || []).filter(Boolean);
                                    const nextPages = buf.filter(p => p.page !== data.page);
                                    nextPages.push({ page: data.page, dataUrl: data.dataUrl });
                                    nextPages.sort((a, b) => a.page - b.page);
                                    slideDeckBufferRef.current = nextPages;
                                    setSlidePages(nextPages);
                                    if (!data.silent) showToast(`🔓 ${data.page} ページが公開されました`);
                                } else if (data.type === 'SLIDE_DECK_TRUNCATE') {
                                    if (data.targetClientId && data.targetClientId !== myClientId) return;
                                    const buf = (slideDeckBufferRef.current || []).filter(Boolean).slice(0, data.total);
                                    slideDeckBufferRef.current = buf;
                                    setSlidePages(buf);
                                } else if (data.type === 'SLIDE_DECK_CLEAR') {
                                    slideDeckBufferRef.current = [];
                                    setSlidePages([]);
                                    setSlideDeckInfo(null);
                                    setSlideDeckProgress(null);
                                } else if (data.type === 'SYNC_TIMER') {
                                    setTimerSeconds(data.seconds || 0);
                                    setTimerTotal(data.total || 0);
                                    setIsTimerRunning(!!data.isRunning);
                                    if (data.isTimeUp) {
                                        setIsTimeUp(true);
                                        playTimeUpSound();
                                        showToast('🔔 ワークショップの制限時間が終了しました！');
                                    } else {
                                        setIsTimeUp(false);
                                    }
                                } else if (data.type === 'SYNC_LOCK') {
                                    setIsSubmissionsLocked(!!data.isLocked);
                                    showToast(data.isLocked ? '🔒 講師により投稿受付が一時停止されました' : '🟢 投稿受付が再開されました！');
                                } else if (data.type === 'SYNC_THEME') {
                                    if (data.themeTitle) {
                                        setSessionThemeTitle(data.themeTitle);
                                        showToast(`📌 テーマが「${data.themeTitle}」に更新されました`);
                                    }
                                } else if (data.type === 'SESSION_STARTED') {
                                    showToast(`📢 新しい板書「${data.title || '新規セッション'}」が開始されました！`);

                                }
                            }
                        } catch (err) {
                            console.warn('Message parsing error:', err);
                        }
                    });
                } catch (e) {
                    console.warn('MQTT init notice:', e);
                }

                return () => {
                    isMounted = false;
                    if (mqttClientRef.current) {
                        try { mqttClientRef.current.end(true); } catch (_) {}
                    }
                };
            }, [appRole, activeRoomId]);

            // 受講者のハートビート送信（15秒ごと） & 講師の接続者カウントクリーンアップ
            useEffect(() => {

                    const topic = `bansho/room/${activeRoomId}`;
                    if (appRole === 'participant' && mqttClientRef.current && mqttClientRef.current.connected) {
                        mqttClientRef.current.publish(topic, JSON.stringify({

                            senderId: myClientId,
                            author: participantName || '受講者'
                        }));

                        const now = Date.now();
                        let changed = false;
                        activeClientsRef.current.forEach((lastSeen, cId) => {
                            if (now - lastSeen > 45000) {

                                changed = true;
                            }

                if (mqttClientRef.current && mqttClientRef.current.connected) {
                    try {
                        mqttClientRef.current.publish(topic, JSON.stringify({

            // アーカイブを現在のボードに復元
            const handleRestoreArchive = (archive) => {

                // 進行設定の復元（スライド画像は含まれないのでPDFは選び直し）
                const st = archive.settings;

                    const ps = Math.max(1, parseInt(st.pageStart, 10) || 1);
                    const pe = Math.max(0, parseInt(st.pageEnd, 10) || 0);

                    setSlideInputPageEnd(pe > 0 ? pe : ps);

                    if ((allSlidePagesRef.current || []).length > 0 && pe > 0) {
                        // 資料が読み込まれていれば、その場で公開範囲を戻す

                    if ((allSlidePagesRef.current || []).length === 0) {

                            pageStart: ps,

                        });

            const handleDeleteArchive = (archiveId) => {

                showToast('アーカイブを削除しました');
            };

            // 📥 バックアップをJSONファイルとして保存（エクスポート）
            const handleExportBackupJson = () => {
                const now = new Date();
                const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
                const backupPayload = {
                    appName: 'bansho-app',
                    version: APP_VERSION,
                    exportedAt: now.toLocaleString('ja-JP'),
                    archives: archives,
                    currentBoard: {
                        cards: cards,
                        categories: categories,
                        summaries: summaries
                    }
                };

                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupPayload, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `bansho_backup_${dateStr}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast('📥 バックアップJSONファイルを保存しました！');
            };

            // 📤 バックアップJSONファイルを読み込み（インポート）
            const handleImportBackupJson = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (!imported || (!Array.isArray(imported.archives) && !imported.currentBoard)) {
                            throw new Error('バックアップJSONファイルの形式が正しくありません');
                        }

                        let importCount = 0;
                        if (Array.isArray(imported.archives) && imported.archives.length > 0) {
                            setArchives(prev => {
                                const existingIds = new Set(prev.map(a => a.id));
                                const newItems = imported.archives.filter(a => !existingIds.has(a.id));
                                importCount = newItems.length;
                                return [...newItems, ...prev];
                            });
                        }

                        if (imported.currentBoard && imported.currentBoard.cards && imported.currentBoard.cards.length > 0) {
                            if (confirm(`ファイルに含まれる現在の板書（${imported.currentBoard.cards.length}件）も画面に反映しますか？`)) {
                                setCards(imported.currentBoard.cards || []);
                                setCategories(imported.currentBoard.categories || INITIAL_CATEGORIES);
                                setSummaries(imported.currentBoard.summaries || {});
                            }
                        }

                        showToast(`📤 ${importCount}件の過去アーカイブを読み込みました！`);
                    } catch (err) {
                        alert('ファイル読み込みエラー: ' + err.message);
                    } finally {
                        e.target.value = '';
                    }
                };
                reader.readAsText(file);
            };

            // アーカイブ用のMarkdown生成
            const generateArchiveMarkdown = (arch) => {

                md += `- **総意見数:** ${arch.cards ? arch.cards.length : 0}件\n`;
                md += `- **総いいね数:** ${arch.totalVotes || 0}\n\n`;

                const archCats = arch.categories || INITIAL_CATEGORIES;
                const archCards = arch.cards || [];
                const archSummaries = arch.summaries || {};

                const uncategorized = archCards.filter(c => c.categoryId === null);
                if (uncategorized.length > 0) {
                    md += `## 📥 未分類 (${uncategorized.length}件)\n\n`;
                    uncategorized.forEach(c => {
                        md += `- ${c.text} (by ${c.author || '匿名'}, 👍 ${c.votes || 0})\n`;

                    md += `\n`;

                    md += `## ${cat.title} (${catCards.length}件)\n\n`;

            const handleResetData = () => {

                setCards(INITIAL_CARDS);
                setSummaries({});

                };

                setMyHistory(prev => [newCard, ...prev]);

                setInputText('');

            // 送信取り消し（講師ボードからも連動削除）
            const handleCancelSend = (item) => {

                if (!draggedCardId || draggedCardId === targetCardId) return;

                setCards(prevCards => {
                    const nextCards = [...prevCards];
                    const draggedIndex = nextCards.findIndex(c => c.id === draggedCardId);
                    if (draggedIndex === -1) return prevCards;

                    const [draggedCard] = nextCards.splice(draggedIndex, 1);
                    const updatedCard = { ...draggedCard, categoryId: targetCategoryId };

                    const targetIndex = nextCards.findIndex(c => c.id === targetCardId);
                    if (targetIndex !== -1) {
                        nextCards.splice(targetIndex, 0, updatedCard);
                    } else {
                        nextCards.push(updatedCard);
                    }
                    return nextCards;
                });
                setDraggedCardId(null);
            };

            // グループ枠の空きスペースにドロップした時の移動
            const handleDrop = (e, targetCategoryId) => {
                e.preventDefault();

                setCards(prevCards => {
                    const nextCards = [...prevCards];
                    const draggedIndex = nextCards.findIndex(c => c.id === draggedCardId);
                    if (draggedIndex === -1) return prevCards;

                    const [draggedCard] = nextCards.splice(draggedIndex, 1);
